<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actividades — Aula Virtual JRG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #17140f; color: #f2ece1; min-height: 100vh; }
  header { background: #f2ece1; color: #17140f; padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  header a { color: #17140f; text-decoration: none; font-size: 1.4rem; margin-right: 8px; }
  header h1 { font-size: 1.2rem; }
  main { padding: 24px; max-width: 640px; margin: 0 auto; }

  label { display: block; font-size: 0.85rem; color: #a89f8d; margin-bottom: 4px; margin-top: 16px; }
  input, select {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #3a3020; background: #201b13; color: #f2ece1; font-family: inherit; font-size: 1rem;
  }
  button {
    background: #d99a3d; color: #17140f; border: none;
    padding: 14px 20px; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer;
  }
  .btn-principal { width: 100%; margin-top: 20px; }
  #estadoLogin { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: #2a2013; color: #cfc6b6; font-size: 0.9rem; display: none; }

  .tag { color: #d99a3d; letter-spacing: 2px; font-size: 0.75rem; text-transform: uppercase; }
  h2 { font-size: 1.5rem; margin: 10px 0 4px; }
  .subtitulo { color: #a89f8d; margin-bottom: 20px; }

  .fila-encabezado-panel { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; padding-right: 100px; }
  .btn-salir { background: none; border: 1px solid #6b6252; color: #cfc6b6; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; white-space: nowrap; }

  .pestanas-bloque { display: flex; gap: 8px; margin-bottom: 20px; }
  .pestana-bloque {
    flex: 1; text-align: center; padding: 12px; border-radius: 20px;
    background: #201b13; border: 1px solid #3a3020; cursor: pointer; font-weight: bold;
  }
  .pestana-bloque.activa { background: #d99a3d; color: #17140f; border-color: #d99a3d; }

  .subtema-card {
    display: block; background: #201b13; border: 1px solid #3a3020;
    border-radius: 12px; padding: 16px; margin-bottom: 10px; text-decoration: none; color: #f2ece1;
  }
  .subtema-card span { display: block; color: #8a8070; font-size: 0.8rem; margin-top: 4px; }

  #panelLogin, #panelActividades { display: none; }
</style>
</head>
<body>
<header>
  <a href="index.html">←</a>
  <h1>Actividades</h1>
</header>

<main>
  <div id="panelLogin">
    <span class="tag">Bases Culinarias</span>
    <h2>Inicia sesión</h2>
    <p class="subtitulo">Usa tu nombre y el PIN que te dio tu docente.</p>
    <label>Nombre completo</label>
    <input id="inputNombre" type="text" placeholder="Nombre y apellido">
    <label>PIN</label>
    <input id="inputPin" type="text" inputmode="numeric" placeholder="4 dígitos" maxlength="4">
    <button class="btn-principal" id="btnEntrar">Entrar</button>
    <div id="estadoLogin"></div>
  </div>

  <div id="panelActividades">
    <div class="fila-encabezado-panel">
      <div>
        <span class="tag">Bases Culinarias</span>
        <h2 id="saludoAlumno">Hola</h2>
      </div>
      <button class="btn-salir" id="btnSalir">Salir</button>
    </div>

    <div class="pestanas-bloque">
      <div class="pestana-bloque activa" data-bloque="1">B1</div>
      <div class="pestana-bloque" data-bloque="2">B2</div>
      <div class="pestana-bloque" data-bloque="3">B3</div>
    </div>

    <div id="listaSubtemas"></div>
  </div>
</main>

<script>
const materia = 'bases-culinarias';

const SUBTEMAS_POR_BLOQUE = {
  '1': [['1.1','Géneros y elaboraciones culinarias sencillas'],['1.2','Elaboración culinaria básica'],['1.3','Equipos e instrumentos de medida'],['1.4','Tablas de temperaturas y manuales de equipos'],['1.5','Unidades y pesos']],
  '2': [['2.1','Aprovisionamiento de materias primas'],['2.2','Materias primas de uso común'],['2.3','Variedades y características físicas'],['2.4','Cualidades gastronómicas']],
  '3': [['3.1','Conocimientos generales para la elaboración de platillos'],['3.2.1','Carnes, aves, pescados y mariscos'],['3.2.2','Vegetales y frutos'],['3.2.3','Semillas y cereales'],['3.2.4','Hierbas y especias']],
};

function normaliza(txt) { return (txt || '').toString().trim().toLowerCase(); }

function mostrarPanelActividades(alumno) {
  document.getElementById('panelLogin').style.display = 'none';
  document.getElementById('panelActividades').style.display = 'block';
  document.getElementById('saludoAlumno').textContent = 'Hola, ' + alumno.nombre;
  renderSubtemas('1');
}

function renderSubtemas(bloque) {
  document.querySelectorAll('.pestana-bloque').forEach((el) => el.classList.toggle('activa', el.dataset.bloque === bloque));
  const cont = document.getElementById('listaSubtemas');
  cont.innerHTML = '';
  SUBTEMAS_POR_BLOQUE[bloque].forEach(([num, nombre]) => {
    const a = document.createElement('a');
    a.className = 'subtema-card';
    a.href = `actividad.html?materia=${materia}&subtema=${num}`;
    a.innerHTML = `${nombre}<span>Subtema ${num}</span>`;
    cont.appendChild(a);
  });
}

document.querySelectorAll('.pestana-bloque').forEach((el) => {
  el.onclick = () => renderSubtemas(el.dataset.bloque);
});

document.getElementById('btnSalir').onclick = () => {
  localStorage.removeItem('jrg_alumno');
  document.getElementById('panelActividades').style.display = 'none';
  document.getElementById('panelLogin').style.display = 'block';
};

// --- Al cargar: revisar si ya hay sesión guardada ---
const sesionGuardada = localStorage.getItem('jrg_alumno');
if (sesionGuardada) {
  try {
    mostrarPanelActividades(JSON.parse(sesionGuardada));
  } catch (e) {
    document.getElementById('panelLogin').style.display = 'block';
  }
} else {
  document.getElementById('panelLogin').style.display = 'block';
}

// --- Login: busca al alumno en TODOS los grupos de la materia (collectionGroup) ---
document.getElementById('btnEntrar').onclick = async () => {
  const nombre = document.getElementById('inputNombre').value.trim();
  const pin = document.getElementById('inputPin').value.trim();
  const estado = document.getElementById('estadoLogin');
  estado.style.display = 'block';

  if (!nombre || !pin) {
    estado.textContent = 'Escribe tu nombre y tu PIN.';
    return;
  }
  estado.textContent = 'Buscando...';

  try {
    const fbConfig = await import('./firebase-config.js');
    const firestoreMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

    const q = firestoreMod.collectionGroup(fbConfig.db, 'alumnos');
    const snap = await firestoreMod.getDocs(q);

    let encontrado = null, grupoEncontrado = null, idEncontrado = null;
    snap.forEach((docu) => {
      const d = docu.data();
      const rutaMateria = docu.ref.parent.parent.parent.parent.id; // .../materias/{materia}/grupos/{grupo}/alumnos/{id}
      if (rutaMateria === materia && normaliza(d.nombre) === normaliza(nombre) && String(d.pin) === pin) {
        encontrado = d;
        grupoEncontrado = docu.ref.parent.parent.id;
        idEncontrado = docu.id;
      }
    });

    if (!encontrado) {
      estado.textContent = 'No encontramos ese nombre y PIN. Verifica con tu docente.';
      return;
    }

    const alumno = { materia, grupo: grupoEncontrado, nombre: encontrado.nombre, pin, id: idEncontrado };
    localStorage.setItem('jrg_alumno', JSON.stringify(alumno));
    estado.style.display = 'none';
    mostrarPanelActividades(alumno);
  } catch (err) {
    estado.textContent = 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.';
    console.error(err);
  }
};
</script>
<script src="menu.js"></script>
<script src="musica.js"></script>
</body>
</html>
