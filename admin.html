<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel docente — Aula Virtual JRG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #f2ece1; color: #17140f; min-height: 100vh; }
  header { background: #17140f; color: #f2ece1; padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  header a { color: #f2ece1; text-decoration: none; font-size: 1.4rem; margin-right: 8px; }
  header h1 { font-size: 1.2rem; }
  main { padding: 24px; max-width: 700px; margin: 0 auto; }

  label { display: block; font-size: 0.85rem; color: #6b6252; margin-bottom: 4px; margin-top: 16px; }
  select, input, textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #cfc6b6; font-family: inherit; font-size: 1rem; background: #fff;
  }
  textarea { min-height: 80px; resize: vertical; }
  button {
    background: #d99a3d; color: #17140f; border: none;
    padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 0.95rem; cursor: pointer;
  }
  .btn-principal { width: 100%; margin-top: 16px; }
  .btn-secundario { background: none; border: 1px solid #b04a3a; color: #b04a3a; width: 100%; margin-top: 8px; }

  .fila-superior { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
  .fila-superior select { flex: 1; margin: 0; }
  .btn-mini { background: none; border: 1px dashed #d99a3d; color: #d99a3d; padding: 10px 14px; white-space: nowrap; }
  .btn-mini.peligro { border-color: #b04a3a; color: #b04a3a; }

  .grid-pestanas { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 24px; }
  .pestana {
    background: #fff; border: 1px solid #e2d9c6; border-radius: 10px;
    padding: 14px 6px; text-align: center; font-size: 0.85rem; cursor: pointer;
  }
  .pestana.activa { background: #17140f; color: #f2ece1; }

  .texto-ayuda { color: #6b6252; font-size: 0.85rem; line-height: 1.5; margin: 6px 0 14px; }
  #estadoTemporal {
    display: none; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    padding: 12px 20px; border-radius: 30px; z-index: 1000;
    background: #17140f; color: #f2ece1; font-size: 0.9rem; font-weight: bold;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25); opacity: 0; transition: opacity 0.25s ease;
    max-width: 88%; text-align: center;
  }
  #estadoTemporal.visible { opacity: 1; }

  /* Filas genéricas de listas */
  .fila-alumno, .fila-bloque, .fila-avance, .fila-asistencia, .fila-ensayo,
  .fila-aviso, .fila-historial, .fila-examen-control, .fila-intento,
  .fila-ajuste-manual, .fila-examen-pausado, .fila-practica, .fila-subtotal {
    background: #fff; border: 1px solid #e2d9c6; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .fila-avance, .fila-historial, .fila-intento { flex-wrap: wrap; }
  .punto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .punto.verde { background: #6a9955; }
  .punto.rojo { background: #b04a3a; }
  .estado-bloque, .estado-examen { margin-left: auto; font-weight: bold; font-size: 0.8rem; }

  .fila-ensayo { flex-wrap: nowrap; }
  .fila-ensayo span { flex: 1; }
  .input-puntos-ensayo { width: 60px; padding: 6px; }
  .check-entregada { width: 20px; height: 20px; }

  .tag-informativo {
    display: inline-block; background: #ece2cd; color: #7a4a1f;
    font-size: 0.7rem; letter-spacing: 1px; padding: 2px 10px; border-radius: 10px; margin: 6px 0 10px;
  }
  .fila-checklist { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; font-size: 0.9rem; }
  .fila-checklist input { width: auto; margin-top: 4px; }

  .tarjeta-criterio { background: #fff; border: 1px solid #e2d9c6; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .encabezado-criterio { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; }
  .slider-criterio { width: 100%; }
  .valor-criterio { text-align: center; font-weight: bold; color: #d99a3d; margin-top: 4px; }
  .franja-calificacion {
    background: #17140f; color: #f2ece1; text-align: center; padding: 14px;
    border-radius: 10px; font-weight: bold; font-size: 1.1rem; margin: 16px 0;
  }

  .tag-tipo {
    background: #ece2cd; color: #7a4a1f; font-size: 0.75rem; padding: 2px 8px; border-radius: 8px;
  }
  .fecha-historial, .fecha-aviso { color: #a89f8d; font-size: 0.8rem; width: 100%; }

  .botones-pausa { display: flex; gap: 8px; width: 100%; margin-top: 8px; }
  .botones-pausa button { flex: 1; font-size: 0.8rem; padding: 10px 8px; }
  .btn-autorizar-continuar { background: #6a9955; }
  .btn-finalizar-tal-cual { background: #b04a3a; color: #fff; }
</style>
</head>
<body>
<div id="pantallaAcceso" style="display:none;">
  <header><h1>Panel docente</h1></header>
  <main>
    <h2 style="margin-bottom:6px;">Panel docente</h2>
    <p class="texto-ayuda">Acceso restringido — solo cuenta institucional.</p>
    <label>Correo</label>
    <input id="inputCorreoAcceso" type="email" placeholder="tu-correo@itesrenedescartes.edu">
    <label>Contraseña</label>
    <input id="inputContrasenaAcceso" type="password" placeholder="Contraseña">
    <button class="btn-principal" id="btnEntrarPanel">Entrar</button>
    <div id="estadoAcceso" class="texto-ayuda" style="display:none;"></div>
  </main>
</div>

<div id="appPanel" style="display:none;">
<header>
  <a href="index.html">←</a>
  <h1>Panel docente</h1>
  <button class="btn-mini" id="btnSalirPanel" style="margin-left:auto; margin-right:56px; font-size:0.82rem; padding:10px 14px;">Salir</button>
</header>

<main>
  <div class="fila-superior">
    <select id="selectGrupo"></select>
    <button class="btn-mini" id="btnNuevoGrupo">+ grupo</button>
    <button class="btn-mini peligro" id="btnBorrarGrupo">🗑</button>
  </div>

  <div class="grid-pestanas">
    <div class="pestana activa" data-tab="alumnos">Alumnos</div>
    <div class="pestana" data-tab="practicas">Práctica de cocina</div>
    <div class="pestana" data-tab="historial">Historial</div>
    <div class="pestana" data-tab="participacion">Participación (Actividades)</div>
    <div class="pestana" data-tab="asistencia">Asistencia</div>
    <div class="pestana" data-tab="ensayos">Ensayos</div>
    <div class="pestana" data-tab="evaluacion">Evaluación</div>
    <div class="pestana" data-tab="examenlinea">Examen en línea</div>
    <div class="pestana" data-tab="avisos">Avisos</div>
  </div>

  <div id="contenidoPestana"></div>
  <div id="estadoTemporal"></div>
</main>
</div>

<script>
// --- Núcleo: conexión a Firebase con acceso restringido (correo + contraseña) ---
let db = null, fx = {}, authInstancia = null, authMod = null;

(async () => {
  try {
    const fbConfig = await import('./firebase-config.js');
    authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const firestoreMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    authInstancia = authMod.getAuth(fbConfig.app);
    db = fbConfig.db;
    fx = firestoreMod;

    authMod.onAuthStateChanged(authInstancia, (usuario) => {
      if (usuario) {
        mostrarPanelPrincipal();
        inicializarPanel();
      } else {
        mostrarPantallaAcceso();
      }
    });
  } catch (err) {
    document.getElementById('appPanel').style.display = 'block';
    document.getElementById('appPanel').innerHTML = '<main><p class="texto-ayuda">No se pudo conectar a Firebase: ' + err.message + '</p></main>';
  }
})();

function mostrarPantallaAcceso() {
  document.getElementById('appPanel').style.display = 'none';
  document.getElementById('pantallaAcceso').style.display = 'block';
}
function mostrarPanelPrincipal() {
  document.getElementById('pantallaAcceso').style.display = 'none';
  document.getElementById('appPanel').style.display = 'block';
}

document.getElementById('btnEntrarPanel').onclick = async () => {
  const correo = document.getElementById('inputCorreoAcceso').value.trim();
  const contrasena = document.getElementById('inputContrasenaAcceso').value;
  const estado = document.getElementById('estadoAcceso');
  estado.style.display = 'block';
  estado.textContent = 'Verificando...';
  try {
    await authMod.signInWithEmailAndPassword(authInstancia, correo, contrasena);
  } catch (err) {
    estado.textContent = 'Correo o contraseña incorrectos.';
  }
};

document.getElementById('btnSalirPanel').onclick = async () => {
  await authMod.signOut(authInstancia);
};

const materia = 'bases-culinarias';
function materiaActual() { return materia; }
function grupoSeleccionado() { return document.getElementById('selectGrupo').value; }

function mostrarEstadoTemporal(msg) {
  const el = document.getElementById('estadoTemporal');
  el.textContent = '✓ ' + msg;
  el.style.display = 'block';
  requestAnimationFrame(() => el.classList.add('visible'));
  clearTimeout(el._temporizador);
  el._temporizador = setTimeout(() => {
    el.classList.remove('visible');
    setTimeout(() => { el.style.display = 'none'; }, 250);
  }, 2200);
}

function hoyISO() { return new Date().toISOString().split('T')[0]; }

// --- Grupos ---
async function cargarGrupos() {
  const sel = document.getElementById('selectGrupo');
  const snap = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos'));
  sel.innerHTML = '';
  const idsReales = snap.docs.map((d) => d.id);

  // "1A" es el grupo original: nunca tuvo su propio documento (solo alumnos dentro
  // de él). Si no aparece como documento real, lo agregamos a mano SOLO si de
  // verdad todavía tiene alumnos — así si lo borras y mueves/quitas sus alumnos,
  // sí desaparece del selector para siempre.
  if (!idsReales.includes('1A')) {
    const snapAlumnos1A = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', '1A', 'alumnos'));
    if (!snapAlumnos1A.empty) {
      const opt = document.createElement('option');
      opt.value = '1A'; opt.textContent = '1A';
      sel.appendChild(opt);
    }
  }
  snap.forEach((d) => {
    const opt = document.createElement('option');
    opt.value = d.id; opt.textContent = d.id;
    sel.appendChild(opt);
  });

  if (sel.options.length === 0) {
    const opt = document.createElement('option');
    opt.value = '1A'; opt.textContent = '1A (crear alumnos para iniciar)';
    sel.appendChild(opt);
  }
}

document.getElementById('btnNuevoGrupo').onclick = async () => {
  if (!db) { mostrarEstadoTemporal('Aún no hay conexión, espera un momento e intenta de nuevo.'); return; }
  const nombre = prompt('Nombre del nuevo grupo (ej. 1B):');
  if (!nombre) return;
  await fx.setDoc(fx.doc(db, 'materias', materia, 'grupos', nombre), { creado: new Date().toISOString() });
  await cargarGrupos();
  document.getElementById('selectGrupo').value = nombre;
  renderPestanaActual();
};

document.getElementById('btnBorrarGrupo').onclick = async () => {
  if (!db) { mostrarEstadoTemporal('Aún no hay conexión, espera un momento e intenta de nuevo.'); return; }
  const grupo = grupoSeleccionado();
  if (!confirm(`¿Seguro que quieres borrar el grupo "${grupo}"? Esto no borra los alumnos automáticamente, solo el registro del grupo.`)) return;
  await fx.deleteDoc(fx.doc(db, 'materias', materia, 'grupos', grupo));
  await cargarGrupos();
  renderPestanaActual();
};

document.getElementById('selectGrupo').onchange = renderPestanaActual;

// --- Navegación de pestañas ---
let pestanaActiva = 'alumnos';
document.querySelectorAll('.pestana').forEach((el) => {
  el.onclick = () => {
    document.querySelectorAll('.pestana').forEach((p) => p.classList.remove('activa'));
    el.classList.add('activa');
    pestanaActiva = el.dataset.tab;
    renderPestanaActual();
  };
});

function renderPestanaActual() {
  const cont = document.getElementById('contenidoPestana');
  cont.innerHTML = '';
  if (!db) {
    cont.innerHTML = '<p class="texto-ayuda">Conectando con la base de datos… si este mensaje no cambia en unos segundos, revisa tu conexión a internet y recarga la página.</p>';
    return;
  }
  const renderizadores = {
    alumnos: renderAlumnos,
    practicas: renderPracticasTab,
    historial: renderHistorialTab,
    participacion: renderParticipacionTab,
    asistencia: renderAsistenciaTab,
    ensayos: renderEnsayosTab,
    evaluacion: renderEvaluacionTab,
    examenlinea: renderExamenLineaTab,
    avisos: renderAvisosTab,
  };
  if (renderizadores[pestanaActiva]) renderizadores[pestanaActiva](cont);
}

function inicializarPanel() {
  cargarGrupos().then(renderPestanaActual);
}
// --- Pestaña: Alumnos ---
function renderAlumnos(cont) {
  cont.innerHTML = `
    <label>Nombre completo del alumno</label>
    <input id="nombreAlumno" type="text" placeholder="Nombre y apellido">
    <button class="btn-principal" id="btnAgregarAlumno">Agregar alumno</button>
    <div id="listaAlumnos" style="margin-top:20px;"></div>
  `;

  function generarPIN() { return String(Math.floor(1000 + Math.random() * 9000)); }

  async function cargar() {
    const grupo = grupoSeleccionado();
    const q = fx.query(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos'), fx.orderBy('nombre'));
    fx.onSnapshot(q, (snap) => {
      const lista = document.getElementById('listaAlumnos');
      if (!lista) return; // el usuario cambió de pestaña
      lista.innerHTML = '';
      snap.forEach((docu) => {
        const d = docu.data();
        const div = document.createElement('div');
        div.className = 'fila-alumno';
        div.innerHTML = `<span>${d.nombre}</span><span class="tag-tipo">PIN: ${d.pin}</span><button class="btn-mini peligro" data-id="${docu.id}">Eliminar</button>`;
        lista.appendChild(div);
      });
      lista.querySelectorAll('button').forEach((btn) => {
        btn.onclick = async () => {
          await fx.deleteDoc(fx.doc(db, 'materias', materia, 'grupos', grupoSeleccionado(), 'alumnos', btn.dataset.id));
        };
      });
    });
  }

  document.getElementById('btnAgregarAlumno').onclick = async () => {
    const nombre = document.getElementById('nombreAlumno').value.trim();
    if (!nombre) return;
    await fx.addDoc(fx.collection(db, 'materias', materia, 'grupos', grupoSeleccionado(), 'alumnos'), { nombre, pin: generarPIN() });
    document.getElementById('nombreAlumno').value = '';
    mostrarEstadoTemporal('Alumno agregado.');
  };

  cargar();
}
// --- Pestaña: Participación ---
function renderParticipacionTab(cont) {
  cont.innerHTML = `
    <h3>Bloques abiertos para responder</h3>
    <p class="texto-ayuda">Los alumnos siempre pueden LEER las actividades de todos los bloques, pero solo pueden RESPONDER (y ganar puntos) en los bloques que actives aquí.</p>
    <div id="listaBloquesAbiertos"></div>
    <button class="btn-principal" id="btnGuardarBloques">Guardar bloques abiertos</button>

    <h3 style="margin-top:28px;">Avance de los alumnos</h3>
    <p class="texto-ayuda">Participación vale 20 pts por bloque, repartidos entre los subtemas de ese bloque.</p>
    <div id="listaAvanceAlumnos"></div>
  `;

  async function cargarBloques() {
    const grupo = grupoSeleccionado();
    const refConfig = fx.doc(db, 'materias', materia, 'grupos', grupo, 'config', 'bloquesAbiertos');
    const snap = await fx.getDoc(refConfig);
    const config = snap.exists() ? snap.data() : { bloque1: false, bloque2: false, bloque3: false };

    const contBloques = document.getElementById('listaBloquesAbiertos');
    contBloques.innerHTML = '';
    ['1', '2', '3'].forEach((b) => {
      const abierto = config['bloque' + b] === true;
      const div = document.createElement('div');
      div.className = 'fila-bloque';
      div.dataset.bloque = b;
      div.dataset.abierto = abierto ? '1' : '0';
      div.innerHTML = `<span class="punto ${abierto ? 'verde' : 'rojo'}"></span><span>Bloque ${b}</span><span class="estado-bloque">${abierto ? 'ABIERTO' : 'SOLO LECTURA'}</span>`;
      div.onclick = () => {
        const nuevo = div.dataset.abierto !== '1';
        div.dataset.abierto = nuevo ? '1' : '0';
        div.querySelector('.punto').className = 'punto ' + (nuevo ? 'verde' : 'rojo');
        div.querySelector('.estado-bloque').textContent = nuevo ? 'ABIERTO' : 'SOLO LECTURA';
      };
      contBloques.appendChild(div);
    });
  }

  document.getElementById('btnGuardarBloques').onclick = async () => {
    const grupo = grupoSeleccionado();
    const nuevaConfig = {};
    document.querySelectorAll('#listaBloquesAbiertos .fila-bloque').forEach((f) => {
      nuevaConfig['bloque' + f.dataset.bloque] = f.dataset.abierto === '1';
    });
    await fx.setDoc(fx.doc(db, 'materias', materia, 'grupos', grupo, 'config', 'bloquesAbiertos'), nuevaConfig);
    mostrarEstadoTemporal('Bloques guardados correctamente.');
  };

  async function cargarAvance() {
    const grupo = grupoSeleccionado();
    const snapAlumnos = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos'));
    const contAvance = document.getElementById('listaAvanceAlumnos');
    contAvance.innerHTML = '';
    for (const docAlumno of snapAlumnos.docs) {
      const snapPart = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', docAlumno.id, 'participacion'));
      let total = 0;
      snapPart.forEach((d) => { total += (d.data().puntos || 0); });
      const div = document.createElement('div');
      div.className = 'fila-avance';
      div.innerHTML = `<span>${docAlumno.data().nombre}</span><span>${total.toFixed(1)}/60 pts</span>`;
      contAvance.appendChild(div);
    }
  }

  cargarBloques();
  cargarAvance();
}
// --- Pestaña: Asistencia ---
const ESTADOS_ASISTENCIA = [
  { clave: 'presente', label: 'PRESENTE', valor: 0.5, color: '#6a9955' },
  { clave: 'retardo', label: 'RETARDO', valor: 0.25, color: '#d99a3d' },
  { clave: 'justificado', label: 'JUSTIFICADO', valor: 0.5, color: '#4a7ab0' },
  { clave: 'falta', label: 'FALTA', valor: 0, color: '#b04a3a' },
];
const NOMBRES_BLOQUE_SEMANAS = { '1': 'Bloque 1 (semanas 1-5)', '2': 'Bloque 2 (semanas 6-10)', '3': 'Bloque 3 (semanas 11-15)' };

function renderAsistenciaTab(cont) {
  cont.innerHTML = `
    <label>Bloque</label>
    <select id="selectBloqueAsistencia"></select>
    <label>Fecha</label>
    <input type="date" id="inputFechaAsistencia" value="${hoyISO()}">
    <p class="texto-ayuda">Todos inician como <strong>presente</strong>. Toca a un alumno para ciclar: Presente (0.5) → Retardo (0.25) → Justificado (0.5) → Falta (0).</p>
    <div id="listaAsistenciaDia"></div>
    <button class="btn-principal" id="btnGuardarAsistencia">Guardar asistencia del día</button>
  `;

  const sel = document.getElementById('selectBloqueAsistencia');
  ['1', '2', '3'].forEach((b) => {
    const opt = document.createElement('option'); opt.value = b; opt.textContent = NOMBRES_BLOQUE_SEMANAS[b];
    sel.appendChild(opt);
  });

  async function cargar() {
    const grupo = grupoSeleccionado();
    const bloque = sel.value;
    const fecha = document.getElementById('inputFechaAsistencia').value || hoyISO();
    const snapAlumnos = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos'));
    const contLista = document.getElementById('listaAsistenciaDia');
    contLista.innerHTML = '';
    for (const docAlumno of snapAlumnos.docs) {
      const refRegistro = fx.doc(db, 'materias', materia, 'grupos', grupo, 'alumnos', docAlumno.id, 'asistencia', `${bloque}_${fecha}`);
      const snapRegistro = await fx.getDoc(refRegistro);
      const estado = snapRegistro.exists() ? snapRegistro.data().estado : 'presente';
      const div = document.createElement('div');
      div.className = 'fila-asistencia';
      div.dataset.alumnoId = docAlumno.id;
      div.dataset.estado = estado;
      const infoEstado = ESTADOS_ASISTENCIA.find(e => e.clave === estado);
      div.innerHTML = `<span class="punto" style="background:${infoEstado.color};"></span><span>${docAlumno.data().nombre}</span><span class="estado-asistencia" style="margin-left:auto; color:${infoEstado.color}; font-weight:bold;">${infoEstado.label}</span>`;
      div.onclick = () => {
        const idx = ESTADOS_ASISTENCIA.findIndex(e => e.clave === div.dataset.estado);
        const sig = ESTADOS_ASISTENCIA[(idx + 1) % ESTADOS_ASISTENCIA.length];
        div.dataset.estado = sig.clave;
        div.querySelector('.punto').style.background = sig.color;
        const spanEstado = div.querySelector('.estado-asistencia');
        spanEstado.textContent = sig.label;
        spanEstado.style.color = sig.color;
      };
      contLista.appendChild(div);
    }
  }

  document.getElementById('btnGuardarAsistencia').onclick = async () => {
    const grupo = grupoSeleccionado();
    const bloque = sel.value;
    const fecha = document.getElementById('inputFechaAsistencia').value || hoyISO();
    const filas = document.querySelectorAll('#listaAsistenciaDia .fila-asistencia');
    for (const fila of filas) {
      const estado = fila.dataset.estado;
      const valor = ESTADOS_ASISTENCIA.find(e => e.clave === estado).valor;
      await fx.setDoc(fx.doc(db, 'materias', materia, 'grupos', grupo, 'alumnos', fila.dataset.alumnoId, 'asistencia', `${bloque}_${fecha}`), { estado, valor, bloque, fecha });
    }
    mostrarEstadoTemporal('Asistencia del ' + fecha + ' guardada.');
  };

  sel.onchange = cargar;
  document.getElementById('inputFechaAsistencia').onchange = cargar;
  cargar();
}

function numeroSemanaGlobal(bloque, indiceLocal) { return (parseInt(bloque) - 1) * 5 + indiceLocal + 1; }

function renderEnsayosTab(cont) {
  cont.innerHTML = `
    <label>Semana</label>
    <select id="selectorSemanaEnsayo"></select>

    <div id="tarjetaConsignaSemana"></div>

    <p class="texto-ayuda" style="margin-top:20px;">Cada bitácora vale <strong>${PUNTOS_POR_BITACORA} puntos</strong> (5 bitácoras = 30 pts del bloque). Marca entregada y captura los puntos de 0 a ${PUNTOS_POR_BITACORA}.</p>
    <div id="listaEnsayosSemana"></div>
    <button class="btn-principal" id="btnGuardarEnsayos">Guardar ensayos de esta semana</button>
  `;

  const sel = document.getElementById('selectorSemanaEnsayo');
  ['1', '2', '3'].forEach((bloque) => {
    TEMAS_SEMANA[bloque].forEach((tema, i) => {
      const semGlobal = numeroSemanaGlobal(bloque, i);
      const opt = document.createElement('option');
      opt.value = `${bloque}|${i}`;
      opt.textContent = `Semana ${semGlobal} (Bloque ${bloque}) — ${tema}`;
      sel.appendChild(opt);
    });
  });

  async function cargarConsigna() {
    const [bloque, indiceLocal] = sel.value.split('|');
    const semGlobal = numeroSemanaGlobal(bloque, parseInt(indiceLocal));
    const grupo = grupoSeleccionado();
    const refConsigna = fx.doc(db, 'materias', materia, 'grupos', grupo, 'config', 'ensayosSemanas');
    const snap = await fx.getDoc(refConsigna);
    const datos = snap.exists() ? (snap.data()['semana' + semGlobal] || {}) : {};
    const activa = datos.activa === true;
    const info = PREGUNTAS_SEMANA[semGlobal] || { entregable: '', preguntas: [] };

    const cont2 = document.getElementById('tarjetaConsignaSemana');
    cont2.innerHTML = `
      <div class="fila-bloque" style="display:block; cursor:default;">
        <label style="margin-top:0;">Semana ${semGlobal} — preguntas del micro-ensayo</label>
        <p class="texto-ayuda" style="margin-top:0;"><em>${info.entregable}</em></p>
        <ol style="margin:0 0 10px 20px; line-height:1.6; font-size:0.92rem;">
          ${info.preguntas.map(p => `<li style="margin-bottom:8px;">${p}</li>`).join('')}
        </ol>
        <label style="display:flex; align-items:center; gap:8px; margin-top:10px;">
          <input type="checkbox" id="checkActivaSemana" style="width:auto;" ${activa ? 'checked' : ''}>
          <span>Activa para los alumnos (la ven en su pestaña de Ensayos)</span>
        </label>
        <button class="btn-principal" id="btnGuardarConsigna" style="margin-top:12px;">Guardar</button>
      </div>
    `;

    document.getElementById('btnGuardarConsigna').onclick = async (ev) => {
      const btn = ev.currentTarget;
      const textoOriginal = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Guardando…';
      const activaNueva = document.getElementById('checkActivaSemana').checked;
      await fx.setDoc(refConsigna, {
        ['semana' + semGlobal]: {
          activa: activaNueva,
          entregable: info.entregable,
          preguntas: info.preguntas,
        }
      }, { merge: true });
      mostrarEstadoTemporal(activaNueva ? 'Semana activada para los alumnos.' : 'Semana desactivada.');
      btn.disabled = false;
      btn.textContent = textoOriginal;
    };
  }

  async function cargar() {
    const [bloque, indiceLocal] = sel.value.split('|');
    const semGlobal = numeroSemanaGlobal(bloque, parseInt(indiceLocal));
    const grupo = grupoSeleccionado();
    const snapAlumnos = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos'));
    const contLista = document.getElementById('listaEnsayosSemana');
    contLista.innerHTML = '';
    for (const docAlumno of snapAlumnos.docs) {
      const refEnsayo = fx.doc(db, 'materias', materia, 'grupos', grupo, 'alumnos', docAlumno.id, 'ensayos', 'semana' + semGlobal);
      const snapEnsayo = await fx.getDoc(refEnsayo);
      const datos = snapEnsayo.exists() ? snapEnsayo.data() : { entregada: false, puntos: 0 };
      const div = document.createElement('div');
      div.className = 'fila-ensayo';
      div.dataset.alumnoId = docAlumno.id;
      div.innerHTML = `
        <input type="checkbox" class="check-entregada" ${datos.entregada ? 'checked' : ''}>
        <span>${docAlumno.data().nombre}</span>
        <input type="number" class="input-puntos-ensayo" min="0" max="${PUNTOS_POR_BITACORA}" step="0.5" value="${datos.puntos || 0}">
      `;
      contLista.appendChild(div);
    }
  }

  document.getElementById('btnGuardarEnsayos').onclick = async (ev) => {
    const btn = ev.currentTarget;
    const textoOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    const [bloque, indiceLocal] = sel.value.split('|');
    const semGlobal = numeroSemanaGlobal(bloque, parseInt(indiceLocal));
    const grupo = grupoSeleccionado();
    const filas = document.querySelectorAll('#listaEnsayosSemana .fila-ensayo');
    for (const fila of filas) {
      const entregada = fila.querySelector('.check-entregada').checked;
      let puntos = parseFloat(fila.querySelector('.input-puntos-ensayo').value) || 0;
      puntos = Math.max(0, Math.min(PUNTOS_POR_BITACORA, puntos));
      await fx.setDoc(fx.doc(db, 'materias', materia, 'grupos', grupo, 'alumnos', fila.dataset.alumnoId, 'ensayos', 'semana' + semGlobal), { entregada, puntos, bloque, semana: semGlobal, fecha: new Date().toISOString() });
    }
    mostrarEstadoTemporal('Ensayos de la semana ' + semGlobal + ' guardados.');
    btn.disabled = false;
    btn.textContent = textoOriginal;
  };

  sel.onchange = () => { cargarConsigna(); cargar(); };
  cargarConsigna();
  cargar();
}
// --- Pestaña: Práctica de cocina ---
const RUBRICA_PRACTICA = [
  { clave: 'higiene', label: 'Higiene personal y uniforme', peso: 0.15 },
  { clave: 'seguridad', label: 'Seguridad (NOM-251)', peso: 0.15 },
  { clave: 'mise', label: 'Mise en place y orden', peso: 0.20 },
  { clave: 'tecnica', label: 'Técnica y ejecución', peso: 0.30 },
  { clave: 'producto', label: 'Producto final', peso: 0.20 },
];
const CHECKLIST_PASE_REVISTA = [
  'Uniforme completo: filipina, mandil limpio, calzado antiderrapante.',
  'Higiene personal: pelo recogido, sin anillos/relojes/pulseras, uñas cortas.',
  'Salud: sin heridas expuestas, sin síntomas de enfermedad.',
  'Lavado de manos con técnica correcta.',
  'Sanitización: área de trabajo desinfectada y seca.',
  'Tablas de picar identificadas por uso y limpias.',
  'Ingredientes porcionados en compoteras.',
  'Bote de basura con tapa y bolsa, bien ubicado.',
];

function calcularCalificacionPractica(valores) {
  let total = 0;
  RUBRICA_PRACTICA.forEach((c) => { total += (valores[c.clave] || 0) * c.peso; });
  return Math.round(total * 10) / 10;
}

function renderPracticasTab(cont) {
  cont.innerHTML = `
    <p class="texto-ayuda">Toca un alumno de la lista para calificar su práctica.</p>
    <div id="listaAlumnosPractica"></div>
    <div id="formPractica"></div>
  `;

  async function cargarLista() {
    const grupo = grupoSeleccionado();
    const snap = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos'));
    const contLista = document.getElementById('listaAlumnosPractica');
    contLista.innerHTML = '';
    snap.forEach((docu) => {
      const div = document.createElement('div');
      div.className = 'fila-alumno';
      div.innerHTML = `<span>${docu.data().nombre}</span><button class="btn-mini">Calificar →</button>`;
      div.querySelector('button').onclick = () => mostrarFormulario(docu.id, docu.data().nombre);
      contLista.appendChild(div);
    });
  }

  function mostrarFormulario(alumnoId, alumnoNombre) {
    const cont2 = document.getElementById('formPractica');
    cont2.innerHTML = `
      <h3>Calificando a: ${alumnoNombre}</h3>
      <label>Bloque</label>
      <select id="selectBloquePractica"><option value="1">Bloque 1 (semanas 1-5)</option><option value="2">Bloque 2 (semanas 6-10)</option><option value="3">Bloque 3 (semanas 11-15)</option></select>
      <div id="avisoBloqueCalificado" class="texto-ayuda" style="display:none; color:#b04a3a; background:#f7e6e2; border-radius:8px; padding:10px 12px;"></div>
      <label>Fecha de la práctica</label>
      <input type="date" id="inputFechaPractica" value="${hoyISO()}">
      <h3>Rúbrica de competencias</h3>
      <div id="contSliders"></div>
      <div id="calificacionFinalPractica" class="franja-calificacion">Calificación: 10.0 / 10</div>
      <h3>Checklist "Pase de Revista"</h3>
      <div class="tag-informativo">INFORMATIVO</div>
      <div id="contChecklist"></div>
      <label>Notas / observaciones</label>
      <textarea id="notasPractica" placeholder="Opcional"></textarea>
      <button class="btn-principal" id="btnGuardarEvaluacion">Guardar evaluación</button>
    `;

    const contSliders = document.getElementById('contSliders');
    RUBRICA_PRACTICA.forEach((c) => {
      const div = document.createElement('div');
      div.className = 'tarjeta-criterio';
      div.innerHTML = `<div class="encabezado-criterio"><span>${c.label}</span><span>${Math.round(c.peso*100)}%</span></div>
        <input type="range" min="0" max="10" step="0.5" value="10" class="slider-criterio" data-clave="${c.clave}">
        <div class="valor-criterio">10</div>`;
      contSliders.appendChild(div);
    });
    contSliders.querySelectorAll('.slider-criterio').forEach((s) => s.addEventListener('input', actualizarCalificacion));

    const contChecklist = document.getElementById('contChecklist');
    CHECKLIST_PASE_REVISTA.forEach((texto, i) => {
      const label = document.createElement('label');
      label.className = 'fila-checklist';
      label.innerHTML = `<input type="checkbox" checked data-idx="${i}"><span>${texto}</span>`;
      contChecklist.appendChild(label);
    });

    function actualizarCalificacion() {
      const valores = {};
      document.querySelectorAll('.slider-criterio').forEach((s) => {
        valores[s.dataset.clave] = parseFloat(s.value);
        s.closest('.tarjeta-criterio').querySelector('.valor-criterio').textContent = s.value;
      });
      const calif = calcularCalificacionPractica(valores);
      document.getElementById('calificacionFinalPractica').textContent = `Calificación: ${calif.toFixed(1)} / 10`;
    }
    actualizarCalificacion();

    // --- Evita calificar dos veces el mismo bloque por error ---
    async function revisarSiYaCalificado() {
      const grupo = grupoSeleccionado();
      const bloque = document.getElementById('selectBloquePractica').value;
      const snapExistentes = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'practicas'));
      const existente = snapExistentes.docs.find((d) => d.data().bloque === bloque);
      const aviso = document.getElementById('avisoBloqueCalificado');
      const btnGuardar = document.getElementById('btnGuardarEvaluacion');
      if (existente) {
        const dat = existente.data();
        aviso.style.display = 'block';
        aviso.textContent = `Este bloque ya tiene una práctica calificada (${dat.fecha}, ${(dat.calificacion||0).toFixed(1)}/10). Para corregirla, usa la pestaña Evaluación.`;
        btnGuardar.disabled = true;
        btnGuardar.style.opacity = '0.5';
      } else {
        aviso.style.display = 'none';
        btnGuardar.disabled = false;
        btnGuardar.style.opacity = '1';
      }
    }
    document.getElementById('selectBloquePractica').onchange = revisarSiYaCalificado;
    revisarSiYaCalificado();

    document.getElementById('btnGuardarEvaluacion').onclick = async () => {
      const valores = {};
      document.querySelectorAll('.slider-criterio').forEach((s) => { valores[s.dataset.clave] = parseFloat(s.value); });
      const calificacion = calcularCalificacionPractica(valores);
      const checklist = {};
      document.querySelectorAll('#contChecklist input[type=checkbox]').forEach((chk) => { checklist['item' + chk.dataset.idx] = chk.checked; });
      const bloque = document.getElementById('selectBloquePractica').value;
      const fecha = document.getElementById('inputFechaPractica').value;
      const notas = document.getElementById('notasPractica').value.trim();
      const grupo = grupoSeleccionado();
      await fx.addDoc(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'practicas'), {
        bloque, fecha, valores, calificacion, puntos: calificacion, checklist, notas, fechaRegistro: new Date().toISOString(),
      });
      mostrarEstadoTemporal('Evaluación guardada.');
      revisarSiYaCalificado();
    };
  }

  async function mostrarResumenAlumno(alumnoId, nombre) {
    const grupo = grupoSeleccionado();
    const panel = document.getElementById('panelResumenAlumno');
    panel.innerHTML = '<p class="texto-ayuda">Cargando…</p>';

    const [snapPart, snapPract, snapEns, snapAsist, snapExam] = await Promise.all([
      fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'participacion')),
      fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'practicas')),
      fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'ensayos')),
      fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'asistencia')),
      fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'examenes')),
    ]);

    const bloquesResumen = [];
    for (const b of ['1', '2', '3']) {
      const auto = await calcularSubtotalesAutomaticos(alumnoId, b);
      const refAjuste = fx.doc(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'ajustesManuales', 'bloque' + b);
      const snapAj = await fx.getDoc(refAjuste);
      const aj = snapAj.exists() ? snapAj.data() : {};
      const aplicar = (a, m) => (m !== undefined && m !== null) ? m : a;
      const valores = {
        participacion: aplicar(auto.participacion, aj.participacion),
        ensayos: aplicar(auto.ensayos, aj.ensayos),
        practicas: aplicar(auto.practicas, aj.practicas),
        asistencia: aplicar(auto.asistencia, aj.asistencia),
        examen: aplicar(auto.examen, aj.examen),
      };
      const total = Object.values(valores).reduce((x, y) => x + y, 0);

      const countPart = snapPart.docs.filter((d) => d.id.split('.')[0] === b).length;
      const countEns = snapEns.docs.filter((d) => {
        const dat = d.data();
        return String(dat.bloque || Math.ceil(dat.semana / 5)) === b && dat.entregada;
      }).length;
      const countPract = snapPract.docs.filter((d) => d.data().bloque === b).length;
      const diasAsist = snapAsist.docs.filter((d) => d.data().bloque === b);
      const faltas = diasAsist.filter((d) => d.data().estado === 'falta').length;
      const examenDoc = snapExam.docs.find((d) => d.id === 'bloque' + b);
      const examenInfo = examenDoc ? examenDoc.data() : null;

      bloquesResumen.push({ bloque: b, valores, total, countPart, countEns, countPract, diasAsist: diasAsist.length, faltas, examenInfo });
    }

    const promedio = bloquesResumen.reduce((a, b) => a + b.total, 0) / 300 * 10;

    panel.innerHTML = `
      <h3 style="margin-top:0;">Resumen de: ${nombre}</h3>
      ${bloquesResumen.map((b) => `
        <div class="tarjeta-criterio">
          <h4 style="color:#b5772a; margin-bottom:8px;">Bloque ${b.bloque}</h4>
          <div class="fila-simple"><span>Participación (Actividades) <span class="texto-ayuda">(${b.countPart} registros)</span></span><span>${b.valores.participacion.toFixed(1)} / 20</span></div>
          <div class="fila-simple"><span>Ensayos <span class="texto-ayuda">(${b.countEns}/5 bitácoras)</span></span><span>${b.valores.ensayos.toFixed(1)} / 30</span></div>
          <div class="fila-simple"><span>Prácticas de cocina <span class="texto-ayuda">(${b.countPract} registradas)</span></span><span>${b.valores.practicas.toFixed(1)} / 10</span></div>
          <div class="fila-simple"><span>Asistencia <span class="texto-ayuda">(${b.diasAsist} días · ${b.faltas} faltas)</span></span><span>${b.valores.asistencia.toFixed(1)} / 10</span></div>
          <div class="fila-simple"><span>Examen <span class="texto-ayuda">(${b.examenInfo ? b.examenInfo.aciertos + '/' + b.examenInfo.total + ' · en línea' : 'sin presentar'})</span></span><span>${b.valores.examen.toFixed(1)} / 30</span></div>
          <div class="fila-total" style="margin-top:8px;"><span>Total Bloque ${b.bloque}</span><span>${b.total.toFixed(1)} / 100 pts</span></div>
        </div>
      `).join('')}
      <div class="franja-calificacion">Promedio: ${promedio.toFixed(1)} / 10</div>
      <p class="texto-ayuda">Promedio de los tres bloques (cada uno vale 100 puntos).</p>
    `;
  }

  document.getElementById('btnExportarPDF').onclick = () => {
    const alumno = document.getElementById('selectAlumnoReporte').value;
    const bloquesIncl = [...document.querySelectorAll('#listaBloquesReporte .fila-examen-control')].filter((f) => f.dataset.incluido === '1').map((f) => f.dataset.bloque);
    exportarReporte('pdf', alumno, bloquesIncl);
  };
  document.getElementById('btnExportarCSV').onclick = () => {
    const alumno = document.getElementById('selectAlumnoReporte').value;
    const bloquesIncl = [...document.querySelectorAll('#listaBloquesReporte .fila-examen-control')].filter((f) => f.dataset.incluido === '1').map((f) => f.dataset.bloque);
    exportarReporte('csv', alumno, bloquesIncl);
  };

  cargarBloquesToggle();
  cargarListas();
}

// --- Cálculo consolidado por alumno/bloque, usado por el reporte ---
async function calcularSubtotalesAutomaticos(alumnoId, bloque) {
  const grupo = grupoSeleccionado();
  const snapPart = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'participacion'));
  let participacion = 0;
  snapPart.forEach((d) => { if (d.id.split('.')[0] === bloque) participacion += (d.data().puntos || 0); });

  const snapPract = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'practicas'));
  let practicas = 0;
  snapPract.forEach((d) => { if (d.data().bloque === bloque) practicas += (d.data().puntos || 0); });
  practicas = Math.min(practicas, 10);

  const snapEns = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'ensayos'));
  let ensayos = 0;
  const inicio = (parseInt(bloque) - 1) * 5 + 1;
  snapEns.forEach((d) => {
    const num = parseInt(d.id.replace('semana', ''));
    if (num >= inicio && num < inicio + 5) ensayos += (d.data().puntos || 0);
  });
  ensayos = Math.min(ensayos, 30);

  const snapAsist = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'asistencia'));
  let asistencia = 0;
  snapAsist.forEach((d) => { if (d.data().bloque === bloque) asistencia += (d.data().valor || 0); });
  asistencia = Math.min(asistencia, 10);

  const snapExam = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'examenes'));
  let examen = 0;
  snapExam.forEach((d) => { if (d.id === 'bloque' + bloque) examen = (d.data().calificacion || 0) * 3; });

  return { participacion: Math.min(participacion, 20), practicas, ensayos, asistencia, examen };
}

const RUBROS_EVALUACION = [
  { clave: 'participacion', label: 'Participación', max: 20 },
  { clave: 'practicas', label: 'Prácticas de cocina', max: 10 },
  { clave: 'ensayos', label: 'Ensayos', max: 30 },
  { clave: 'asistencia', label: 'Asistencia', max: 10 },

function renderEvaluacionTab(cont) {
  cont.innerHTML = `
    <p class="texto-ayuda">Ajusta manualmente cualquier rubro por imprevistos. Un valor manual siempre tiene prioridad sobre el cálculo automático.</p>
    <label>Alumno</label>
    <select id="selectAlumnoEvaluacion"></select>
    <label>Bloque</label>
    <select id="selectBloqueEvaluacion"><option value="1">Bloque 1</option><option value="2">Bloque 2</option><option value="3">Bloque 3</option></select>
    <div id="panelEvaluacion" style="margin-top:16px;"></div>
  `;

  async function cargarAlumnos() {
    const grupo = grupoSeleccionado();
    const snap = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos'));
    const sel = document.getElementById('selectAlumnoEvaluacion');
    sel.innerHTML = '';
    snap.forEach((d) => {
      const opt = document.createElement('option'); opt.value = d.id; opt.textContent = d.data().nombre;
      sel.appendChild(opt);
    });
    if (!snap.empty) cargarPanel();
  }

  async function cargarPanel() {
    const alumnoId = document.getElementById('selectAlumnoEvaluacion').value;
    const bloque = document.getElementById('selectBloqueEvaluacion').value;
    if (!alumnoId) return;
    const grupo = grupoSeleccionado();

    const refAjuste = fx.doc(db, 'materias', materia, 'grupos', grupo, 'alumnos', alumnoId, 'ajustesManuales', 'bloque' + bloque);
    const snap = await fx.getDoc(refAjuste);
    const ajustes = snap.exists() ? snap.data() : {};
    const automaticos = await calcularSubtotalesAutomaticos(alumnoId, bloque);

    const panel = document.getElementById('panelEvaluacion');
    panel.innerHTML = `<h3>Ajuste manual — Bloque ${bloque}</h3>`;
    RUBROS_EVALUACION.forEach((r) => {
      const valorManual = ajustes[r.clave];
      const valorAutomatico = automaticos[r.clave];
      const div = document.createElement('div');
      div.innerHTML = `
        <label>${r.label} <span class="texto-ayuda">(automático: ${valorAutomatico.toFixed(1)} / ${r.max})</span></label>
        <input type="number" class="input-ajuste-manual" data-clave="${r.clave}" min="0" max="${r.max}"
               placeholder="Automático: ${valorAutomatico.toFixed(1)}"
               value="${valorManual !== undefined && valorManual !== null ? valorManual : ''}">`;
      panel.appendChild(div);
    });

    const btnGuardar = document.createElement('button');
    btnGuardar.className = 'btn-principal'; btnGuardar.textContent = 'Guardar ajustes manuales';
    btnGuardar.onclick = async () => {
      const nuevosAjustes = {};
      panel.querySelectorAll('.input-ajuste-manual').forEach((input) => {
        const valor = input.value.trim();
        if (valor !== '') {
          const rubro = RUBROS_EVALUACION.find(r => r.clave === input.dataset.clave);
          let num = Math.max(0, Math.min(rubro.max, parseFloat(valor)));
          nuevosAjustes[input.dataset.clave] = num;
        }
      });
      await fx.setDoc(refAjuste, nuevosAjustes);
      mostrarEstadoTemporal('Ajustes guardados.');
    };
    panel.appendChild(btnGuardar);

    const btnLimpiar = document.createElement('button');
    btnLimpiar.className = 'btn-secundario'; btnLimpiar.textContent = 'Quitar ajustes (volver a automático)';
    btnLimpiar.onclick = async () => { await fx.deleteDoc(refAjuste); mostrarEstadoTemporal('Ajustes eliminados.'); cargarPanel(); };
    panel.appendChild(btnLimpiar);
  }

  document.getElementById('selectAlumnoEvaluacion').onchange = cargarPanel;
  document.getElementById('selectBloqueEvaluacion').onchange = cargarPanel;
  cargarAlumnos();
}

    const config = snap.exists() ? snap.data() : { bloque1: false, bloque2: false, bloque3: false };
    const contLista = document.getElementById('listaControlExamenes');
    contLista.innerHTML = '';
    ['1', '2', '3'].forEach((b) => {
      const abierto = config['bloque' + b] === true;
      const div = document.createElement('div');
      div.className = 'fila-examen-control';
      div.dataset.bloque = b; div.dataset.abierto = abierto ? '1' : '0';
      div.innerHTML = `<span class="punto ${abierto?'verde':'rojo'}"></span><span>Examen del Bloque ${b}</span><span class="estado-examen">${abierto?'ABIERTO':'CERRADO'}</span>`;
      div.onclick = () => {
        const n = div.dataset.abierto !== '1';
        div.dataset.abierto = n?'1':'0';
        div.querySelector('.punto').className = 'punto ' + (n?'verde':'rojo');
        div.querySelector('.estado-examen').textContent = n?'ABIERTO':'CERRADO';
      };
      contLista.appendChild(div);
    });
  }

  document.getElementById('btnGuardarControlExamenes').onclick = async () => {
    const grupo = grupoSeleccionado();
    const nuevaConfig = {};
    document.querySelectorAll('#listaControlExamenes .fila-examen-control').forEach((f) => { nuevaConfig['bloque'+f.dataset.bloque] = f.dataset.abierto==='1'; });
    await fx.setDoc(fx.doc(db, 'materias', materia, 'grupos', grupo, 'config', 'examenesAbiertos'), nuevaConfig);
    mostrarEstadoTemporal('Guardado.');
  };

  async function cargarPausados() {
    const grupo = grupoSeleccionado();
    const snapAlumnos = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos'));
    const contLista = document.getElementById('listaExamenesPausados');
    contLista.innerHTML = '';
    let hay = false;
    for (const docAlumno of snapAlumnos.docs) {
      const snapPausas = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos', docAlumno.id, 'examenesPausados'));
      snapPausas.forEach((docPausa) => {
        const datos = docPausa.data();
        if (datos.estado !== 'pausado' || datos.permisoContinuar === true) return;
        hay = true;
        const min = Math.floor(datos.segundosRestantes/60), seg = datos.segundosRestantes%60;
        const bloque = docPausa.id.replace('bloque','');
        const div = document.createElement('div');
        div.className = 'fila-examen-pausado';
        div.innerHTML = `
          <div><strong>${docAlumno.data().nombre}</strong> — Bloque ${bloque}</div>
          <div class="texto-ayuda">Se quedó con ${min}:${String(seg).padStart(2,'0')} restantes (pregunta ${datos.indiceActual+1} de ${datos.preguntasGuardadas.length})</div>
          <label>Minutos extra a otorgar (opcional)</label>
          <input type="number" class="input-tiempo-extra" min="0" value="0">
          <div class="botones-pausa">
            <button class="btn-autorizar-continuar" data-alumno="${docAlumno.id}" data-bloque="${bloque}">Autorizar continuar</button>
            <button class="btn-finalizar-tal-cual" data-alumno="${docAlumno.id}" data-bloque="${bloque}">Finalizar con lo que tiene</button>
          </div>`;
        contLista.appendChild(div);
      });
    }
    if (!hay) contLista.innerHTML = '<p class="texto-ayuda">No hay exámenes pausados pendientes.</p>';

    contLista.querySelectorAll('.btn-autorizar-continuar').forEach((btn) => {
      btn.onclick = async () => {
        const min = parseFloat(btn.closest('.fila-examen-pausado').querySelector('.input-tiempo-extra').value) || 0;
        const grupo2 = grupoSeleccionado();
        await fx.updateDoc(fx.doc(db, 'materias', materia, 'grupos', grupo2, 'alumnos', btn.dataset.alumno, 'examenesPausados', 'bloque'+btn.dataset.bloque), { permisoContinuar: true, tiempoExtraSegundos: min*60 });
        mostrarEstadoTemporal('Autorizado.');
        cargarPausados();
      };
    });
    contLista.querySelectorAll('.btn-finalizar-tal-cual').forEach((btn) => {
      btn.onclick = async () => {
        const grupo2 = grupoSeleccionado();
        const refPausa = fx.doc(db, 'materias', materia, 'grupos', grupo2, 'alumnos', btn.dataset.alumno, 'examenesPausados', 'bloque'+btn.dataset.bloque);
        const snap = await fx.getDoc(refPausa);
        if (!snap.exists()) return;
        const datos = snap.data();
        let aciertos = 0;
        datos.preguntasGuardadas.forEach((p, i) => {
          const r = datos.respuestas[i];
          if (r === undefined || r === null) return;
          if ((p.tipo==='multiple'||p.tipo==='vf') && r===p.correcta) aciertos++;
          else if (p.tipo==='completar' && String(r).trim().toLowerCase()===String(p.respuesta).trim().toLowerCase()) aciertos++;
          else if (p.tipo==='seleccion2' && Array.isArray(r) && r.length===2 && r.slice().sort().join(',')===p.correctas.slice().sort().join(',')) aciertos++;
          else if (p.tipo==='relacionar' && p.items.every((item,idx)=>r&&r[idx]===item.correcta)) aciertos++;
        });
        const total = datos.preguntasGuardadas.length;
        const calif = Math.round((aciertos/total)*100)/10;
        await fx.setDoc(fx.doc(db, 'materias', materia, 'grupos', grupo2, 'alumnos', btn.dataset.alumno, 'examenes', 'bloque'+btn.dataset.bloque), { aciertos, total, calificacion: calif, fecha: new Date().toISOString(), motivoCierre: 'finalizado_por_docente' });
        await fx.deleteDoc(refPausa);
        mostrarEstadoTemporal('Examen finalizado: ' + calif.toFixed(1));
        cargarPausados();
      };
    });
  }

  async function cargarIntentos() {
    const bloque = document.getElementById('selectBloqueIntentos').value;
    const grupo = grupoSeleccionado();
    const snapAlumnos = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos'));
    const contLista = document.getElementById('listaIntentosExamen');
    contLista.innerHTML = '';
    for (const docAlumno of snapAlumnos.docs) {
      const snapIntento = await fx.getDoc(fx.doc(db, 'materias', materia, 'grupos', grupo, 'alumnos', docAlumno.id, 'examenes', 'bloque'+bloque));
      const div = document.createElement('div');
      div.className = 'fila-intento';
      if (snapIntento.exists()) {
        const d = snapIntento.data();
        div.innerHTML = `<span>${docAlumno.data().nombre}</span><span>${d.calificacion.toFixed(1)}/10 — ${d.aciertos}/${d.total} correctas</span>`;
      } else {
        div.innerHTML = `<span>${docAlumno.data().nombre}</span><span class="texto-ayuda">Sin intento aún</span>`;
      }
      contLista.appendChild(div);
    }
  }

  document.getElementById('selectBloqueIntentos').onchange = cargarIntentos;
  cargarControl();
  cargarPausados();
  cargarIntentos();
}

async function exportarReporte(formato, alumnoFiltro, bloquesFiltro) {
  const grupo = grupoSeleccionado();
  const bloquesAIncluir = (bloquesFiltro && bloquesFiltro.length > 0) ? bloquesFiltro : ['1', '2', '3'];
  let snapAlumnos = await fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', grupo, 'alumnos'));
  let docsAlumnos = snapAlumnos.docs;
  if (alumnoFiltro && alumnoFiltro !== 'todos') {
    docsAlumnos = docsAlumnos.filter((d) => d.id === alumnoFiltro);
  }
  const nombresBloque = { '1': 'Conceptos y definiciones de cocina', '2': 'Conocimiento y manipulación de materias primas', '3': 'Desarrollo de habilidades para la cocina' };
  const bloques = [];
  for (const b of bloquesAIncluir) {
    const alumnosDatos = [];
    for (const docAlumno of docsAlumnos) {
      const auto = await calcularSubtotalesAutomaticos(docAlumno.id, b);
      const refAjuste = fx.doc(db, 'materias', materia, 'grupos', grupo, 'alumnos', docAlumno.id, 'ajustesManuales', 'bloque'+b);
      const snapAjuste = await fx.getDoc(refAjuste);
      const ajustes = snapAjuste.exists() ? snapAjuste.data() : {};
      const aplicar = (auto, manual) => (manual !== undefined && manual !== null) ? manual : auto;
      const participacion = aplicar(auto.participacion, ajustes.participacion);
      const ensayos = aplicar(auto.ensayos, ajustes.ensayos);
      const practicas = aplicar(auto.practicas, ajustes.practicas);
      const asistencia = aplicar(auto.asistencia, ajustes.asistencia);
      const examen = aplicar(auto.examen, ajustes.examen);
      const total = participacion + ensayos + practicas + asistencia + examen;
      alumnosDatos.push({ nombre: docAlumno.data().nombre, participacion, ensayos, practicas, asistencia, examen, total, calificacion: total/10 });
    }
    bloques.push({ numero: b, nombre: nombresBloque[b], alumnos: alumnosDatos });
  }
  const datosGrupo = { nombre: grupo };
  if (formato === 'pdf') generarReportePDF(datosGrupo, bloques);
  else generarReporteCSV(datosGrupo, bloques);
}

function calcularPromediosBloque(alumnos) {
  const n = alumnos.length || 1;
  const suma = alumnos.reduce((acc, a) => ({
    participacion: acc.participacion + a.participacion,
    ensayos: acc.ensayos + a.ensayos,
    practicas: acc.practicas + a.practicas,
    asistencia: acc.asistencia + a.asistencia,
    examen: acc.examen + a.examen,
    total: acc.total + a.total,
    calificacion: acc.calificacion + a.calificacion,
  }), { participacion:0, ensayos:0, practicas:0, asistencia:0, examen:0, total:0, calificacion:0 });
  Object.keys(suma).forEach(k => suma[k] = suma[k] / n);
  return suma;
}

// --- Exportar a Excel (CSV) ---
function generarReporteCSV(datosGrupo, bloques) {
  let csv = 'Bloque,Alumno,Participacion,Ensayos,Practicas,Asistencia,Examen,Total,Calificacion\n';
  bloques.forEach((bloque) => {
    bloque.alumnos.forEach((a) => {
      csv += [bloque.numero, a.nombre, a.participacion.toFixed(1), a.ensayos.toFixed(1), a.practicas.toFixed(1), a.asistencia.toFixed(1), a.examen.toFixed(1), a.total.toFixed(1), a.calificacion.toFixed(1)].join(',') + '\n';
    });
  });
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Reporte_${datosGrupo.nombre}_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
