asivo de\nrecibir lo que un proveedor entrega, y \"comprar\" en el sentido activo de\nseleccionar personalmente lo mejor disponible. Un cocinero comprometido\ncon la calidad prefiere, siempre que sea posible, acudir en persona a\nelegir su materia prima —revisarla con sus propios ojos y manos,\naplicando los criterios de la tabla de recepción— en vez de delegar por\ncompleto esa decisión a quien surte el pedido.</p>\n<p>Esta actitud tiene una consecuencia práctica importante: cuando el\nproveedor habitual no tiene, ese día, un producto que cumpla el estándar\nbuscado, la respuesta correcta no es aceptar lo que hay \"porque ya se\npidió\", sino buscar otro proveedor que sí lo tenga. Esta disposición a\ncambiar de proveedor en el momento —en vez de conformarse— es, en la\npráctica cotidiana de una cocina, la aplicación más directa del\nprincipio de que ningún resultado final puede superar la calidad del\ningrediente con el que se partió.</p>\n<h3>Ejemplo\naplicado: calcular la cantidad a pedir considerando la merma</h3>\n<p>La cantidad que debe pedirse a un proveedor no es la misma que la\ncantidad neta que finalmente se usa en una preparación, porque toda\nmateria prima con cáscara, hueso o recorte pierde peso durante su\nlimpieza. La fórmula para calcular la cantidad bruta (AP) necesaria a\npartir de la cantidad neta (EP) requerida es:</p>\n<p>Cantidad AP = Cantidad EP ÷ (1 − % de merma, en decimal)</p>\n<p>Supongamos que una receta requiere 5 kg de zanahoria pelada y en\ncubos (cantidad EP), y la merma histórica registrada para el pelado y\ndespunte de zanahoria es del 12% (0.12). El cálculo sería: Cantidad AP =\n5 ÷ (1 − 0.12) = 5 ÷ 0.88 = 5.68 kg. Es decir, hay que pedir al\nproveedor 5.68 kg de zanahoria entera para, después de pelarla y\ndesecharla la merma, terminar con los 5 kg netos que la receta necesita.\nPedir exactamente 5 kg —sin considerar la merma— dejaría la cocina corta\nde producto al momento de cocinar.</p>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 2.1</strong></p>\n<ul>\n<li><p>El aprovisionamiento es un ciclo con etapas definidas:\nespecificación, cotización, orden de compra, recepción y\nalmacenamiento.</p></li>\n<li><p>Un proveedor se evalúa por calidad consistente, cumplimiento de\ntiempos, condiciones sanitarias y trazabilidad — no solo por\nprecio.</p></li>\n<li><p>La recepción es el último punto de control real antes de que el\ninsumo entre a producción; cada categoría de alimento tiene criterios de\nverificación propios.</p></li>\n<li><p>FIFO rota por orden de llegada; FEFO rota por fecha de caducidad\nreal — FEFO es más preciso cuando ambas fechas no coinciden.</p></li>\n</ul></div>\n\n"},
  "2.2": {"titulo": "Materias primas de uso común", "html": "<h3>Clasificación\npor origen: la primera gran división</h3>\n<p>Antes de estudiar ingredientes específicos, resulta útil ubicar\ncualquier materia prima dentro de tres grandes orígenes: animal (carnes,\naves, pescados, lácteos, huevo, miel), vegetal (cereales, leguminosas,\nfrutas, verduras, hongos, especias) y mineral (sal, agua, algunos\naditivos). Esta clasificación no es solo taxonómica: cada origen impone\nreglas distintas de manejo, conservación y riesgo sanitario. Un producto\nde origen animal, por ejemplo, exige control de temperatura mucho más\nestricto que uno mineral, que prácticamente no se descompone (Martínez\nde Flores Escobar y González-Garza, 2011).</p>\n<h3>Grupos\nprincipales de materias primas en la cocina profesional</h3>\n<p>Dentro de esos tres orígenes, la formación culinaria reconoce grupos\nde uso cotidiano que todo cocinero debe conocer con profundidad:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Grupo</strong></td>\n<td style=\"text-align: left;\"><strong>Ejemplos y uso\ncaracterístico</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Cereales y harinas</td>\n<td style=\"text-align: left;\">Trigo, arroz, maíz, avena. Base de\npanadería, pastelería, guarniciones y espesantes.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Leguminosas</td>\n<td style=\"text-align: left;\">Frijol, lenteja, garbanzo. Fuente de\nproteína vegetal, base de guisos y purés.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Lácteos</td>\n<td style=\"text-align: left;\">Leche, crema, mantequilla, quesos. Aportan\ngrasa, cuerpo y sabor; base de salsas y repostería.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Huevo</td>\n<td style=\"text-align: left;\">Ligante, emulsionante, aireante y proteína\ncentral en incontables preparaciones.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Carnes y aves</td>\n<td style=\"text-align: left;\">Res, cerdo, cordero, pollo, pavo. Proteína\ncentral del plato fuerte clásico.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Pescados y mariscos</td>\n<td style=\"text-align: left;\">De agua dulce y salada, moluscos y\ncrustáceos. Cocción rápida, alta sensibilidad a la frescura.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Frutas y verduras</td>\n<td style=\"text-align: left;\">Aportan color, textura, fibra y frescura;\nvarían enormemente por temporada y región.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Grasas y aceites</td>\n<td style=\"text-align: left;\">Vehículo de sabor y de calor; determinan\ntextura y punto de humeo en la cocción.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Condimentos y especias</td>\n<td style=\"text-align: left;\">Sal, pimienta, hierbas frescas y secas,\nespecias molidas o enteras. Definen el perfil de sabor final.</td>\n</tr>\n</tbody>\n</table>\n<h3>Breve historia del\ncomercio de especias</h3>\n<p>Pocas materias primas ilustran mejor el peso histórico del\naprovisionamiento que las especias. Durante siglos, productos como la\npimienta, la canela, el clavo y la nuez moscada viajaron miles de\nkilómetros a través de rutas comerciales que atravesaban Asia, Medio\nOriente y el Mediterráneo, encareciéndose en cada tramo del trayecto. La\nbúsqueda de una ruta marítima directa hacia las regiones productoras de\nespecias fue uno de los motores económicos centrales de la expansión\neuropea de los siglos XV y XVI, con consecuencias históricas que\ntrascienden por completo el ámbito culinario. Ese origen ayuda a\nentender por qué, incluso hoy, ciertas especias siguen siendo\nnotablemente más costosas que otras: su historia de escasez y transporte\ndejó huella en su valor percibido.</p>\n<div class=\"recuerda\"><em>El precio histórico de una especia\nno siempre refleja su dificultad de cultivo actual — buena parte de ese\nvalor es herencia de rutas comerciales que hoy ya no existen.</em></div>\n<h3>Grados de calidad: el caso\ndel huevo</h3>\n<p>Dentro de un mismo grupo de materia prima, la industria alimentaria\nsuele establecer sistemas de clasificación por grado de calidad, y el\nhuevo es uno de los ejemplos más claros y accesibles para ilustrar este\nprincipio. La clasificación evalúa principalmente la firmeza de la\nclara, la altura de la yema y el estado de la cámara de aire al interior\ndel cascarón:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 18%\"/>\n<col style=\"width: 78%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Grado</strong></td>\n<td style=\"text-align: left;\"><strong>Características y uso\nrecomendado</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">AA</td>\n<td style=\"text-align: left;\">Clara firme y espesa, yema alta y\ncentrada. Ideal para preparaciones donde la presentación importa: huevo\nestrellado, escalfado, poché.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">A</td>\n<td style=\"text-align: left;\">Clara razonablemente firme, yema\nligeramente menos definida. Adecuado para la mayoría de usos generales\nde cocina.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">B</td>\n<td style=\"text-align: left;\">Clara más líquida, yema aplanada. Apto\npara repostería, revueltos o cualquier preparación donde la forma no es\nvisible en el resultado final.</td>\n</tr>\n</tbody>\n</table>\n<p>Este mismo principio de clasificación por grado —evaluar atributos\nfísicos objetivos y asignar una categoría de calidad— se repite en\nmuchos otros grupos de materia prima (carnes, quesos, aceite de oliva),\naunque cada uno con sus propios criterios específicos.</p>\n<h3>Tipos de leche según su\nproceso térmico</h3>\n<p>Otro ejemplo útil dentro de los lácteos es entender que \"leche\" no es\nun producto único, sino una familia de productos que difieren según el\ntratamiento térmico aplicado para garantizar su seguridad y prolongar su\nvida de anaquel:</p>\n<ul>\n<li><p>Pasteurizada: calentada a una temperatura moderada (72°C aprox.\npor 15 segundos, pasteurización rápida) suficiente para eliminar\npatógenos sin alterar demasiado el sabor; requiere refrigeración y tiene\nvida de anaquel corta.</p></li>\n<li><p>Ultrapasteurizada (UHT): calentada a temperaturas mucho más altas\n(135–150°C) por segundos, lo que le da una vida de anaquel prolongada\nincluso sin refrigeración hasta abrirse, a cambio de un ligero cambio de\nsabor por la mayor exposición al calor.</p></li>\n<li><p>Homogeneizada: proceso mecánico (no térmico) que rompe los\nglóbulos de grasa para que no se separen ni floten a la superficie,\ndando una textura uniforme.</p></li>\n</ul>\n<p>Elegir el tipo correcto de leche importa en repostería de precisión,\ndonde la ultrapasteurización puede afectar ligeramente el comportamiento\nde la leche en ciertas fermentaciones o cuajados, mientras que para uso\ngeneral de cocina la diferencia resulta imperceptible.</p>\n<h3>El huevo:\nfunciones gastronómicas más allá de \"proteína\"</h3>\n<p>Pocos ingredientes son tan versátiles como el huevo, y buena parte de\nesa versatilidad se explica porque cumple funciones técnicas muy\ndistintas entre sí dentro de una preparación, no solo la de aportar\nproteína. Reconocer estas funciones es lo que permite entender por qué\nuna receta pide huevo, y qué pasaría si se omitiera:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Función</strong></td>\n<td style=\"text-align: left;\"><strong>Cómo actúa y ejemplo</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ligante</td>\n<td style=\"text-align: left;\">Las proteínas del huevo se coagulan con el\ncalor y unen otros ingredientes entre sí; por eso se usa en albóndigas,\ncroquetas y rellenos.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Emulsionante</td>\n<td style=\"text-align: left;\">La lecitina de la yema permite mezclar\nagua y grasa sin que se separen; es la base de la mayonesa y de la salsa\nholandesa.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Aireante</td>\n<td style=\"text-align: left;\">La clara batida atrapa burbujas de aire\nestabilizadas por sus proteínas; da estructura a merengues, suflés y\nalgunos panes.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Espesante</td>\n<td style=\"text-align: left;\">Al calentarse gradualmente en un líquido,\nla proteína del huevo espesa sin llegar a cuajar por completo; es la\nbase de natillas y cremas inglesas.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Clarificante</td>\n<td style=\"text-align: left;\">La clara cruda atrapa impurezas cuando se\ncalienta lentamente en un caldo turbio, permitiendo colarlas y obtener\nun consomé transparente.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Glaseado (dorado)</td>\n<td style=\"text-align: left;\">Batido y aplicado con brocha sobre masas\nantes de hornear, aporta color dorado brillante por la reacción de\nMaillard sobre su proteína y azúcares.</td>\n</tr>\n</tbody>\n</table>\n<p>Comprender estas funciones explica por qué, en algunos casos, el\nhuevo puede sustituirse por otro ingrediente que cumpla la misma función\ntécnica (por ejemplo, ciertos almidones como ligantes), mientras que en\notros —como el aireado de un merengue— no existe un sustituto sencillo\nque replique exactamente su comportamiento.</p>\n<h3>A qué temperatura\ncoagula realmente el huevo</h3>\n<p>La clara y la yema no coagulan a la misma temperatura, y esa\ndiferencia es la que permite controlar con precisión texturas como el\nhuevo poché o el tibio: las proteínas de la clara comienzan a coagular\nentre 65°C y 70°C, mientras que las de la yema lo hacen entre 75°C y\n80°C. Ese margen de unos 10°C es la ventana que un cocinero aprovecha\npara lograr una clara firme con una yema todavía líquida o cremosa —\ncocinar por encima de 80°C endurece ambas por completo.</p>\n<p>Para efectos de cálculo en cocina de producción, conviene tener\npresente el peso promedio de un huevo sin cáscara (50 g): 20 huevos\ncompletos equivalen aproximadamente a 1 kg; 48 yemas equivalen a 1\nlitro; y 32 claras equivalen a 1 litro. Estas equivalencias permiten\nconvertir una receta que pide huevo \"por pieza\" a una receta de\nproducción que pide huevo por peso o volumen, sin necesidad de pesar\ncada vez.</p>\n<div class=\"recuerda\"><em>La clara\ncoagula entre 65-70°C y la yema entre 75-80°C — ese margen de 10°C es lo\nque hace posible un huevo con clara firme y yema líquida.</em></div>\n<h3>Harinas:\nclasificación por contenido de proteína</h3>\n<p>\"Harina\" no es un ingrediente único, sino una familia clasificada\nprincipalmente por su contenido de proteína (gluten potencial), que\ndetermina qué tan elástica y fuerte puede volverse una masa hecha con\nella. Elegir la harina equivocada para un uso específico produce\nresultados tan distintos como elegir la papa equivocada para un puré,\ntal como se vio en el subtema 2.3:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 18%\"/>\n<col style=\"width: 53%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Tipo de harina</strong></td>\n<td style=\"text-align: left;\"><strong>% proteína aprox.</strong></td>\n<td style=\"text-align: left;\"><strong>Uso recomendado</strong></td>\n</tr>\n<tr class=\"even\">\n<td>Harina para pastel (baja)</td>\n<td style=\"text-align: left;\">7–9%</td>\n<td style=\"text-align: left;\">Bizcochos y pasteles suaves, donde se\nbusca una miga tierna con poco desarrollo de gluten.</td>\n</tr>\n<tr class=\"odd\">\n<td>Harina todo uso</td>\n<td style=\"text-align: left;\">9–11%</td>\n<td style=\"text-align: left;\">Uso general: galletas, algunas masas,\nespesantes. Balance entre estructura y suavidad.</td>\n</tr>\n<tr class=\"even\">\n<td>Harina de pan (alta)</td>\n<td style=\"text-align: left;\">11–13%</td>\n<td style=\"text-align: left;\">Panes con estructura fuerte y masticable,\ndonde se necesita buen desarrollo de gluten.</td>\n</tr>\n<tr class=\"odd\">\n<td>Harina integral</td>\n<td style=\"text-align: left;\">Variable</td>\n<td style=\"text-align: left;\">Incluye salvado y germen del grano; aporta\nfibra y sabor, pero el salvado corta las hebras de gluten y da una miga\nmás densa.</td>\n</tr>\n</tbody>\n</table>\n<p>Usar harina de pan (alta en proteína) para un pastel produce una miga\ndura y correosa, porque se desarrolla más gluten del que ese tipo de\npreparación necesita; usar harina para pastel (baja en proteína) para un\npan de estructura fuerte produce una pieza que no logra la elasticidad\nnecesaria para atrapar bien el gas de la fermentación.</p>\n<h3>Almidones puros:\nmaicena y espesantes similares</h3>\n<p>A diferencia de la harina de trigo —que combina almidón con proteína\n(gluten)—, ingredientes como la maicena (almidón de maíz), la fécula de\npapa o el arrurruz son almidones prácticamente puros, sin proteína\nsignificativa. Esto los hace espesantes más \"limpios\": producen una\ntextura translúcida y sin sabor a crudo si se cocinan lo suficiente,\ndistinta a la textura opaca y ligeramente harinosa que deja la harina de\ntrigo como espesante. Por eso, salsas donde se busca una apariencia\nbrillante y transparente —como muchas salsas agridulces— suelen\nespesarse con maicena disuelta en agua fría antes de incorporarse al\nlíquido caliente, nunca directamente en polvo, porque formaría\ngrumos.</p>\n<h3>Crustáceos\ny moluscos: dos familias distintas de mariscos</h3>\n<p>Dentro del grupo de pescados y mariscos conviene distinguir dos\nfamilias con anatomía y manejo muy distintos. Los crustáceos (camarón,\nlangosta, jaiba, langostino) están recubiertos por un caparazón o\nexoesqueleto rígido, con la mayor parte de su carne comestible\nconcentrada en el abdomen o las pinzas; se cuecen típicamente en agua\nhirviendo con sal o en un caldo corto, y su cocción debe ser rápida para\nno endurecer la carne.</p>\n<p>Los moluscos, por su parte, no tienen articulaciones, y se dividen a\nsu vez según su estructura: los bivalvos (ostión, almeja, mejillón)\nestán protegidos por dos valvas o conchas; los gasterópodos (caracol,\nabulón) se desplazan sobre un pie muscular único y suelen tener una sola\nconcha; y los cefalópodos (pulpo, calamar) no tienen estructura calcárea\nexterna, y su propulsión ocurre desde la cabeza.</p>\n<p>Tanto crustáceos como moluscos comparten un criterio de frescura que\nlos distingue de otros productos del mar: deben mantenerse húmedos, con\npeso notable al sostenerlos en la mano, y con el característico olor a\nagua de mar o algas — nunca amoniacal. Los moluscos bivalvos que se\ncompran vivos y con concha deben descartarse si están abiertos sin\nresponder al tacto, o si al golpear la concha producen un sonido hueco,\nseñal de que ya no están vivos.</p>\n<div class=\"recuerda\"><em>Un\nmejillón o una almeja que no cierra su concha al tocarlo, o que suena\nhueco al golpearlo, ya no está vivo y debe descartarse — no hay forma\nsegura de \"salvarlo\" cocinándolo más tiempo.</em></div>\n<h3>Aceites y grasas:\ntipos y su uso correcto</h3>\n<p>Las grasas que se emplean en cocina se dividen, en primer lugar, por\nsu origen —vegetal o animal— y, en segundo lugar, por su comportamiento\nfrente al calor, lo que determina su uso correcto:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Grasa</strong></td>\n<td style=\"text-align: left;\"><strong>Origen y uso\ncaracterístico</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Aceites para freír (canola, girasol,\ncártamo)</td>\n<td style=\"text-align: left;\">Vegetal; punto de humeo alto, sabor\nneutro. Ideales para fritura profunda y salteados a fuego alto.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Aceite de oliva</td>\n<td style=\"text-align: left;\">Vegetal; sabor pronunciado, punto de humeo\nmás bajo que los aceites neutros. Mejor en usos donde su sabor es\nprotagonista (aderezos, terminado de platillos) que en fritura a alta\ntemperatura.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Manteca de cerdo</td>\n<td style=\"text-align: left;\">Animal; sólida a temperatura ambiente,\naporta sabor característico y una textura quebradiza distintiva en masas\n(tamales, algunas galletas, algunos panes tradicionales).</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Mantequilla</td>\n<td style=\"text-align: left;\">Animal (láctea); grasa natural con agua y\nsólidos lácteos; aporta sabor insustituible pero se quema a temperaturas\nrelativamente bajas.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Margarina</td>\n<td style=\"text-align: left;\">Vegetal, procesada para imitar el\ncomportamiento de la mantequilla a menor costo; su composición varía\nmucho según el fabricante.</td>\n</tr>\n</tbody>\n</table>\n<h3>Grasas naturales\nfrente a grasas hidrogenadas</h3>\n<p>Una distinción importante dentro de las grasas —y no solo por razones\ntécnicas de cocina, sino de salud— es la diferencia entre grasas\nnaturales y grasas hidrogenadas. Las grasas naturales (mantequilla,\nmanteca, aceite de oliva, aceites vegetales sin procesar) existen en ese\nestado —líquido o sólido— por su composición química original. Las\ngrasas hidrogenadas, en cambio, son aceites vegetales líquidos que se\nsometen a un proceso industrial de hidrogenación para volverlos sólidos\na temperatura ambiente (como ocurre en muchas margarinas y mantecas\nvegetales comerciales), un proceso que genera las llamadas grasas trans,\nasociadas por la evidencia científica con mayor riesgo cardiovascular\ncuando se consumen de forma habitual.</p>\n<p>Para efectos de cocina, esta distinción también tiene consecuencias\nprácticas de sabor y textura: una grasa hidrogenada suele tener un sabor\nmás neutro y una textura más uniforme y estable que una grasa natural\nequivalente, lo cual explica por qué la industria de panificación\ncomercial las prefiere por su consistencia, aunque el resultado en sabor\nfinal rara vez alcanza el nivel de una grasa natural bien elegida.</p>\n<div class=\"recuerda\"><em>Una grasa\nhidrogenada es más estable y barata, pero una grasa natural\n—mantequilla, manteca, aceite de oliva— casi siempre gana en sabor. La\nelección depende de qué se está priorizando.</em></div>\n<h3>Ejemplo\naplicado: sustituir un ingrediente dentro de su mismo grupo</h3>\n<p>Un proveedor informa que no tiene disponible el queso manchego que\nuna receta requiere. En lugar de cancelar el platillo, un cocinero con\ndominio de esta clasificación por grupos busca un sustituto dentro de la\nmisma categoría (lácteos, quesos semicurados de textura y capacidad de\nfusión similares) — por ejemplo, un queso asadero o Chihuahua— evaluando\nsi el nuevo queso aporta un perfil de sabor y una capacidad de fundido\ncomparables. Esta capacidad de sustituir con criterio, y no al azar, es\nuna de las ventajas prácticas más inmediatas de dominar la clasificación\npor grupos de materia prima.</p>\n<h3>Ejemplo\naplicado: construir un mise en place de despensa por grupo</h3>\n<p>Para un menú de tres tiempos (entrada, plato fuerte, postre), un\ncocinero organiza su lista de compras no por platillo, sino por grupo de\nmateria prima, para detectar traslapes y optimizar el pedido: revisa qué\nlácteos necesita en total (crema para la entrada y para el postre, por\nejemplo, se piden juntos), qué proteínas requiere (verificando que no\ncompita el mismo corte en dos platillos distintos), y qué condimentos se\nrepiten entre preparaciones. Esta forma de organizar la compra —por\ngrupo de materia prima, no por receta aislada— es la que se usa en\ncocinas de producción real, y reduce tanto el costo como el\ndesperdicio.</p>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 2.2</strong></p>\n<ul>\n<li><p>Toda materia prima puede ubicarse en un origen animal, vegetal o\nmineral, y ese origen determina sus reglas de manejo y riesgo\nsanitario.</p></li>\n<li><p>La cocina profesional reconoce grupos de uso común (cereales,\nlácteos, huevo, carnes, pescados, frutas y verduras, grasas,\ncondimentos) que se estudian con profundidad propia.</p></li>\n<li><p>La historia del comercio de especias explica en buena medida por\nqué persisten diferencias de precio que no corresponden a su dificultad\nde cultivo actual.</p></li>\n<li><p>Organizar la compra por grupo de materia prima, no por receta\naislada, es la práctica de cocinas de producción real.</p></li>\n</ul></div>\n\n"},
  "2.3": {"titulo": "Variedades y características físicas", "html": "<h3>Por qué las variedades\nimportan</h3>\n<p>Decir simplemente \"papa\" o \"chile\" es, para un cocinero profesional,\nuna información incompleta. Dentro de una misma especie existen decenas\nde variedades con propiedades físicas y culinarias radicalmente\ndistintas: una papa cerosa se comporta de forma completamente diferente\na una papa harinosa en la olla, y un chile serrano no es intercambiable\ncon un chile habanero solo porque ambos sean \"chile\". Reconocer la\nvariedad correcta —y no solo el nombre genérico del ingrediente— es lo\nque separa una selección de compra informada de una improvisada (Monroy\nde Sada, 2012).</p>\n<h3>Características\nfísicas que determinan calidad y uso</h3>\n<p>Independientemente de la variedad específica, existen atributos\nfísicos universales que un cocinero evalúa al seleccionar materia\nprima:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Atributo</strong></td>\n<td style=\"text-align: left;\"><strong>Qué indica</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Firmeza</td>\n<td style=\"text-align: left;\">Frescura y punto de madurez; una textura\ndemasiado blanda suele indicar sobremadurez o inicio de\ndescomposición.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Color</td>\n<td style=\"text-align: left;\">Madurez, variedad y, en ocasiones, señal\nde deterioro (oscurecimiento anormal, manchas).</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Humedad superficial</td>\n<td style=\"text-align: left;\">Frescura reciente (deseable) frente a\nhumedad excesiva por almacenamiento inadecuado (indeseable).</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Tamaño y calibre</td>\n<td style=\"text-align: left;\">Determina rendimiento, tiempo de cocción y\npresentación final del platillo.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Aroma</td>\n<td style=\"text-align: left;\">Frescura, variedad, y en casos de\ndescomposición, la primera señal de alerta antes que la vista.</td>\n</tr>\n</tbody>\n</table>\n<h3>Criterios\norganolépticos de aceptación y rechazo por categoría</h3>\n<p>Más allá de los atributos generales de la tabla anterior, cada\ncategoría de materia prima tiene señales organolépticas específicas\n—percibidas por los sentidos: vista, tacto, olfato— que un cocinero debe\nreconocer para decidir con confianza si un producto se acepta o se\nrechaza:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 21%\"/>\n<col style=\"width: 38%\"/>\n<col style=\"width: 38%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Categoría</strong></td>\n<td style=\"text-align: left;\"><strong>Señales de\naceptación</strong></td>\n<td style=\"text-align: left;\"><strong>Señales de rechazo</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Carne de res</td>\n<td style=\"text-align: left;\">Color rojo cereza brillante, superficie\nligeramente húmeda pero no viscosa, olor fresco y neutro, firme y\nelástica al presionar (recupera su forma).</td>\n<td style=\"text-align: left;\">Color rojo-café apagado o verdoso,\nsuperficie pegajosa o babosa, olor agrio o amoniacal, no recupera su\nforma al presionar.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Carne de cerdo</td>\n<td style=\"text-align: left;\">Color rosa pálido uniforme, grasa blanca y\nfirme, olor suave característico, textura firme.</td>\n<td style=\"text-align: left;\">Color grisáceo o con manchas oscuras,\ngrasa amarillenta o blanda, olor rancio o agrio.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Aves</td>\n<td style=\"text-align: left;\">Piel color crema uniforme (sin importar la\nvariación natural por raza), sin manchas ni magulladuras, olor neutro,\ncarne firme y elástica.</td>\n<td style=\"text-align: left;\">Piel con tono grisáceo o verdoso, manchas\nde sangre extendidas, olor agrio, textura pegajosa.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Pescado entero</td>\n<td style=\"text-align: left;\">Ojos brillantes, transparentes y\nabombados; agallas rojo intenso; escamas firmemente adheridas; olor a\nmar fresco; carne que recupera su forma al presionar.</td>\n<td style=\"text-align: left;\">Ojos hundidos, opacos o grisáceos; agallas\npardas o grisáceas; escamas que se desprenden con facilidad; olor\namoniacal fuerte; carne que queda marcada al presionar.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Verduras de hoja</td>\n<td style=\"text-align: left;\">Color intenso y uniforme, hojas turgentes\n(erguidas, no caídas), sin manchas de humedad ni bordes\noscurecidos.</td>\n<td style=\"text-align: left;\">Color apagado o amarillento, hojas\nmarchitas o flácidas, bordes translúcidos u oscuros, olor a\ndescomposición.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Frutas y verduras de fruto (tomate,\ncalabaza, etc.)</td>\n<td style=\"text-align: left;\">Firmeza acorde a la variedad, color\nuniforme característico, piel sin cortes ni magulladuras, aroma propio\nperceptible en la madurez adecuada.</td>\n<td style=\"text-align: left;\">Zonas blandas o hundidas, moho visible,\npiel arrugada por deshidratación, ausencia total de aroma (indicio de\ncosecha muy prematura) u olor fermentado (sobremadurez).</td>\n</tr>\n</tbody>\n</table>\n<p>Estos criterios organolépticos son, en esencia, una extensión\npráctica de la tabla de recepción vista en el subtema 2.1 — la\ndiferencia es que aquí se aplican no solo al momento de recibir un\npedido, sino en cualquier momento posterior, como parte de una revisión\nrutinaria del inventario para detectar deterioro antes de que un\ningrediente comprometido llegue a un platillo.</p>\n<h3>Caso de\nestudio: variedades de papa y su uso correcto</h3>\n<p>La papa es un ejemplo particularmente claro de por qué la variedad\ndetermina el resultado final. Existen, a grandes rasgos, dos categorías\nfísicas de papa según su contenido de almidón:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 36%\"/>\n<col style=\"width: 36%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Categoría</strong></td>\n<td style=\"text-align: left;\"><strong>Características</strong></td>\n<td style=\"text-align: left;\"><strong>Uso recomendado</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Cerosa (bajo almidón)</td>\n<td style=\"text-align: left;\">Textura firme, mantiene su forma al cocer,\npiel fina.</td>\n<td style=\"text-align: left;\">Ensaladas de papa, guisos, papas al vapor\ndonde se busca que no se deshaga.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Harinosa (alto almidón)</td>\n<td style=\"text-align: left;\">Textura seca y esponjosa una vez cocida,\nse deshace con facilidad.</td>\n<td style=\"text-align: left;\">Puré, papas horneadas, papas fritas —\ndonde se busca una textura suelta o crujiente.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Todo uso (intermedia)</td>\n<td style=\"text-align: left;\">Balance entre ambas categorías; versátil\npero no óptima en ningún extremo.</td>\n<td style=\"text-align: left;\">Preparaciones generales cuando no se\ndispone de la variedad ideal.</td>\n</tr>\n</tbody>\n</table>\n<p>Usar una papa cerosa para un puré produce una textura gomosa y\npegajosa, incluso siguiendo perfectamente la técnica; usar una papa\nharinosa para una ensalada de papa hace que las piezas se rompan y se\ndeshagan al mezclarlas. El error no está en la técnica —está en haber\nelegido la variedad equivocada antes de empezar a cocinar.</p>\n<div class=\"recuerda\"><em>Ninguna\ntécnica compensa una variedad equivocada: elegir la variedad correcta\nocurre antes de encender el fuego, no durante la cocción.</em></div>\n<h3>La escala\nScoville: cuantificar el picor de los chiles</h3>\n<p>El picor —la sensación de ardor que producen los chiles— no es, en\nsentido estricto, un sabor: es una respuesta del sistema nervioso a la\ncapsaicina, un compuesto químico presente en concentraciones variables\nsegún la variedad de chile. En 1912, el farmacéutico estadounidense\nWilbur Scoville desarrolló un método para cuantificar esa concentración,\ndando origen a la escala que hoy lleva su nombre (SHU, Scoville Heat\nUnits), y que sigue siendo la referencia estándar para clasificar el\npicor de una variedad de chile de forma objetiva, no solo subjetiva.</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 29%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Variedad</strong></td>\n<td><strong>Rango SHU aproximado</strong></td>\n<td style=\"text-align: left;\"><strong>Uso característico</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Chile dulce / morrón</td>\n<td>0 SHU</td>\n<td style=\"text-align: left;\">Sin picor; aporta color y dulzor.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Poblano</td>\n<td>1,000–2,000 SHU</td>\n<td style=\"text-align: left;\">Picor suave; chiles rellenos, rajas.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Jalapeño</td>\n<td>2,500–8,000 SHU</td>\n<td style=\"text-align: left;\">Picor moderado; salsas frescas,\nencurtidos.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Serrano</td>\n<td>10,000–23,000 SHU</td>\n<td style=\"text-align: left;\">Picor notable; salsas de mesa.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Habanero</td>\n<td>100,000–350,000 SHU</td>\n<td style=\"text-align: left;\">Picor muy alto; se usa en cantidades\nmínimas.</td>\n</tr>\n</tbody>\n</table>\n<p>La diferencia entre un jalapeño y un habanero, en términos de picor,\npuede ser de más de cuarenta veces — razón por la cual sustituir uno por\notro en una receta sin ajustar drásticamente la cantidad altera por\ncompleto el resultado, sin importar que ambos sean, genéricamente,\n\"chile\".</p>\n<div class=\"recuerda\"><em>Un\nhabanero puede tener hasta 40 veces más picor que un jalapeño — nunca se\nsustituyen en la misma cantidad.</em></div>\n<h3>Protocolo de\nevaluación sensorial sistemática</h3>\n<p>Comparar dos variedades de forma confiable requiere controlar\nvariables que, de otro modo, sesgan la percepción sin que el catador se\ndé cuenta. Un protocolo básico de evaluación sensorial en el aula\nincluye:</p>\n<ol type=\"1\">\n<li><p>Presentar las muestras bajo las mismas condiciones (misma\ntemperatura, mismo tamaño de porción, mismo tiempo desde su\npreparación).</p></li>\n<li><p>Codificar las muestras (por ejemplo, con letras o números) en vez\nde identificarlas por nombre, para evitar que la expectativa influya en\nla percepción.</p></li>\n<li><p>Evaluar en un orden aleatorio distinto para cada catador, ya que\nla primera muestra probada suele influir en la percepción de las\nsiguientes.</p></li>\n<li><p>Limpiar el paladar entre muestras con agua natural o pan neutro,\npara no arrastrar el sabor de una muestra a la siguiente.</p></li>\n<li><p>Registrar la evaluación por escrito de inmediato, atributo por\natributo, en lugar de confiar en la memoria al final del\nejercicio.</p></li>\n</ol>\n<h3>Ejemplo\naplicado: comparación sensorial de dos variedades</h3>\n<p>Un ejercicio formativo habitual consiste en cocer, en paralelo y con\nel mismo método, dos variedades de un mismo ingrediente (por ejemplo,\ndos variedades de tomate, o dos variedades de chile), y comparar de\nforma sistemática —aplicando el protocolo anterior—: textura antes y\ndespués de cocción, color, intensidad de sabor, nivel de picor o dulzor,\ny comportamiento general. Documentar estas diferencias en una tabla\ncomparativa —no solo probarlas de forma casual— es lo que convierte una\nexperiencia sensorial en conocimiento técnico transferible a decisiones\nde compra futuras.</p>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 2.3</strong></p>\n<ul>\n<li><p>El nombre genérico de un ingrediente no es información\nsuficiente; la variedad específica determina su comportamiento en\ncocción.</p></li>\n<li><p>Firmeza, color, humedad superficial, tamaño y aroma son atributos\nfísicos universales para evaluar calidad, sin importar el\ningrediente.</p></li>\n<li><p>Las papas cerosas mantienen su forma (ideales para ensaladas y\nguisos); las harinosas se deshacen (ideales para puré y\nhorneado).</p></li>\n<li><p>Ninguna técnica de cocción compensa haber elegido la variedad\nequivocada de materia prima.</p></li>\n</ul></div>\n\n"},
  "2.4": {"titulo": "Cualidades gastronómicas", "html": "<h3>Más\nallá de lo nutricional: por qué se elige un ingrediente</h3>\n<p>Hasta ahora este bloque ha estudiado el origen, la clasificación y\nlas características físicas de la materia prima. Este último subtema\naborda una pregunta distinta: ¿qué aporta un ingrediente a la\nexperiencia de comer? A esas propiedades —sabor, aroma, textura, color\ny, en conjunto, la impresión sensorial completa que deja un alimento— se\nles llama cualidades gastronómicas, y son, en última instancia, la razón\npor la que un cocinero elige un ingrediente sobre otro para una\npreparación específica (Martínez de Flores Escobar y González-Garza,\n2011).</p>\n<h3>Los cinco sabores\nbásicos y el quinto sabor</h3>\n<p>La percepción del sabor combina información de las papilas gustativas\n—que distinguen un número limitado de sabores básicos— con el olfato,\nque aporta la mayor parte de la complejidad que asociamos con \"sabor\".\nLos sabores básicos reconocidos son:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Sabor básico</strong></td>\n<td style=\"text-align: left;\"><strong>Ejemplo\ncaracterístico</strong></td>\n</tr>\n<tr class=\"even\">\n<td>Dulce</td>\n<td style=\"text-align: left;\">Azúcar, frutas maduras, algunas verduras\ncocidas (zanahoria, betabel).</td>\n</tr>\n<tr class=\"odd\">\n<td>Salado</td>\n<td style=\"text-align: left;\">Sal de mesa, quesos curados, embutidos,\nsalsa de soya.</td>\n</tr>\n<tr class=\"even\">\n<td>Ácido</td>\n<td style=\"text-align: left;\">Cítricos, vinagre, yogur, fermentados en\ngeneral.</td>\n</tr>\n<tr class=\"odd\">\n<td>Amargo</td>\n<td style=\"text-align: left;\">Café, cacao puro, algunas verduras de hoja\nverde oscura, cáscaras cítricas.</td>\n</tr>\n<tr class=\"even\">\n<td>Umami (\"quinto sabor\")</td>\n<td style=\"text-align: left;\">Caldo de carne reducido, queso parmesano,\nsalsa de soya, tomate maduro, hongos.</td>\n</tr>\n</tbody>\n</table>\n<p>El umami fue identificado y nombrado formalmente por un investigador\njaponés a principios del siglo XX, mucho después que los otros cuatro\nsabores clásicos reconocidos desde la antigüedad. Corresponde a la\npercepción del glutamato, un aminoácido presente de forma natural en\nalimentos ricos en proteína madurada o fermentada, y explica por qué\ncombinaciones como tomate con queso parmesano, o carne con salsa de\nsoya, producen una sensación de profundidad de sabor que ninguno de los\nsabores básicos clásicos explica por sí solo.</p>\n<div class=\"recuerda\"><em>El umami\nno es un sabor \"nuevo\": siempre estuvo presente en la comida; lo que\nocurrió a principios del siglo XX fue que se identificó y nombró\ncientíficamente como una categoría propia.</em></div>\n<h3>Propiedades\nfuncionales: lo que un ingrediente le hace a una preparación</h3>\n<p>Además de aportar sabor, aroma, color y textura por sí mismos, muchos\ningredientes cumplen una función técnica dentro de una preparación\n—transforman la textura o estructura del conjunto de una manera\npredecible—. Reconocer estas propiedades funcionales es lo que permite a\nun cocinero elegir con criterio, en vez de memorizar recetas: si se\nentiende qué hace un ingrediente, se puede decidir con qué sustituirlo o\ncómo ajustarlo.</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 27%\"/>\n<col style=\"width: 47%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Propiedad funcional</strong></td>\n<td style=\"text-align: left;\"><strong>Ingredientes típicos</strong></td>\n<td style=\"text-align: left;\"><strong>Qué hace</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Espesante</td>\n<td style=\"text-align: left;\">Almidones (maicena, harina), yema de\nhuevo, puré de vegetales</td>\n<td style=\"text-align: left;\">Aumenta la viscosidad de un líquido al\nabsorber agua o coagularse con el calor.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Emulsionante</td>\n<td style=\"text-align: left;\">Yema de huevo (lecitina), mostaza, algunas\nproteínas lácteas</td>\n<td style=\"text-align: left;\">Permite que agua y grasa se mantengan\nmezcladas de forma estable sin separarse.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Gelificante</td>\n<td style=\"text-align: left;\">Grenetina (colágeno animal), agar-agar (de\norigen algal), pectina (en frutas)</td>\n<td style=\"text-align: left;\">Forma una red que atrapa líquido y\nsolidifica una preparación al enfriarse (o, en el caso del agar, incluso\nen caliente).</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Aireante</td>\n<td style=\"text-align: left;\">Claras de huevo, crema batida, algunas\nproteínas lácteas</td>\n<td style=\"text-align: left;\">Atrapa burbujas de aire y las estabiliza,\ndando ligereza y volumen a la preparación.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Leudante</td>\n<td style=\"text-align: left;\">Levadura, polvo para hornear, bicarbonato\nde sodio</td>\n<td style=\"text-align: left;\">Genera gas (dióxido de carbono) que\nexpande una masa, dándole estructura ligera y porosa.</td>\n</tr>\n</tbody>\n</table>\n<p>Esta forma de pensar por función —y no solo por identidad del\ningrediente— es la misma lógica que ya se aplicó en el subtema 2.2 al\nsustituir un queso por otro dentro de su mismo grupo: comprender qué\nhace un ingrediente permite reemplazarlo con criterio cuando no está\ndisponible, o combinarlo deliberadamente con otro para lograr un efecto\nespecífico.</p>\n<h3>Textura,\ncolor y aroma como cualidades gastronómicas</h3>\n<p>El sabor es solo una de las cualidades gastronómicas; la experiencia\ncompleta de comer depende también de la textura (crocante, cremosa,\nfibrosa, gelatinosa), el color (que genera expectativas antes incluso de\nprobar el alimento) y el aroma (que, como ya se mencionó, aporta la\nmayor parte de la complejidad percibida como \"sabor\"). Un platillo\ntécnicamente correcto en sabor pero monótono en textura —todo suave, o\ntodo crujiente— se percibe como menos logrado que uno que combina\ncontrastes deliberados.</p>\n<h3>La ciencia detrás del\numami: el glutamato</h3>\n<p>El umami se percibe gracias a receptores específicos en la lengua\nsensibles al glutamato, un aminoácido que existe de forma natural en\nmuchos alimentos, y que se concentra especialmente durante procesos de\nmaduración, fermentación o cocción prolongada. Esto explica por qué un\ncaldo de huesos reducido durante horas, un queso curado durante meses, o\nuna salsa de soya fermentada durante semanas, desarrollan una\nprofundidad de sabor muy superior a sus ingredientes originales sin\nprocesar: el tiempo y el proceso liberan y concentran glutamato libre,\nintensificando la percepción de umami.</p>\n<p>Este mismo principio conecta con la reacción de Maillard estudiada en\nel Bloque 1: cuando se sella una carne y se forma la costra dorada, no\nsolo se genera color y aroma tostado, también se producen compuestos que\nrefuerzan la percepción de umami — razón por la cual una carne bien\ndorada sabe más \"a carne\" que una simplemente hervida, más allá de la\ndiferencia obvia de textura.</p>\n<h3>Food pairing:\ncompuestos aromáticos compartidos</h3>\n<p>Una corriente contemporánea de la gastronomía, popularizada desde\ninicios del siglo XXI por cocineros e investigadores que analizaron la\ncomposición química de los alimentos, propone un principio que va más\nallá de la tradición culinaria: dos ingredientes que comparten un número\nsignificativo de compuestos aromáticos volátiles tienden a combinar bien\nentre sí, incluso si no existe ninguna tradición culinaria previa que\nlos una. El ejemplo más citado de esta teoría es el chocolate con queso\nazul, una combinación poco intuitiva por tradición, pero que comparte\nperfiles aromáticos que el análisis químico sí explica.</p>\n<p>Esta perspectiva no reemplaza el conocimiento culinario tradicional\n—basado en siglos de experimentación práctica—, pero sí ofrece una\nherramienta adicional para explorar combinaciones nuevas con una base\nmás sistemática que la simple intuición o el ensayo y error.</p>\n<h3>Principios básicos de\nmaridaje de sabores</h3>\n<p>Combinar ingredientes de forma intencional —no solo porque \"funcionan\njuntos\" por tradición— sigue algunos principios reconocibles: el\ncontraste (ácido con graso, dulce con salado) equilibra una preparación\nque de otro modo resultaría plana o pesada; la afinidad aromática\n(ingredientes que comparten compuestos aromáticos similares, como el\ntomate y el albahaca) refuerza un perfil de sabor; y la intensidad\nrelativa (equilibrar un ingrediente muy potente con otros más neutros\nque no compitan) evita que un solo elemento domine por completo el\nplatillo.</p>\n<div class=\"recuerda\"><em>Sellar una\ncarne no solo cambia su color y textura: la reacción de Maillard también\ngenera compuestos que intensifican la percepción de umami, más allá de\nlo que aporta la proteína cruda.</em></div>\n<h3>Ejemplo\naplicado: análisis de cualidades gastronómicas de un platillo</h3>\n<p>Tomemos un platillo sencillo: pescado blanco a la plancha con salsa\nde mantequilla y limón. Analizado por cualidades gastronómicas: el\npescado aporta un sabor suave y umami discreto, con textura firme pero\ndelicada; la mantequilla aporta grasa y un dulzor tenue que suaviza el\nconjunto; el limón aporta acidez que corta la grasa de la mantequilla\n(contraste) y aromas cítricos que realzan el pescado sin taparlo\n(afinidad); el color blanco del pescado contra el amarillo pálido de la\nsalsa y, si se añade, un toque verde de perejil, genera un contraste\nvisual que anticipa frescura antes de la primera probada. Este tipo de\nanálisis —descomponer un platillo en sus cualidades gastronómicas— es\nexactamente el ejercicio que un cocinero hace, de forma más o menos\nconsciente, al diseñar cualquier preparación nueva.</p>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 2.4</strong></p>\n<ul>\n<li><p>Las cualidades gastronómicas (sabor, aroma, textura, color) son\nla razón última por la que se elige un ingrediente para una preparación\nespecífica.</p></li>\n<li><p>Existen cinco sabores básicos reconocidos: dulce, salado, ácido,\namargo y umami — este último identificado científicamente hasta\nprincipios del siglo XX.</p></li>\n<li><p>La textura y el color son cualidades gastronómicas tan relevantes\ncomo el sabor; un platillo monótono en textura se percibe como menos\nlogrado.</p></li>\n<li><p>El maridaje de sabores sigue principios reconocibles: contraste,\nafinidad aromática e intensidad relativa equilibrada.</p></li>\n</ul></div>\n\n"},
  "3.1": {"titulo": "Conocimientos generales para la elaboración de platillos", "html": "<h3>El\ndominio del fuego: la habilidad más antigua del oficio</h3>\n<p>Mucho antes de que existieran recetas escritas, hornos de gas o\ntermómetros digitales, el ser humano ya había aprendido la habilidad más\nfundamental de todas: controlar el fuego para transformar un alimento\ncrudo en uno comestible, más digerible y más seguro. Esa capacidad\n—cocinar con calor controlado— es, según buena parte de la evidencia\nantropológica, uno de los hitos que distingue el desarrollo humano de\notras especies, y todo lo que se estudia en este subtema es, en el\nfondo, una versión refinada y sistematizada de ese mismo dominio\nancestral del fuego.</p>\n<p>Lo que ha cambiado en miles de años no es el principio —el calor\ntransforma el alimento—, sino la precisión con la que hoy se puede\ncontrolar ese calor: la temperatura exacta, el tiempo exacto, el método\nexacto según el resultado que se busca. Esa precisión es la que\ndistingue a un cocinero formado de alguien que solo sabe \"poner algo al\nfuego\".</p>\n<h3>Tres familias de técnicas\nde cocción</h3>\n<p>Toda técnica de cocción, sin importar cuántos nombres distintos\nreciba en distintas tradiciones culinarias, pertenece a una de tres\ngrandes familias, según cómo se transmite el calor al alimento (Martínez\nde Flores Escobar y González-Garza, 2011):</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 71%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Familia</strong></td>\n<td style=\"text-align: left;\"><strong>Principio</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Por concentración</td>\n<td style=\"text-align: left;\">El calor sella rápidamente la superficie\ndel alimento, concentrando sus jugos y sabores en el interior. Suele\nusar temperaturas altas y tiempos cortos.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Por expansión</td>\n<td style=\"text-align: left;\">El alimento se sumerge o expone a un medio\n(agua, vapor) desde el inicio de la cocción, permitiendo que sus\ncomponentes se intercambien libremente con ese medio. El calor penetra\nde forma gradual.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Mixta</td>\n<td style=\"text-align: left;\">Combina ambas: primero se sella el\nalimento por concentración, y después se termina de cocinar por\nexpansión, generalmente en un líquido, durante un tiempo\nprolongado.</td>\n</tr>\n</tbody>\n</table>\n<h3>Técnicas por concentración</h3>\n<p>Estas técnicas buscan una reacción rápida en la superficie del\nalimento —casi siempre la reacción de Maillard estudiada en el Bloque 1—\nque forme una costra dorada y sabrosa mientras el interior conserva su\njugosidad:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Técnica</strong></td>\n<td style=\"text-align: left;\"><strong>Cómo funciona</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Sellado / salteado</td>\n<td style=\"text-align: left;\">Cocción rápida en sartén con poca grasa y\ncalor alto, moviendo el alimento con frecuencia. Ideal para piezas\npequeñas o cortes tiernos.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Asado / grillado</td>\n<td style=\"text-align: left;\">Calor directo (parrilla, comal, plancha)\nque marca la superficie con un patrón característico y aporta sabor\nahumado.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Horneado / rostizado</td>\n<td style=\"text-align: left;\">Calor seco envolvente dentro de un horno;\nadecuado para piezas más grandes que necesitan cocción uniforme por\ntodos lados.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Fritura</td>\n<td style=\"text-align: left;\">Inmersión total o parcial en aceite\ncaliente; la evaporación rápida del agua superficial del alimento\nproduce una textura crujiente característica.</td>\n</tr>\n</tbody>\n</table>\n<h3>Técnicas por expansión</h3>\n<p>A diferencia de las técnicas por concentración, aquí el objetivo no\nes sellar, sino permitir que el calor —y en algunos casos también los\nsabores del medio de cocción— penetren de forma uniforme y gradual:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Técnica</strong></td>\n<td style=\"text-align: left;\"><strong>Cómo funciona</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Hervido</td>\n<td style=\"text-align: left;\">Inmersión completa en líquido a 100°C (a\nnivel del mar); usado para pastas, granos y algunos vegetales\nrobustos.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Escalfado</td>\n<td style=\"text-align: left;\">Cocción en líquido a temperatura por\ndebajo del punto de hervor (≈70-85°C), más suave y adecuada para\nalimentos delicados como huevo o pescado.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Blanqueado</td>\n<td style=\"text-align: left;\">Cocción muy breve en agua hirviendo\nseguida de un choque en agua con hielo; fija el color y detiene la\ncocción de inmediato.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Al vapor</td>\n<td style=\"text-align: left;\">El alimento no toca el agua directamente;\nse cocina con el vapor que esta desprende, preservando mejor nutrientes\ny forma.</td>\n</tr>\n</tbody>\n</table>\n<div class=\"recuerda\"><em>Concentración sella y retiene; expansión permite el intercambio con\nel medio. Ninguna es \"mejor\" en abstracto — cada una sirve a un\nresultado distinto.</em></div>\n<h3>Técnicas mixtas: la\npaciencia como técnica</h3>\n<p>Las técnicas mixtas —estofado, guisado, braseado— son, en cierto\nsentido, las más generosas con el tiempo y las que mejor premian la\npaciencia. El procedimiento típico combina un sellado inicial por\nconcentración (que desarrolla sabor en la superficie mediante Maillard)\ncon una cocción posterior, larga y lenta, en un líquido, por expansión.\nEsa segunda etapa —horas, no minutos— es la que permite que el colágeno\nde los cortes más duros y económicos de carne se transforme gradualmente\nen gelatina, ablandando una pieza que, cocinada rápido, resultaría\ncorreosa e incomible.</p>\n<p>Hay algo profundamente humano en esta técnica: no se puede apurar. A\ndiferencia de un salteado que se resuelve en minutos, un buen estofado\nexige que el cocinero confíe en el proceso, revise de vez en cuando,\najuste el fuego, y espere. Es, quizás, la técnica que mejor enseña una\nlección que trasciende la cocina: que algunos resultados valiosos\nsimplemente no se pueden forzar, solo acompañar con atención durante el\ntiempo que necesitan.</p>\n<h3>Ejemplo\naplicado: elegir la técnica según el corte</h3>\n<p>Un corte de carne como el filete o el rib eye —tierno por naturaleza,\ncon poco tejido conectivo— se arruina si se cocina por horas: pierde\nhumedad, se seca y su textura se vuelve fibrosa sin necesidad. La\ntécnica correcta para ese corte es por concentración: sellado rápido a\nfuego alto, que aprovecha su ternura natural sin tiempo de más. En\ncambio, un corte como el chambarete o la falda —económico, con mucho\ntejido conectivo y colágeno— resultaría duro e incomible si se sellara y\nsirviera de inmediato; su técnica correcta es mixta: sellado inicial\npara desarrollar sabor, seguido de una cocción larga en líquido que\nconvierte ese colágeno duro en gelatina suave. Elegir la técnica según\nel corte —no al revés— es una de las decisiones más importantes que toma\nun cocinero antes incluso de encender el fuego.</p>\n<h3>Habilidades\nmotrices generales: manejo del cuchillo</h3>\n<p>Antes de aplicar cualquier técnica de cocción, casi toda preparación\nexige una habilidad previa: el manejo seguro y preciso del cuchillo.\nEsta destreza —como cualquier habilidad motriz fina— se desarrolla\nexclusivamente con práctica repetida y consciente, nunca solo con\nlectura. Sostener el cuchillo con el agarre correcto (empuñadura firme,\ndedo índice y pulgar sujetando la base de la hoja para mayor control), y\nproteger los dedos de la mano guía curvándolos hacia dentro (la llamada\n\"garra\"), son dos hábitos que deben automatizarse desde las primeras\nsemanas de práctica, porque de ellos depende tanto la seguridad como la\nprecisión de todo lo que viene después.</p>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 3.1</strong></p>\n<ul>\n<li><p>Toda técnica de cocción pertenece a una de tres familias:\nconcentración (sella y retiene), expansión (intercambio gradual con el\nmedio) o mixta (combina ambas).</p></li>\n<li><p>Las técnicas mixtas premian la paciencia: el tiempo prolongado es\nlo que convierte el colágeno de cortes duros en gelatina suave.</p></li>\n<li><p>La técnica correcta depende del corte o ingrediente, no al revés\n— cortes tiernos piden concentración rápida; cortes duros piden cocción\nmixta lenta.</p></li>\n<li><p>El manejo seguro del cuchillo (agarre firme, mano guía en garra)\nes una habilidad motriz que se automatiza solo con práctica\nrepetida.</p></li>\n</ul></div>\n\n"},
  "3.2.1": {"titulo": "Carnes, aves, pescados y mariscos", "html": "<h3>3.2.1 Carnes, aves, pescados y\nmariscos</h3>\n<h3>Manos que aprenden a\nconocer el músculo</h3>\n<p>Trabajar con carnes, aves y pescados exige una familiaridad física\ncon el producto que ningún diagrama enseña por completo: hay que sentir,\ncon las manos, dónde está la fibra, dónde está la grasa, dónde el hueso\nse separa naturalmente de la carne. Esa familiaridad se construye pieza\npor pieza, y con ella viene también una responsabilidad: aprovechar al\nmáximo lo que un animal dio, sin desperdicio innecesario, es una forma\nconcreta de respeto hacia ese origen animal y hacia el costo —económico\ny de otro tipo— que representa.</p>\n<h3>Deshuesado y porcionado</h3>\n<p>El deshuesado —separar la carne del hueso siguiendo su estructura\nnatural— y el porcionado —dividir una pieza en porciones de tamaño\nconsistente— son dos habilidades que dependen enteramente de conocer la\nanatomía del corte que se está trabajando (Martínez de Flores Escobar y\nGonzález-Garza, 2011). Un deshuesado hecho a favor de la estructura\nnatural del músculo aprovecha más carne y deja menos desperdicio que uno\nhecho a la fuerza, cortando contra esa estructura.</p>\n<p>El porcionado consistente, por su parte, no es solo una cuestión\nestética: piezas de tamaño irregular se cuecen a ritmos distintos dentro\nde la misma tanda, lo que produce resultados inconsistentes —algunas\nporciones listas, otras crudas o sobrecocidas— aunque todas hayan estado\nel mismo tiempo al fuego.</p>\n<h3>El\ncorte contra la fibra: la clave de la terneza al servir</h3>\n<p>Una de las habilidades con mayor impacto en la percepción de terneza\nde una carne no ocurre durante la cocción, sino después, al momento de\nrebanarla para servir: cortar en contra de la dirección de la fibra\nmuscular (perpendicular a las líneas visibles del músculo) acorta esas\nfibras en cada rebanada, haciendo la carne considerablemente más fácil\nde masticar. Cortar a favor de la fibra —en la misma dirección— deja\nfibras largas e intactas que, sin importar qué tan bien cocida esté la\npieza, se perciben correosas.</p>\n<div class=\"recuerda\"><em>Cortar contra la fibra puede hacer\nque la misma pieza de carne, cocinada exactamente igual, se perciba\nnotablemente más suave al morderla.</em></div>\n<h3>De\ndónde viene realmente un corte: nociones de faenamiento</h3>\n<p>Un cocinero que solo conoce el nombre comercial de un corte —sin\nentender de dónde proviene ni cómo se clasificó— pierde información\nvaliosa para decidir su mejor uso. El proceso completo, desde el animal\nvivo hasta la pieza que llega a la cocina, sigue etapas estandarizadas:\ntransporte y reposo del animal (para reducir el estrés, que afecta\ndirectamente la calidad final de la carne), insensibilización, sangrado,\nseparación de patas y cabeza, desollado, evisceración, y finalmente la\ninspección y clasificación de la canal antes de pasar a la sala de\ndesposte, donde recién ahí se obtienen los cortes que un cocinero\nreconoce.</p>\n<p>La canal —el cuerpo del animal ya sin cabeza, vísceras, piel ni\npatas— se clasifica según edad y sexo del animal (categorías como\nnovillo, vaquilla, vaca), y se tipifica según la cantidad de grasa de\ncobertura que la recubre externamente, en una escala que va de \"escasa\"\na \"excesiva\". Estas dos variables —clase y grado de grasa— influyen\ndirectamente en la calidad, terneza y precio final de cualquier corte\nque salga de esa canal, incluso antes de que el desposte defina en qué\ncorte específico terminará convertida cada sección.</p>\n<p>Después de clasificada, la canal pasa por un proceso de maduración en\ncámara fría —normalmente entre 24 y 48 horas a temperatura controlada—\nantes de trasladarse a desposte. Esta maduración inicial es distinta de\nla maduración prolongada (dry aging) que algunos establecimientos\naplican después, por semanas, para intensificar sabor y terneza; ambas\ncomparten el mismo principio de fondo: el tiempo, bajo condiciones de\ntemperatura controlada, transforma la estructura de la carne de forma\nfavorable.</p>\n<div class=\"recuerda\"><em>La clase y\nel grado de grasa de una canal se definen antes de que exista un solo\ncorte reconocible — dos filetes con el mismo nombre pueden tener calidad\nmuy distinta según de qué canal provinieron.</em></div>\n<h3>Tres\ncriterios para determinar el punto de cocción</h3>\n<p>Antes de ver la escala de puntos, vale la pena señalar que un\ncocinero experimentado nunca depende de un solo indicador para\ndeterminar si una pieza está en su punto: cruza siempre tres criterios\ndistintos —color interno y externo de la pieza, consistencia reconocible\nal tacto y a la presión del dedo, y temperatura al núcleo verificada con\ntermómetro— porque cada uno, por separado, puede engañar (una pieza fría\npor fuera puede verse más cocida de lo que está por dentro; el color\nvaría según el tipo de luz).</p>\n<h3>Puntos de cocción en carnes\nrojas</h3>\n<p>Más allá de la temperatura mínima segura estudiada en el Bloque 1, la\ncocina profesional reconoce una escala de \"puntos\" de cocción en carnes\nrojas, que describen el color y la textura interna deseados según la\npreferencia del comensal. Existen dos nomenclaturas que conviene\nconocer, porque ambas circulan en distintos textos y regiones:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 21%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Punto (nomenclatura\nclásica)</strong></td>\n<td style=\"text-align: left;\"><strong>Temp. núcleo</strong></td>\n<td style=\"text-align: left;\"><strong>Consistencia al\ntacto</strong></td>\n<td><strong>Color interior</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">A la inglesa</td>\n<td style=\"text-align: left;\">40-50°C</td>\n<td style=\"text-align: left;\">Blanda y flácida.</td>\n<td>Roja intensa.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Sangrante</td>\n<td style=\"text-align: left;\">50-55°C</td>\n<td style=\"text-align: left;\">Un poco más firme, ligeramente resistente\nen superficie.</td>\n<td>Rojo-rosado.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">A punto</td>\n<td style=\"text-align: left;\">60-65°C</td>\n<td style=\"text-align: left;\">Resistente en superficie, blanda al\ncentro.</td>\n<td>Rosa; pueden perlar gotas de jugo rojo en superficie.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Bien cocida</td>\n<td style=\"text-align: left;\">70-80°C</td>\n<td style=\"text-align: left;\">Firme.</td>\n<td>Blanca-gris.</td>\n</tr>\n</tbody>\n</table>\n<p>La siguiente tabla muestra la nomenclatura anglosajona equivalente,\nmás fina en sus gradaciones y frecuente en textos y cocinas de\ninfluencia estadounidense:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 27%\"/>\n<col style=\"width: 20%\"/>\n<col style=\"width: 50%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Punto</strong></td>\n<td style=\"text-align: left;\"><strong>Temp. interna aprox.</strong></td>\n<td style=\"text-align: left;\"><strong>Aspecto interno</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Azul (bleu)</td>\n<td style=\"text-align: left;\">46-49°C</td>\n<td style=\"text-align: left;\">Sellado exterior únicamente; interior frío\ny rojo intenso.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Rojo inglés (rare)</td>\n<td style=\"text-align: left;\">52-55°C</td>\n<td style=\"text-align: left;\">Centro rojo brillante, tibio.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Término medio (medium rare)</td>\n<td style=\"text-align: left;\">57-60°C</td>\n<td style=\"text-align: left;\">Centro rosado, jugoso.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Tres cuartos (medium well)</td>\n<td style=\"text-align: left;\">65-68°C</td>\n<td style=\"text-align: left;\">Ligero tono rosado apenas visible.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Bien cocido (well done)</td>\n<td style=\"text-align: left;\">71°C+</td>\n<td style=\"text-align: left;\">Sin rosado; textura más firme.</td>\n</tr>\n</tbody>\n</table>\n<p>Estos puntos son distintos, y en algunos casos inferiores, a la\ntemperatura mínima segura de 63°C con reposo estudiada en el Bloque 1\npara cortes enteros de res — la diferencia se explica porque cortes\nenteros de músculo (a diferencia de la carne molida) tienen bajo riesgo\nde contaminación interna, concentrada casi siempre en la superficie, que\nel sellado ya elimina.</p>\n<h3>Manejo\nde mariscos: destrezas propias de esta categoría</h3>\n<p>Los mariscos —crustáceos y moluscos, estudiados en su clasificación\nen el Bloque 2— exigen destrezas manuales que no se parecen a las del\ndeshuesado de carnes o aves, precisamente porque su anatomía es\ncompletamente distinta. Tres habilidades básicas cubren la mayoría de\nlos casos que un cocinero enfrenta con regularidad:</p>\n<ul>\n<li><p>Desvenado de camarón: retirar con la punta de un cuchillo o un\npalillo el conducto digestivo oscuro que corre a lo largo del dorso,\nvisible a través del caparazón; se hace después de pelar, con un corte\nsuperficial poco profundo para no partir la carne en dos.</p></li>\n<li><p>Apertura de bivalvos (ostión, almeja): se inserta un cuchillo de\nostionero por la unión de las valvas, se hace palanca firme y controlada\npara separar la concha superior, y se corta el músculo aductor que\nmantiene unida la carne a la concha inferior — siempre protegiendo la\nmano que sostiene el molusco con un guante o un paño grueso.</p></li>\n<li><p>Limpieza de calamar: se separan los tentáculos del cuerpo tirando\ncon firmeza pero sin violencia, se retira la pluma (cartílago\ntransparente interno) y las vísceras del interior del cuerpo, y se\ndespelleja la membrana exterior si se busca una textura más tersa al\ncocinar.</p></li>\n</ul>\n<p>En los tres casos, la regla general es la misma que rige el resto de\neste bloque: la primera vez será torpe y lenta, y eso es completamente\nnormal — la velocidad y la limpieza del movimiento llegan después de\nvarias repeticiones, no antes.</p>\n<h3>Ejemplo\naplicado: deshuesado de un muslo de pollo</h3>\n<ol type=\"1\">\n<li><p>Colocar el muslo con la piel hacia abajo sobre la tabla,\nlocalizando el hueso central por tacto.</p></li>\n<li><p>Con la punta del cuchillo, cortar a lo largo de ambos lados del\nhueso, siguiendo su forma natural, sin alejarse de él para no\ndesperdiciar carne.</p></li>\n<li><p>Levantar el hueso desde un extremo y raspar suavemente con el\ncuchillo para separarlo de la carne que lo rodea, sin cortar la piel del\nlado opuesto.</p></li>\n<li><p>Retirar el hueso limpio; recortar cartílagos o exceso de grasa\nvisibles.</p></li>\n</ol>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 3.2</strong></p>\n<ul>\n<li><p>El deshuesado a favor de la estructura natural del músculo\naprovecha más carne que uno hecho a la fuerza.</p></li>\n<li><p>El porcionado consistente evita que unas piezas queden crudas y\notras sobrecocidas dentro de la misma tanda.</p></li>\n<li><p>Cortar contra la fibra muscular hace que una carne se perciba más\ntierna al morderla, sin cambiar nada de la cocción.</p></li>\n<li><p>Los puntos de cocción de carnes rojas (azul, rojo inglés, término\nmedio, tres cuartos, bien cocido) son una escala de preferencia distinta\nde la temperatura mínima segura.</p></li>\n</ul></div>\n\n"},
  "3.2.2": {"titulo": "Vegetales y frutos", "html": "<h3>3.2.2 Vegetales y frutos</h3>\n<h3>El\nritmo del cuchillo: precisión que se vuelve casi meditativa</h3>\n<p>Pocas habilidades culinarias son tan visibles, y tan reveladoras del\nnivel de un cocinero, como el corte de vegetales. Un cocinero\nexperimentado corta con un ritmo constante, casi hipnótico, sin mirar\nobsesivamente cada rebanada, porque su mano ya conoce la distancia\nexacta que debe recorrer cada vez. Llegar a ese punto no es un don\nnatural: es el resultado de cientos de repeticiones conscientes,\nempezando lento y priorizando siempre la consistencia del tamaño sobre\nla velocidad. La velocidad llega sola, después, como consecuencia de la\nrepetición — nunca al revés.</p>\n<h3>Dos técnicas de agarre del\ncuchillo</h3>\n<p>Antes de hablar de nombres de cortes, conviene distinguir las dos\nformas básicas en que un cocinero mueve el cuchillo, porque de ellas\ndepende el control y la seguridad de cualquier corte posterior:</p>\n<ul>\n<li><p>Pivote: la punta del cuchillo permanece apoyada en la tabla sin\ndespegarse, y la hoja se balancea desde ahí como si fuera una palanca.\nDa mayor control y precisión — es la técnica base para la mayoría de los\ncortes finos.</p></li>\n<li><p>Caída libre: el cuchillo se levanta a poca altura sobre la tabla\ny se deja caer aprovechando su propio peso sobre el alimento, repitiendo\nel movimiento de forma rítmica. Se usa con cuchillos de medio golpe o\nmachete, y es más veloz una vez dominada, aunque exige más práctica para\nmantenerla segura.</p></li>\n</ul>\n<p>Ambas técnicas se aplican tanto a vegetales como a carnes y frutas;\ndominar las dos —y saber cuándo usar cada una— es parte del\nentrenamiento básico de cualquier cocinero antes incluso de aprender los\nnombres de los cortes.</p>\n<h3>Los\ncortes clásicos: un vocabulario compartido, catálogo completo</h3>\n<p>La cocina profesional —heredera, una vez más, de la sistematización\nfrancesa del siglo XIX— reconoce un conjunto amplio de cortes\nestandarizados con nombre propio, que permiten a cualquier cocinero\nentender exactamente qué tamaño y forma se espera sin necesidad de más\nexplicación. Un cocinero verdaderamente formado no se queda solo con los\ntres o cuatro cortes más conocidos: domina el catálogo completo, porque\ncada corte resuelve un problema distinto de textura, cocción o\npresentación.</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 17%\"/>\n<col style=\"width: 79%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Corte</strong></td>\n<td style=\"text-align: left;\"><strong>Descripción</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Château</td>\n<td style=\"text-align: left;\">Torneado con forma de barril, de un tamaño\nmayor (aprox. 60 g por pieza); se usa como guarnición de presentación en\nplatos de corte clásico.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Olivette</td>\n<td style=\"text-align: left;\">Torneado pequeño, con la forma y el tamaño\naproximado de una aceituna grande.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Brunoise</td>\n<td style=\"text-align: left;\">Cubos muy pequeños, de 3 a 5 mm por lado.\nAplicable a verduras y a algunas frutas firmes; guarniciones delicadas,\nrellenos, mirepoix fino.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Parmentier</td>\n<td style=\"text-align: left;\">Cubos de aproximadamente 1 cm por lado; el\nnombre proviene del mismo usado para las preparaciones de papa.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Paisano (paisana)</td>\n<td style=\"text-align: left;\">Corte rectangular de aproximadamente 1 cm\nde largo por 0.5 cm de grosor; característico de sopas y guisos\nrústicos.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Mirepoix</td>\n<td style=\"text-align: left;\">Corte grueso e irregular, usado para\nverduras que se cocinan por tiempos largos solo para aportar sabor\n(fondos, caldos) y que después se retiran o se cuelan.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Macedonia</td>\n<td style=\"text-align: left;\">Corte en cubos, más pequeño que el\nmirepoix; se usa en salsas, guarniciones y también en frutas.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Cascos (cuartos)</td>\n<td style=\"text-align: left;\">División de un vegetal u fruto\nsemiesférico o esférico en secciones, generalmente en cuatro\npartes.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Concassé</td>\n<td style=\"text-align: left;\">Corte irregular aplicado casi\nexclusivamente al jitomate pelado y sin semilla, picado en trozos\npequeños.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Rondelle</td>\n<td style=\"text-align: left;\">Corte exclusivo de vegetales alargados\n(zanahoria, pepino): tajadas de 3 a 5 mm de grosor en forma de\ndisco.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Bastón</td>\n<td style=\"text-align: left;\">Corte rectangular de unos 6-7 cm de largo\npor 1 cm de ancho; usado sobre todo como guarnición de\nacompañamiento.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Émincé</td>\n<td style=\"text-align: left;\">Tiras gruesas, de unos 4 cm de largo por 1\ncm de grosor — más gruesas que la juliana.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Juliana</td>\n<td style=\"text-align: left;\">Tiras finas, de aproximadamente 4 cm de\nlargo por 0.5 cm de grosor; salteados, guarniciones, ensaladas.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Chiffonade</td>\n<td style=\"text-align: left;\">Corte alargado, de unos 4 cm de largo, más\ndelgado que la juliana; se usa en hojas (lechuga, col, albahaca)\nenrolladas antes de cortarse.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Pluma</td>\n<td style=\"text-align: left;\">Corte exclusivo para la cebolla, similar\nen forma a la juliana o al chiffonade, siguiendo el sentido natural de\nsus capas.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Noisette</td>\n<td style=\"text-align: left;\">Bolitas pequeñas, del tamaño de una\navellana, obtenidas con sacabocados (cuchara boleadora).</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Parisien</td>\n<td style=\"text-align: left;\">Bolitas obtenidas con sacabocados, de\ntamaño un poco mayor que el noisette.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Chips</td>\n<td style=\"text-align: left;\">Tajadas más delgadas que el rondelle,\ngeneralmente obtenidas con mandolina, pensadas para freír.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Fósforo</td>\n<td style=\"text-align: left;\">Tiras finas y muy largas, similares a la\njuliana pero de mayor longitud, semejando un fósforo de chimenea.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Gaufrette (rejilla)</td>\n<td style=\"text-align: left;\">Corte en forma de rejilla o celosía, que\nsolo se puede obtener con mandolina especial.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Paja o hilo</td>\n<td style=\"text-align: left;\">Tiras muy delgadas, de dimensiones\nsimilares al chiffonade y al fósforo; se aplica sobre todo a la papa\npara servirla en forma de nido o frita.</td>\n</tr>\n</tbody>\n</table>\n<p>Detrás de esta estandarización hay una razón práctica, no solo\nestética: piezas de tamaño uniforme se cuecen al mismo ritmo,\ngarantizando que todo el vegetal esté listo al mismo tiempo, sin trozos\ncrudos junto a otros sobrecocidos.</p>\n<div class=\"recuerda\"><em>El nombre del corte no es un\ncapricho de vocabulario: comunica de forma precisa el tamaño esperado,\npermitiendo que cualquier cocinero replique el resultado sin necesidad\nde medir con regla.</em></div>\n<h3>Cortes\nde papa: un catálogo propio dentro de la cocina clásica</h3>\n<p>La papa merece un catálogo de cortes aparte, porque pocos\ningredientes se prestan a tantas formas de presentación distintas dentro\nde la cocina clásica — cada una asociada históricamente a una\npreparación o a un método de cocción específico:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 20%\"/>\n<col style=\"width: 77%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Corte</strong></td>\n<td style=\"text-align: left;\"><strong>Descripción</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Parmentier</td>\n<td style=\"text-align: left;\">Cubos de aproximadamente 1 cm, para\nsaltear, guisar o asar.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Pont-neuf</td>\n<td style=\"text-align: left;\">Bastones gruesos, el corte clásico de la\npapa a la francesa (fritas gruesas).</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Paja / hilo</td>\n<td style=\"text-align: left;\">Tiras muy delgadas, para freír en forma de\nnido o suelta.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Fósforo</td>\n<td style=\"text-align: left;\">Tiras finas y largas, entre la paja y el\nbastón en grosor.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Mignonnette</td>\n<td style=\"text-align: left;\">Bastones delgados, más finos que el\npont-neuf, para fritura.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Chips</td>\n<td style=\"text-align: left;\">Rodajas muy finas, obtenidas con\nmandolina, para freír crujientes.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Gaufrette (rejilla)</td>\n<td style=\"text-align: left;\">Corte en celosía con mandolina especial,\npara freír con textura decorativa.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Château</td>\n<td style=\"text-align: left;\">Torneado grande en forma de barril, para\nguarnición de piezas de carne asadas.</td>\n</tr>\n<tr class=\"even\">\n<t
