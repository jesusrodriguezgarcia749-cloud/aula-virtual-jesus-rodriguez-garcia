d style=\"text-align: left;\">Diente (de ajo)</td>\n<td style=\"text-align: left;\">Torneado pequeño en forma de diente de ajo\nalargado.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Aceituna</td>\n<td style=\"text-align: left;\">Torneado pequeño con forma de aceituna,\nsimilar al olivette de otros vegetales.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Noisette / Parisienne</td>\n<td style=\"text-align: left;\">Bolitas obtenidas con sacabocados, en dos\ntamaños (noisette más pequeño, parisienne más grande), doradas en\nmantequilla.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Natural</td>\n<td style=\"text-align: left;\">Papa entera o en mitades, sin torneado,\ncocida simplemente al natural.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Fondant</td>\n<td style=\"text-align: left;\">Torneada en cilindro, cocida en horno con\ncaldo y mantequilla hasta quedar suave por dentro y dorada por\nfuera.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Risolée</td>\n<td style=\"text-align: left;\">Papas pequeñas enteras (o torneadas),\nsalteadas en mantequilla hasta dorar.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Maxime</td>\n<td style=\"text-align: left;\">Rodajas finas dispuestas en capas\nsuperpuestas y horneadas hasta dorar, formando una costra\ncrujiente.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Croqueta</td>\n<td style=\"text-align: left;\">Puré de papa moldeado en cilindro,\nempanizado y frito.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Duquesa</td>\n<td style=\"text-align: left;\">Puré de papa con yema, formado con manga y\nhorneado hasta dorar la superficie.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Dauphine</td>\n<td style=\"text-align: left;\">Combinación de puré duquesa con masa\nchoux, formada y frita.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Berny</td>\n<td style=\"text-align: left;\">Variante de la papa dauphine, cubierta de\nalmendra fileteada antes de freír.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Lorette</td>\n<td style=\"text-align: left;\">Variante de la papa dauphine con forma\nalargada, tipo cruasán pequeño.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">San Florentin</td>\n<td style=\"text-align: left;\">Croqueta de papa empanizada con fideo\ncabello de ángel quebrado en vez de pan molido, para una textura\nexterior distinta.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Galette</td>\n<td style=\"text-align: left;\">Papa rallada o en láminas finas, formada\nen disco y dorada en sartén hasta quedar crujiente por fuera.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Savoyarde</td>\n<td style=\"text-align: left;\">Rodajas finas horneadas en capas con\ncaldo, crema y queso gratinado — un gratín de papa clásico.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Soufflée</td>\n<td style=\"text-align: left;\">Rodajas muy finas fritas dos veces a\ntemperaturas distintas, lo que hace que se inflen como un pequeño cojín\nhueco.</td>\n</tr>\n</tbody>\n</table>\n<p>Este catálogo de cortes de papa —igual que el catálogo general de\ncortes de vegetales— no es un simple ejercicio de memorización de\nnombres franceses: cada corte está pensado para una técnica de cocción y\nun resultado final específicos, y reconocerlos permite a un cocinero\nleer una ficha técnica o un menú clásico y entender de inmediato qué se\nespera, sin ambigüedad.</p>\n<div class=\"recuerda\"><em>Muchos de\nlos cortes de papa más elaborados (dauphine, berny, lorette) son\nvariaciones de una misma base (papa duquesa + masa choux) con un acabado\ndistinto — aprender la base es más eficiente que memorizar cada variante\npor separado.</em></div>\n<h3>Oxidación y cómo prevenirla</h3>\n<p>Muchas frutas y algunos vegetales (manzana, aguacate, papa, plátano)\ncontienen enzimas que, al exponerse al oxígeno del aire tras cortarse,\ngeneran una reacción de oscurecimiento (pardeamiento enzimático) que\nafecta la presentación, aunque no representa un riesgo de seguridad.\nPrevenir esta oxidación es una habilidad práctica sencilla pero\nconstante: sumergir el corte en agua con un poco de jugo de limón o\nvinagre (el ácido retarda la reacción), cubrir directamente con plástico\nen contacto con la superficie cortada, o simplemente cortar lo más cerca\nposible del momento de servir.</p>\n<h3>Blanqueado: fijar el\ncolor antes de servir</h3>\n<p>Para vegetales que se sirven fríos o que necesitan mantener un color\nvibrante en un plato terminado (ejotes, brócoli, espárragos), el\nblanqueado —estudiado como técnica de cocción en el subtema 3.1— cumple\nuna función adicional aquí: el choque térmico en agua con hielo,\ninmediatamente después de la cocción breve en agua hirviendo, detiene\nlas reacciones que oscurecen la clorofila, fijando un color verde\nintenso que de otro modo se perdería con el calor residual.</p>\n<h3>Ejemplo aplicado:\ncorte en juliana paso a paso</h3>\n<ol type=\"1\">\n<li><p>Cortar el vegetal (por ejemplo, zanahoria) en trozos de\naproximadamente 5 cm de largo.</p></li>\n<li><p>Cortar cada trozo en láminas delgadas y uniformes de unos 2 mm de\ngrosor.</p></li>\n<li><p>Apilar varias láminas y cortarlas longitudinalmente en tiras de 2\nmm de ancho, manteniendo la mano guía en garra durante todo el\nproceso.</p></li>\n<li><p>Verificar que las tiras resultantes sean uniformes entre sí;\nseparar y corregir cualquier pieza notablemente distinta antes de\ncontinuar.</p></li>\n</ol>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 3.3</strong></p>\n<ul>\n<li><p>Los cortes clásicos (brunoise, juliana, chiffonade, paisana,\nmacedonia, mirepoix) son un vocabulario compartido que comunica tamaño\nexacto sin necesidad de medir.</p></li>\n<li><p>Un tamaño de corte uniforme garantiza cocción pareja; piezas\nirregulares producen resultados inconsistentes.</p></li>\n<li><p>La oxidación enzimática de frutas y vegetales se previene con\nácido (limón, vinagre), contacto directo con plástico, o cortando cerca\ndel momento de servir.</p></li>\n<li><p>El blanqueado fija el color de los vegetales verdes al detener\ncon frío las reacciones que el calor dispara.</p></li>\n</ul></div>\n\n"},
  "3.2.3": {"titulo": "Semillas y cereales", "html": "<h3>3.2.3 Semillas y cereales</h3>\n<h3>El alimento que ha\nsostenido a la humanidad</h3>\n<p>Pocas categorías de materia prima conectan tan directamente con la\nhistoria humana como los cereales y las semillas. El arroz alimenta hoy\na más de la mitad de la población mundial como parte de su dieta diaria;\nel trigo y el maíz sostuvieron —y siguen sosteniendo— civilizaciones\nenteras. Cocinar bien un grano no es, entonces, una habilidad menor: es\nuna destreza que conecta a quien la practica con una de las tradiciones\nmás antiguas y universales de la humanidad, presente en prácticamente\ncualquier cultura culinaria del planeta, aunque cada una la exprese de\nforma distinta.</p>\n<h3>Proporciones\nde cocción: la relación grano-líquido</h3>\n<p>A diferencia de una proteína, cuyo punto de cocción se verifica con\ntermómetro, un grano se cocina correctamente cuando absorbe la cantidad\nexacta de líquido necesaria para hidratarse por completo sin quedar\naguado ni quedarse duro. Esa relación —grano a líquido— varía según el\ntipo de grano, y conocerla de memoria es una de las habilidades\nprácticas más útiles para cualquier cocinero:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 28%\"/>\n<col style=\"width: 23%\"/>\n<col style=\"width: 45%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Grano</strong></td>\n<td style=\"text-align: left;\"><strong>Relación\ngrano:líquido</strong></td>\n<td style=\"text-align: left;\"><strong>Tiempo aproximado de\ncocción</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Arroz blanco</td>\n<td style=\"text-align: left;\">1 : 2</td>\n<td style=\"text-align: left;\">15-18 minutos, tapado, a fuego bajo.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Arroz integral</td>\n<td style=\"text-align: left;\">1 : 2.5</td>\n<td style=\"text-align: left;\">35-40 minutos; el salvado hace más lenta\nla absorción.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Quinoa</td>\n<td style=\"text-align: left;\">1 : 2</td>\n<td style=\"text-align: left;\">15 minutos; lista cuando el grano muestra\nsu \"anillo\" característico.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Avena (hojuelas)</td>\n<td style=\"text-align: left;\">1 : 2</td>\n<td style=\"text-align: left;\">5-8 minutos a fuego bajo, moviendo con\nfrecuencia.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Cuscús</td>\n<td style=\"text-align: left;\">1 : 1</td>\n<td style=\"text-align: left;\">5 minutos en reposo con líquido hirviendo,\nsin fuego directo.</td>\n</tr>\n</tbody>\n</table>\n<div class=\"recuerda\"><em>La\nproporción grano:líquido no es una sugerencia aproximada: es lo que\ndetermina directamente si el grano queda seco y duro, o suelto y en su\npunto.</em></div>\n<h3>Remojo de\nleguminosas: paciencia antes del fuego</h3>\n<p>Las leguminosas secas (frijol, lenteja, garbanzo) suelen requerir un\nremojo previo en agua —de varias horas hasta toda la noche, según la\nleguminosa— antes de cocinarse. Este remojo hidrata parcialmente la\nsemilla, reduce notablemente su tiempo de cocción posterior, y ayuda a\ndisolver algunos de los compuestos responsables de la flatulencia\nasociada al consumo de leguminosas. Las lentejas son una excepción\npráctica frecuente: por su tamaño pequeño y cáscara delgada, muchas\nvariedades pueden cocinarse sin remojo previo, aunque el remojo sigue\nreduciendo su tiempo de cocción si se dispone de tiempo.</p>\n<h3>Verificar el punto de\ncocción de un grano</h3>\n<p>A diferencia de una proteína, un grano no se verifica con termómetro\nsino con los sentidos: se prueba directamente mordiendo un grano —debe\nestar suave por completo, sin un núcleo duro y crudo en el centro—, y se\nobserva si ha absorbido todo el líquido visible en la olla. Un grano que\naún flota en líquido libre necesita más tiempo; uno que se pega al fondo\ny comienza a dorarse ya pasó su punto óptimo.</p>\n<h3>Ejemplo\naplicado: cocción de arroz blanco suelto</h3>\n<ol type=\"1\">\n<li><p>Enjuagar el arroz en agua fría hasta que el agua salga clara,\neliminando exceso de almidón superficial que lo haría pegajoso.</p></li>\n<li><p>Sofreír brevemente el arroz en un poco de aceite (nacarizar)\nantes de añadir el líquido, si se busca un grano más suelto y\nseparado.</p></li>\n<li><p>Añadir el líquido en proporción 1:2, llevar a hervor, tapar y\nbajar de inmediato a fuego mínimo.</p></li>\n<li><p>No destapar ni remover durante la cocción — cada vez que se\ndestapa se escapa vapor necesario para la cocción uniforme.</p></li>\n<li><p>Retirar del fuego al absorber todo el líquido, dejar reposar\ntapado 5 minutos, y esponjar con un tenedor antes de servir.</p></li>\n</ol>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 3.4</strong></p>\n<ul>\n<li><p>Cada tipo de grano tiene su propia relación grano:líquido; usar\nla proporción incorrecta produce un grano duro o aguado.</p></li>\n<li><p>El remojo previo de leguminosas reduce su tiempo de cocción y\nfacilita su digestión.</p></li>\n<li><p>El punto de cocción de un grano se verifica mordiendo, no con\ntermómetro: debe estar suave por completo, sin núcleo duro.</p></li>\n<li><p>No destapar la olla durante la cocción de arroz evita la pérdida\nde vapor necesaria para una cocción uniforme.</p></li>\n</ul></div>\n\n"},
  "3.2.4": {"titulo": "Hierbas y especias", "html": "<h3>3.2.4 Hierbas y especias</h3>\n<h3>El aroma que se vuelve\nmemoria</h3>\n<p>De todas las categorías de materia prima estudiadas en este curso,\nlas hierbas y especias son, quizás, las que tienen un vínculo más\ndirecto con la memoria y la identidad. El olfato está conectado, de\nforma muy directa dentro del cerebro humano, con los centros de la\nmemoria y la emoción — razón por la cual el aroma de una especia\nparticular puede transportar a alguien, de forma casi instantánea, a la\ncocina de su infancia o a un lugar que asocia con una persona querida.\nDominar el manejo de hierbas y especias es, entonces, también aprender a\nconstruir esos recuerdos para quien va a comer lo que se cocina.</p>\n<h3>Hierbas\nfrescas y hierbas secas: no son intercambiables sin ajuste</h3>\n<p>Una hierba fresca y su versión seca no son el mismo ingrediente con\ndistinta presentación: el proceso de secado concentra los compuestos\naromáticos (por la pérdida de agua), pero también altera su perfil de\nsabor, generalmente perdiendo las notas más volátiles y delicadas y\nconservando las más robustas. Por esta razón, sustituir hierba fresca\npor seca —o viceversa— exige un ajuste de cantidad, no una sustitución\nuno a uno:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\"/>\n<col style=\"width: 48%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Si la receta pide</strong></td>\n<td style=\"text-align: left;\"><strong>Equivalencia\naproximada</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">1 cucharada de hierba fresca picada</td>\n<td style=\"text-align: left;\">≈ 1 cucharadita de hierba seca</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1 cucharadita de hierba seca</td>\n<td style=\"text-align: left;\">≈ 1 cucharada de hierba fresca picada</td>\n</tr>\n</tbody>\n</table>\n<p>La regla general —tres a uno en volumen, fresca respecto a seca— es\nun punto de partida útil, aunque conviene siempre probar y ajustar, ya\nque la intensidad varía según qué tan reciente sea la hierba seca\n(pierde potencia con el tiempo de almacenamiento).</p>\n<h3>Cuándo\nañadir: el momento importa tanto como la cantidad</h3>\n<p>Una de las habilidades menos evidentes, pero más determinantes, en el\nmanejo de hierbas y especias es saber en qué momento de la cocción\nincorporarlas. Como regla general orientativa:</p>\n<ul>\n<li><p>Especias secas enteras o molidas y hierbas secas robustas\n(romero, tomillo, laurel) se agregan al inicio de la cocción, porque su\nliberación de aroma es lenta y se benefician del tiempo prolongado de\ncontacto con el calor.</p></li>\n<li><p>Hierbas frescas delicadas (albahaca, cilantro, perejil) se\nagregan casi al final, o incluso después de retirar del fuego, porque el\ncalor prolongado destruye rápidamente sus aceites esenciales más\nvolátiles y su color.</p></li>\n<li><p>Especias enteras que se van a moler (comino, cilantro en semilla,\npimienta) suelen tostarse en seco brevemente antes de molerse, lo que\nlibera y realza sus aceites aromáticos mediante calor — un principio\nemparentado con la reacción de Maillard estudiada en el Bloque\n1.</p></li>\n</ul>\n<div class=\"recuerda\"><em>Añadir una\nhierba fresca delicada al inicio de una cocción larga es, en la\npráctica, desperdiciarla: su aroma se habrá evaporado mucho antes de que\nel platillo esté listo.</em></div>\n<h3>El tostado de\nespecias: liberar el aroma dormido</h3>\n<p>Muchas especias enteras —comino, cilantro, pimienta, canela en raja—\ncontienen sus compuestos aromáticos encapsulados dentro de la semilla o\ncorteza, relativamente inactivos hasta que el calor los libera. Tostar\nbrevemente estas especias en una sartén seca, sin aceite, a fuego medio,\nmoviendo constantemente durante uno o dos minutos hasta que se perciba\nsu aroma con claridad, es una técnica sencilla que intensifica\nnotablemente el sabor final de cualquier preparación que las use — mucho\nmás que agregar la misma especia directamente sin tostar.</p>\n<h3>Ejemplo\naplicado: construir una mezcla de especias propia</h3>\n<p>Para armar una mezcla de especias con carácter propio —en vez de\ndepender siempre de mezclas comerciales prefabricadas—, un cocinero\npuede seguir esta secuencia: elegir una especia dominante (por ejemplo,\ncomino) que defina el carácter principal; sumar una o dos especias de\napoyo (por ejemplo, pimienta y cilantro molido) que complementen sin\ncompetir; añadir una nota de calor si se desea (chile en polvo o\npimienta cayena en cantidad pequeña); y ajustar con sal al final,\nprobando siempre antes de dar la mezcla por terminada. Tostar las\nespecias enteras antes de molerlas, como se explicó arriba, potencia\nconsiderablemente el resultado final de cualquier mezcla propia.</p>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 3.5</strong></p>\n<ul>\n<li><p>Hierba fresca y hierba seca no son intercambiables uno a uno: la\nregla orientativa es tres a uno en volumen (fresca respecto a\nseca).</p></li>\n<li><p>Las especias y hierbas robustas se agregan al inicio de la\ncocción; las hierbas frescas delicadas se agregan al final para no\nperder su aroma.</p></li>\n<li><p>Tostar especias enteras en seco antes de molerlas libera y realza\nsus compuestos aromáticos.</p></li>\n<li><p>El aroma de una especia está fuertemente ligado a la memoria y la\nidentidad — dominar su manejo es, en cierto sentido, aprender a\nconstruir experiencias memorables para quien come.</p></li>\n</ul></div>\n\n"}
