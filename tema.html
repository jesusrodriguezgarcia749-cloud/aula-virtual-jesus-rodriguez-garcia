<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtema — Aula Virtual JRG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #f2ece1; color: #17140f; min-height: 100vh; }
  header { background: #17140f; color: #f2ece1; padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  header a { color: #f2ece1; text-decoration: none; font-size: 1.4rem; margin-right: 8px; }
  header h1 { font-size: 1.1rem; }
  main { padding: 40px 24px; max-width: 680px; margin: 0 auto; }
  .tag { color: #b5772a; letter-spacing: 2px; font-size: 0.8rem; text-transform: uppercase; }
  h2 { font-size: 1.8rem; margin: 10px 0 24px; }
  .aviso {
    background: #e7ddc9; border-left: 4px solid #d99a3d;
    border-radius: 8px; padding: 20px; line-height: 1.6; color: #4a4030;
  }
</style>
</head>
<body>
<header>
  <a id="volver" href="compendio.html">←</a>
  <h1>Contenido del subtema</h1>
</header>
<main>
  <div class="tag" id="numSubtema">Subtema</div>
  <h2 id="nombreSubtema">Cargando…</h2>
  <div class="aviso" id="cuerpo">
    Este subtema todavía no tiene el contenido cargado en la plataforma nueva.
    El texto completo se está migrando desde el Manual — vuelve pronto.
  </div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const materia = params.get('materia') || 'bases-culinarias';
const subtema = params.get('subtema') || '';

document.getElementById('volver').href = `compendio.html?materia=${materia}`;
document.getElementById('numSubtema').textContent = `Subtema ${subtema}`;
document.getElementById('nombreSubtema').textContent = `Contenido en construcción`;
</script>
</body>
</html>
