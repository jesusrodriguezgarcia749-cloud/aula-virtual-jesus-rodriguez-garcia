asivo de\nrecibir lo que un proveedor entrega, y \"comprar\" en el sentido activo de\nseleccionar personalmente lo mejor disponible. Un cocinero comprometido\ncon la calidad prefiere, siempre que sea posible, acudir en persona a\nelegir su materia prima —revisarla con sus propios ojos y manos,\naplicando los criterios de la tabla de recepción— en vez de delegar por\ncompleto esa decisión a quien surte el pedido.</p>\n<p>Esta actitud tiene una consecuencia práctica importante: cuando el\nproveedor habitual no tiene, ese día, un producto que cumpla el estándar\nbuscado, la respuesta correcta no es aceptar lo que hay \"porque ya se\npidió\", sino buscar otro proveedor que sí lo tenga. Esta disposición a\ncambiar de proveedor en el momento —en vez de conformarse— es, en la\npráctica cotidiana de una cocina, la aplicación más directa del\nprincipio de que ningún resultado final puede superar la calidad del\ningrediente con el que se partió.</p>\n<h3>Ejemplo\naplicado: calcular la cantidad a pedir considerando la merma</h3>\n<p>La cantidad que debe pedirse a un proveedor no es la misma que la\ncantidad neta que finalmente se usa en una preparación, porque toda\nmateria prima con cáscara, hueso o recorte pierde peso durante su\nlimpieza. La fórmula para calcular la cantidad bruta (AP) necesaria a\npartir de la cantidad neta (EP) requerida es:</p>\n<p>Cantidad AP = Cantidad EP ÷ (1 − % de merma, en decimal)</p>\n<p>Supongamos que una receta requiere 5 kg de zanahoria pelada y en\ncubos (cantidad EP), y la merma histórica registrada para el pelado y\ndespunte de zanahoria es del 12% (0.12). El cálculo sería: Cantidad AP =\n5 ÷ (1 − 0.12) = 5 ÷ 0.88 = 5.68 kg. Es decir, hay que pedir al\nproveedor 5.68 kg de zanahoria entera para, después de pelarla y\ndesecharla la merma, terminar con los 5 kg netos que la receta necesita.\nPedir exactamente 5 kg —sin considerar la merma— dejaría la cocina corta\nde producto al momento de cocinar.</p>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 2.1</strong></p>\n<ul>\n<li><p>El aprovisionamiento es un ciclo con etapas definidas:\nespecificación, cotización, orden de compra, recepción y\nalmacenamiento.</p></li>\n<li><p>Un proveedor se evalúa por calidad consistente, cumplimiento de\ntiempos, condiciones sanitarias y trazabilidad — no solo por\nprecio.</p></li>\n<li><p>La recepción es el último punto de control real antes de que el\ninsumo entre a producción; cada categoría de alimento tiene criterios de\nverificación propios.</p></li>\n<li><p>FIFO rota por orden de llegada; FEFO rota por fecha de caducidad\nreal — FEFO es más preciso cuando ambas fechas no coinciden.</p></li>\n</ul></div>\n\n"},
  "2.2": {"titulo": "Materias primas de uso común", "html": "<h3>Clasificación\npor origen: la primera gran división</h3>\n<p>Antes de estudiar ingredientes específicos, resulta útil ubicar\ncualquier materia prima dentro de tres grandes orígenes: animal (carnes,\naves, pescados, lácteos, huevo, miel), vegetal (cereales, leguminosas,\nfrutas, verduras, hongos, especias) y mineral (sal, agua, algunos\naditivos). Esta clasificación no es solo taxonómica: cada origen impone\nreglas distintas de manejo, conservación y riesgo sanitario. Un producto\nde origen animal, por ejemplo, exige control de temperatura mucho más\nestricto que uno mineral, que prácticamente no se descompone (Martínez\nde Flores Escobar y González-Garza, 2011).</p>\n<h3>Grupos\nprincipales de materias primas en la cocina profesional</h3>\n<p>Dentro de esos tres orígenes, la formación culinaria reconoce grupos\nde uso cotidiano que todo cocinero debe conocer con profundidad:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Grupo</strong></td>\n<td style=\"text-align: left;\"><strong>Ejemplos y uso\ncaracterístico</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Cereales y harinas</td>\n<td style=\"text-align: left;\">Trigo, arroz, maíz, avena. Base de\npanadería, pastelería, guarniciones y espesantes.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Leguminosas</td>\n<td style=\"text-align: left;\">Frijol, lenteja, garbanzo. Fuente de\nproteína vegetal, base de guisos y purés.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Lácteos</td>\n<td style=\"text-align: left;\">Leche, crema, mantequilla, quesos. Aportan\ngrasa, cuerpo y sabor; base de salsas y repostería.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Huevo</td>\n<td style=\"text-align: left;\">Ligante, emulsionante, aireante y proteína\ncentral en incontables preparaciones.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Carnes y aves</td>\n<td style=\"text-align: left;\">Res, cerdo, cordero, pollo, pavo. Proteína\ncentral del plato fuerte clásico.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Pescados y mariscos</td>\n<td style=\"text-align: left;\">De agua dulce y salada, moluscos y\ncrustáceos. Cocción rápida, alta sensibilidad a la frescura.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Frutas y verduras</td>\n<td style=\"text-align: left;\">Aportan color, textura, fibra y frescura;\nvarían enormemente por temporada y región.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Grasas y aceites</td>\n<td style=\"text-align: left;\">Vehículo de sabor y de calor; determinan\ntextura y punto de humeo en la cocción.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Condimentos y especias</td>\n<td style=\"text-align: left;\">Sal, pimienta, hierbas frescas y secas,\nespecias molidas o enteras. Definen el perfil de sabor final.</td>\n</tr>\n</tbody>\n</table>\n<h3>Breve historia del\ncomercio de especias</h3>\n<p>Pocas materias primas ilustran mejor el peso histórico del\naprovisionamiento que las especias. Durante siglos, productos como la\npimienta, la canela, el clavo y la nuez moscada viajaron miles de\nkilómetros a través de rutas comerciales que atravesaban Asia, Medio\nOriente y el Mediterráneo, encareciéndose en cada tramo del trayecto. La\nbúsqueda de una ruta marítima directa hacia las regiones productoras de\nespecias fue uno de los motores económicos centrales de la expansión\neuropea de los siglos XV y XVI, con consecuencias históricas que\ntrascienden por completo el ámbito culinario. Ese origen ayuda a\nentender por qué, incluso hoy, ciertas especias siguen siendo\nnotablemente más costosas que otras: su historia de escasez y transporte\ndejó huella en su valor percibido.</p>\n<div class=\"recuerda\"><em>El precio histórico de una especia\nno siempre refleja su dificultad de cultivo actual — buena parte de ese\nvalor es herencia de rutas comerciales que hoy ya no existen.</em></div>\n<h3>Grados de calidad: el caso\ndel huevo</h3>\n<p>Dentro de un mismo grupo de materia prima, la industria alimentaria\nsuele establecer sistemas de clasificación por grado de calidad, y el\nhuevo es uno de los ejemplos más claros y accesibles para ilustrar este\nprincipio. La clasificación evalúa principalmente la firmeza de la\nclara, la altura de la yema y el estado de la cámara de aire al interior\ndel cascarón:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 18%\"/>\n<col style=\"width: 78%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Grado</strong></td>\n<td style=\"text-align: left;\"><strong>Características y uso\nrecomendado</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">AA</td>\n<td style=\"text-align: left;\">Clara firme y espesa, yema alta y\ncentrada. Ideal para preparaciones donde la presentación importa: huevo\nestrellado, escalfado, poché.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">A</td>\n<td style=\"text-align: left;\">Clara razonablemente firme, yema\nligeramente menos definida. Adecuado para la mayoría de usos generales\nde cocina.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">B</td>\n<td style=\"text-align: left;\">Clara más líquida, yema aplanada. Apto\npara repostería, revueltos o cualquier preparación donde la forma no es\nvisible en el resultado final.</td>\n</tr>\n</tbody>\n</table>\n<p>Este mismo principio de clasificación por grado —evaluar atributos\nfísicos objetivos y asignar una categoría de calidad— se repite en\nmuchos otros grupos de materia prima (carnes, quesos, aceite de oliva),\naunque cada uno con sus propios criterios específicos.</p>\n<h3>Tipos de leche según su\nproceso térmico</h3>\n<p>Otro ejemplo útil dentro de los lácteos es entender que \"leche\" no es\nun producto único, sino una familia de productos que difieren según el\ntratamiento térmico aplicado para garantizar su seguridad y prolongar su\nvida de anaquel:</p>\n<ul>\n<li><p>Pasteurizada: calentada a una temperatura moderada (72°C aprox.\npor 15 segundos, pasteurización rápida) suficiente para eliminar\npatógenos sin alterar demasiado el sabor; requiere refrigeración y tiene\nvida de anaquel corta.</p></li>\n<li><p>Ultrapasteurizada (UHT): calentada a temperaturas mucho más altas\n(135–150°C) por segundos, lo que le da una vida de anaquel prolongada\nincluso sin refrigeración hasta abrirse, a cambio de un ligero cambio de\nsabor por la mayor exposición al calor.</p></li>\n<li><p>Homogeneizada: proceso mecánico (no térmico) que rompe los\nglóbulos de grasa para que no se separen ni floten a la superficie,\ndando una textura uniforme.</p></li>\n</ul>\n<p>Elegir el tipo correcto de leche importa en repostería de precisión,\ndonde la ultrapasteurización puede afectar ligeramente el comportamiento\nde la leche en ciertas fermentaciones o cuajados, mientras que para uso\ngeneral de cocina la diferencia resulta imperceptible.</p>\n<h3>El huevo:\nfunciones gastronómicas más allá de \"proteína\"</h3>\n<p>Pocos ingredientes son tan versátiles como el huevo, y buena parte de\nesa versatilidad se explica porque cumple funciones técnicas muy\ndistintas entre sí dentro de una preparación, no solo la de aportar\nproteína. Reconocer estas funciones es lo que permite entender por qué\nuna receta pide huevo, y qué pasaría si se omitiera:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Función</strong></td>\n<td style=\"text-align: left;\"><strong>Cómo actúa y ejemplo</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ligante</td>\n<td style=\"text-align: left;\">Las proteínas del huevo se coagulan con el\ncalor y unen otros ingredientes entre sí; por eso se usa en albóndigas,\ncroquetas y rellenos.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Emulsionante</td>\n<td style=\"text-align: left;\">La lecitina de la yema permite mezclar\nagua y grasa sin que se separen; es la base de la mayonesa y de la salsa\nholandesa.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Aireante</td>\n<td style=\"text-align: left;\">La clara batida atrapa burbujas de aire\nestabilizadas por sus proteínas; da estructura a merengues, suflés y\nalgunos panes.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Espesante</td>\n<td style=\"text-align: left;\">Al calentarse gradualmente en un líquido,\nla proteína del huevo espesa sin llegar a cuajar por completo; es la\nbase de natillas y cremas inglesas.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Clarificante</td>\n<td style=\"text-align: left;\">La clara cruda atrapa impurezas cuando se\ncalienta lentamente en un caldo turbio, permitiendo colarlas y obtener\nun consomé transparente.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Glaseado (dorado)</td>\n<td style=\"text-align: left;\">Batido y aplicado con brocha sobre masas\nantes de hornear, aporta color dorado brillante por la reacción de\nMaillard sobre su proteína y azúcares.</td>\n</tr>\n</tbody>\n</table>\n<p>Comprender estas funciones explica por qué, en algunos casos, el\nhuevo puede sustituirse por otro ingrediente que cumpla la misma función\ntécnica (por ejemplo, ciertos almidones como ligantes), mientras que en\notros —como el aireado de un merengue— no existe un sustituto sencillo\nque replique exactamente su comportamiento.</p>\n<h3>A qué temperatura\ncoagula realmente el huevo</h3>\n<p>La clara y la yema no coagulan a la misma temperatura, y esa\ndiferencia es la que permite controlar con precisión texturas como el\nhuevo poché o el tibio: las proteínas de la clara comienzan a coagular\nentre 65°C y 70°C, mientras que las de la yema lo hacen entre 75°C y\n80°C. Ese margen de unos 10°C es la ventana que un cocinero aprovecha\npara lograr una clara firme con una yema todavía líquida o cremosa —\ncocinar por encima de 80°C endurece ambas por completo.</p>\n<p>Para efectos de cálculo en cocina de producción, conviene tener\npresente el peso promedio de un huevo sin cáscara (50 g): 20 huevos\ncompletos equivalen aproximadamente a 1 kg; 48 yemas equivalen a 1\nlitro; y 32 claras equivalen a 1 litro. Estas equivalencias permiten\nconvertir una receta que pide huevo \"por pieza\" a una receta de\nproducción que pide huevo por peso o volumen, sin necesidad de pesar\ncada vez.</p>\n<div class=\"recuerda\"><em>La clara\ncoagula entre 65-70°C y la yema entre 75-80°C — ese margen de 10°C es lo\nque hace posible un huevo con clara firme y yema líquida.</em></div>\n<h3>Harinas:\nclasificación por contenido de proteína</h3>\n<p>\"Harina\" no es un ingrediente único, sino una familia clasificada\nprincipalmente por su contenido de proteína (gluten potencial), que\ndetermina qué tan elástica y fuerte puede volverse una masa hecha con\nella. Elegir la harina equivocada para un uso específico produce\nresultados tan distintos como elegir la papa equivocada para un puré,\ntal como se vio en el subtema 2.3:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 18%\"/>\n<col style=\"width: 53%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Tipo de harina</strong></td>\n<td style=\"text-align: left;\"><strong>% proteína aprox.</strong></td>\n<td style=\"text-align: left;\"><strong>Uso recomendado</strong></td>\n</tr>\n<tr class=\"even\">\n<td>Harina para pastel (baja)</td>\n<td style=\"text-align: left;\">7–9%</td>\n<td style=\"text-align: left;\">Bizcochos y pasteles suaves, donde se\nbusca una miga tierna con poco desarrollo de gluten.</td>\n</tr>\n<tr class=\"odd\">\n<td>Harina todo uso</td>\n<td style=\"text-align: left;\">9–11%</td>\n<td style=\"text-align: left;\">Uso general: galletas, algunas masas,\nespesantes. Balance entre estructura y suavidad.</td>\n</tr>\n<tr class=\"even\">\n<td>Harina de pan (alta)</td>\n<td style=\"text-align: left;\">11–13%</td>\n<td style=\"text-align: left;\">Panes con estructura fuerte y masticable,\ndonde se necesita buen desarrollo de gluten.</td>\n</tr>\n<tr class=\"odd\">\n<td>Harina integral</td>\n<td style=\"text-align: left;\">Variable</td>\n<td style=\"text-align: left;\">Incluye salvado y germen del grano; aporta\nfibra y sabor, pero el salvado corta las hebras de gluten y da una miga\nmás densa.</td>\n</tr>\n</tbody>\n</table>\n<p>Usar harina de pan (alta en proteína) para un pastel produce una miga\ndura y correosa, porque se desarrolla más gluten del que ese tipo de\npreparación necesita; usar harina para pastel (baja en proteína) para un\npan de estructura fuerte produce una pieza que no logra la elasticidad\nnecesaria para atrapar bien el gas de la fermentación.</p>\n<h3>Almidones puros:\nmaicena y espesantes similares</h3>\n<p>A diferencia de la harina de trigo —que combina almidón con proteína\n(gluten)—, ingredientes como la maicena (almidón de maíz), la fécula de\npapa o el arrurruz son almidones prácticamente puros, sin proteína\nsignificativa. Esto los hace espesantes más \"limpios\": producen una\ntextura translúcida y sin sabor a crudo si se cocinan lo suficiente,\ndistinta a la textura opaca y ligeramente harinosa que deja la harina de\ntrigo como espesante. Por eso, salsas donde se busca una apariencia\nbrillante y transparente —como muchas salsas agridulces— suelen\nespesarse con maicena disuelta en agua fría antes de incorporarse al\nlíquido caliente, nunca directamente en polvo, porque formaría\ngrumos.</p>\n<h3>Crustáceos\ny moluscos: dos familias distintas de mariscos</h3>\n<p>Dentro del grupo de pescados y mariscos conviene distinguir dos\nfamilias con anatomía y manejo muy distintos. Los crustáceos (camarón,\nlangosta, jaiba, langostino) están recubiertos por un caparazón o\nexoesqueleto rígido, con la mayor parte de su carne comestible\nconcentrada en el abdomen o las pinzas; se cuecen típicamente en agua\nhirviendo con sal o en un caldo corto, y su cocción debe ser rápida para\nno endurecer la carne.</p>\n<p>Los moluscos, por su parte, no tienen articulaciones, y se dividen a\nsu vez según su estructura: los bivalvos (ostión, almeja, mejillón)\nestán protegidos por dos valvas o conchas; los gasterópodos (caracol,\nabulón) se desplazan sobre un pie muscular único y suelen tener una sola\nconcha; y los cefalópodos (pulpo, calamar) no tienen estructura calcárea\nexterna, y su propulsión ocurre desde la cabeza.</p>\n<p>Tanto crustáceos como moluscos comparten un criterio de frescura que\nlos distingue de otros productos del mar: deben mantenerse húmedos, con\npeso notable al sostenerlos en la mano, y con el característico olor a\nagua de mar o algas — nunca amoniacal. Los moluscos bivalvos que se\ncompran vivos y con concha deben descartarse si están abiertos sin\nresponder al tacto, o si al golpear la concha producen un sonido hueco,\nseñal de que ya no están vivos.</p>\n<div class=\"recuerda\"><em>Un\nmejillón o una almeja que no cierra su concha al tocarlo, o que suena\nhueco al golpearlo, ya no está vivo y debe descartarse — no hay forma\nsegura de \"salvarlo\" cocinándolo más tiempo.</em></div>\n<h3>Aceites y grasas:\ntipos y su uso correcto</h3>\n<p>Las grasas que se emplean en cocina se dividen, en primer lugar, por\nsu origen —vegetal o animal— y, en segundo lugar, por su comportamiento\nfrente al calor, lo que determina su uso correcto:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Grasa</strong></td>\n<td style=\"text-align: left;\"><strong>Origen y uso\ncaracterístico</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Aceites para freír (canola, girasol,\ncártamo)</td>\n<td style=\"text-align: left;\">Vegetal; punto de humeo alto, sabor\nneutro. Ideales para fritur
