  "1.1": {"titulo": "Géneros y elaboraciones culinarias sencillas", "html": "<h3>El\noficio y quien lo ejerce: perfil del cocinero profesional</h3>\n<p>Antes de clasificar preparaciones, conviene detenerse en quién las\nelabora. El cocinero profesional no es simplemente alguien que sabe\ncocinar bien en casa: es una persona formada para producir alimentos de\nforma consistente, higiénica y rentable, bajo presión de tiempo y para\nun número de comensales que puede variar de diez a varios cientos en una\nmisma noche. Esa diferencia de escala y de exigencia es lo que separa el\noficio profesional de la cocina doméstica, por buena que esta sea.</p>\n<p>El perfil profesional exige, además del dominio técnico, un conjunto\nde actitudes que la formación académica busca desarrollar desde el\nprimer cuatrimestre: disciplina en los horarios, capacidad de trabajar\nen equipo bajo presión, tolerancia a jornadas físicamente demandantes,\natención minuciosa al detalle y, sobre todo, un compromiso genuino con\nla salud de quien va a comer el resultado de ese trabajo.</p>\n<h3>La\nbrigada de cocina: cómo se organiza el trabajo en equipo</h3>\n<p>Una cocina profesional de cualquier tamaño necesita una estructura\nclara de responsabilidades, porque la improvisación en un servicio con\ndecenas de comandas simultáneas produce caos y, en el peor de los casos,\nriesgos de seguridad alimentaria. La brigada de cocina clásica (creada\noriginalmente por Auguste Escoffier a finales del siglo XIX para\norganizar cocinas de hotel de gran volumen) sigue siendo la referencia\npara entender esos roles, aunque hoy se simplifique mucho en cocinas\npequeñas o medianas:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 71%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Puesto</strong></td>\n<td style=\"text-align: center;\"><strong>Función principal</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Chef ejecutivo / Chef de cocina</td>\n<td style=\"text-align: center;\">Dirige toda la cocina: menú, costos,\npersonal y estándar de calidad final.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Sous chef</td>\n<td style=\"text-align: center;\">Segundo al mando; supervisa la operación\ndiaria y sustituye al chef ejecutivo en su ausencia.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Chef de partida (Chef de partie)</td>\n<td style=\"text-align: center;\">Responsable de una estación específica\n(salsas, pescados, parrilla, repostería, etc.).</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Cocinero / Commis</td>\n<td style=\"text-align: center;\">Apoya a un chef de partida; en formación\ndentro de una estación específica.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Steward / Ayudante de cocina</td>\n<td style=\"text-align: center;\">Apoyo general de limpieza, mise en place\nbásico y abastecimiento dentro de la cocina.</td>\n</tr>\n</tbody>\n</table>\n<p>En una cocina pequeña, una sola persona puede ocupar varios de estos\nroles a la vez, pero entender la lógica de la brigada —quién decide,\nquién ejecuta, quién apoya— sigue siendo útil para organizar cualquier\nequipo de trabajo, incluidas las prácticas de cocina de este curso,\ndonde cada equipo deberá asignarse roles claros antes de empezar a\ncocinar.</p>\n<div class=\"recuerda\"><em>La brigada\nde cocina no es solo jerarquía: es una forma de repartir responsabilidad\npara que nadie dependa de la memoria de una sola persona durante el\nservicio.</em></div>\n<h3>Origen\nhistórico de la clasificación por géneros</h3>\n<p>La idea de organizar la cocina en categorías —géneros— no es reciente\nni arbitraria. Antes de la codificación moderna, cada región y cada\ncocinero tenían su propio orden de trabajo, lo que dificultaba\nenormemente la enseñanza y la transmisión del oficio fuera del círculo\ncercano de un maestro. La sistematización que hoy usamos proviene, en\ngran medida, de la cocina clásica francesa de finales del siglo XIX,\ncuando se estableció una secuencia estándar de servicio (el llamado\n\"orden del menú\" o service à la russe, que sustituyó al antiguo service\nà la française donde todos los platillos se servían simultáneamente) y,\njunto con ella, una clasificación de las preparaciones según el lugar\nque ocupan en esa secuencia.</p>\n<p>Esta clasificación se extendió después a la formación profesional en\ntodo el mundo, adaptándose a las cocinas regionales, pero conservando la\nlógica de fondo: agrupar preparaciones no por su origen geográfico ni\npor sus ingredientes, sino por la función que cumplen y la técnica que\ncomparten.</p>\n<h3>¿Qué es un género culinario?</h3>\n<p>Un género culinario es una categoría amplia que agrupa preparaciones\nsegún la técnica que emplean, la estructura que comparten o la función\nque cumplen dentro de un menú. Hablar de \"sopas\", \"salsas\", \"entremeses\"\no \"guarniciones\" no es solo una forma de organizar un recetario: es una\nmanera de pensar la cocina por patrones en lugar de por recetas\naisladas.</p>\n<p>Esta distinción es fundamental para la formación profesional. Un\ncocinero que memoriza recetas sin comprender el género al que pertenecen\nqueda atrapado cada vez que se enfrenta a un platillo nuevo. En cambio,\nquien reconoce que un consomé y una crema de verduras son ambos \"sopas\"\n—aunque su textura, temperatura y presentación difieran radicalmente—\npuede anticipar su técnica de cocción, su tiempo aproximado de\npreparación y el lugar que ocuparán en la secuencia de un menú.</p>\n<div class=\"recuerda\"><em>El género\nse define por función y técnica, nunca por nacionalidad. Un mole y una\nbechamel son, ambos, \"salsas\", aunque provengan de tradiciones\nculinarias completamente distintas.</em></div>\n<h3>Clasificación general de\ngéneros</h3>\n<p>La clasificación clásica de géneros reconocida en la formación\ngastronómica occidental —y que sigue vigente, con adaptaciones, en la\ncocina contemporánea— incluye los siguientes grandes grupos:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 71%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Género</strong></td>\n<td style=\"text-align: left;\"><strong>Función dentro del\nmenú</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Entremeses (hors d'œuvre)</td>\n<td style=\"text-align: left;\">Preparaciones frías o calientes, en\nporciones pequeñas, que abren el apetito al inicio de la comida. Se\nsubdividen en simples (una sola pieza, como aceitunas o embutidos) y\nvariados (una selección de varias piezas).</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Sopas y potajes</td>\n<td style=\"text-align: left;\">Preparaciones líquidas o semilíquidas que\nsuelen anteceder al plato fuerte. Se dividen en claras (consomés,\ncaldos) y ligadas o espesas (cremas, veloutés, potajes).</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Huevos</td>\n<td style=\"text-align: left;\">Género propio dentro de la cocina clásica,\ncon múltiples técnicas de cocción (poché, mollet, en cocotte, revueltos,\ntortillas) que se estudian de forma independiente por su\nversatilidad.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Farináceos</td>\n<td style=\"text-align: left;\">Pastas, arroces y otros granos preparados\ncomo plato o guarnición; incluye desde un arroz simple hasta\npreparaciones más elaboradas como el risotto.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Salsas</td>\n<td style=\"text-align: left;\">Preparaciones semilíquidas que acompañan y\nrealzan un platillo principal, aportando humedad, sabor y presentación.\nSe organizan clásicamente en \"salsas madre\" y sus derivadas.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Guarniciones</td>\n<td style=\"text-align: left;\">Elementos que acompañan al platillo\nprincipal, aportando equilibrio de textura, color y valor\nnutricional.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Plato fuerte (carnes, aves, caza, pescados\ny mariscos)</td>\n<td style=\"text-align: left;\">El centro habitual del menú. Es un solo\ngénero por función — no varios—, aunque se subdivide según el tipo de\nproteína porque cada una exige reglas de manejo y cocción distintas (los\npescados, por ejemplo, se desnaturalizan mucho más rápido que una carne\nroja y toleran muy poco la sobrecocción).</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Postres</td>\n<td style=\"text-align: left;\">Preparaciones dulces que cierran la\ncomida; incluyen desde frutas simples hasta pastelería elaborada.</td>\n</tr>\n</tbody>\n</table>\n<p>Nota importante sobre esta tabla: fíjate que \"carnes\", \"aves\", \"caza\"\ny \"pescados y mariscos\" NO son géneros distintos entre sí, aunque se\nagrupan aquí en un solo renglón por claridad. Los cuatro cumplen\nexactamente la misma función dentro del menú —ser el plato fuerte—, así\nque forman un solo género. Lo que sí cambia entre ellos es la técnica de\nmanejo, por el tipo de proteína. Esta distinción importa porque es\nprecisamente el tipo de confusión que se señaló como error común más\nabajo: agrupar por ingrediente (\"todo lo que es pescado\") en vez de por\nfunción (\"todo lo que es plato fuerte\"). Los subtemas 3.2.1 en adelante\nretoman esta subdivisión por proteína, ya no como géneros distintos,\nsino como categorías de materia prima con reglas de manejo propias.</p>\n<h3>Elaboraciones\nculinarias sencillas: los \"ladrillos\" de la cocina</h3>\n<p>Una elaboración culinaria sencilla es cualquier preparación de base\nque no depende de otra preparación previa para existir: un caldo, una\nvinagreta, un puré simple, una mantequilla compuesta. Estas\nelaboraciones son, en un sentido literal, los ladrillos con los que\ndespués se construyen preparaciones compuestas.</p>\n<p>El ejemplo más claro de esta lógica constructiva son las llamadas\nsalsas madre de la cocina clásica: béchamel, velouté, española (o\n\"demi-glace\"), holandesa y salsa de tomate. Cada una es, en sí misma,\nuna elaboración relativamente sencilla —un fondo o una leche ligados con\nun espesante—, pero a partir de ellas se derivan decenas de salsas\ncompuestas mediante la adición de otros ingredientes. La salsa Mornay,\npor ejemplo, es una béchamel a la que se añade queso; la salsa suprema\nes un velouté de ave enriquecido con crema. Comprender esta estructura\nde \"madre y derivadas\" permite a un cocinero deducir cómo preparar una\nsalsa que nunca ha hecho, en lugar de memorizarla como una fórmula\naislada.</p>\n<p>Reconocer qué elaboraciones son \"sencillas\" y cuáles son \"compuestas\"\nayuda además a organizar el trabajo de cocina de forma eficiente: las\nelaboraciones sencillas suelen prepararse con anticipación y en lote\n—como parte del mise en place, tema que se profundiza en el subtema\n1.2—, mientras que las compuestas se ensamblan al momento del servicio a\npartir de esos elementos ya listos.</p>\n<div class=\"recuerda\"><em>Todas las\nsalsas derivadas de una misma salsa madre comparten su base, pero\ncambian de nombre según el ingrediente que las diferencia. Aprender la\nlógica de derivación es más eficiente que memorizar cada salsa por\nseparado.</em></div>\n<h3>Errores comunes al\nclasificar por género</h3>\n<p>Los alumnos en formación suelen cometer dos errores frecuentes al\nclasificar preparaciones por género. El primero es clasificar por\ningrediente principal en lugar de por función: agrupar, por ejemplo,\ntodas las preparaciones que llevan pollo en una sola categoría, sin\ndistinguir si se trata de una sopa, un plato fuerte o un entremés. El\nsegundo es confundir género con origen geográfico o nacionalidad,\nasumiendo que \"cocina mexicana\" o \"cocina italiana\" son géneros\nculinarios, cuando en realidad son tradiciones que contienen\npreparaciones de muchos géneros distintos dentro de sí.</p>\n<p>Evitar estos errores desde el inicio de la formación facilita\nenormemente el aprendizaje de los bloques siguientes, donde la\nclasificación por género vuelve a aparecer al estudiar materias primas y\ntécnicas de cocción.</p>\n<h3>El\nmenú clásico completo: las etapas del servicio francés</h3>\n<p>La codificación de Escoffier no solo definió los géneros: también\nfijó el orden en que debían aparecer dentro de un menú de gala, una\nestructura que —aunque hoy se simplifica considerablemente en la mayoría\nde los establecimientos— sigue siendo la referencia histórica sobre la\nque se construyen los menús contemporáneos, incluidos los menús\ndegustación de varios tiempos que se usan en restauración de alta cocina\nactual.</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 11%\"/>\n<col style=\"width: 85%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>#</strong></td>\n<td style=\"text-align: left;\"><strong>Etapa del menú\nclásico</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">1</td>\n<td style=\"text-align: left;\">Hors d'œuvre (entremeses fríos)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">2</td>\n<td style=\"text-align: left;\">Potage (sopas y consomés)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">3</td>\n<td style=\"text-align: left;\">Œufs (huevos)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">4</td>\n<td style=\"text-align: left;\">Farineux (farináceos: pastas,\narroces)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">5</td>\n<td style=\"text-align: left;\">Poisson (pescados)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">6</td>\n<td style=\"text-align: left;\">Entrée (entrada caliente, generalmente una\nproteína en salsa)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">7</td>\n<td style=\"text-align: left;\">Sorbet (sorbete, para \"limpiar\" el paladar\nantes del plato fuerte)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">8</td>\n<td style=\"text-align: left;\">Relevé (plato fuerte principal,\ngeneralmente una pieza grande de carne o ave)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">9</td>\n<td style=\"text-align: left;\">Rôti (asado, una segunda proteína,\ntradicionalmente caza o ave)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">10</td>\n<td style=\"text-align: left;\">Légume (verduras y guarniciones)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">11</td>\n<td style=\"text-align: left;\">Entremets (postres de cocina: suflés,\ncremas)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">12</td>\n<td style=\"text-align: left;\">Dessert (pastelería, frutas, quesos)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">13</td>\n<td style=\"text-align: left;\">Café / digestivos</td>\n</tr>\n</tbody>\n</table>\n<p>Un menú contemporáneo de restaurante raramente conserva las trece\netapas completas —resultaría excesivo para el comensal actual—, pero\ncasi siempre conserva su lógica de fondo: algo ligero para abrir el\napetito, una sopa o entrada, un plato principal con su guarnición, y un\ncierre dulce. Reconocer esta estructura heredada ayuda a comprender por\nqué los menús modernos, aun siendo mucho más breves, mantienen un orden\nlógico de sabores e intensidades: de lo ligero a lo contundente, y de\nvuelta a lo ligero para el postre.</p>\n<h3>Aplicación\nde los géneros en la cocina mexicana contemporánea</h3>\n<p>Aunque la clasificación por géneros nació en la tradición francesa,\nse aplica sin dificultad a la gastronomía mexicana y a cualquier otra\ntradición culinaria, precisamente porque clasifica por función y no por\norigen. Un caldo de res es, en términos de género, una \"sopa clara\"; un\nmole es una \"salsa\" compuesta y espesa; unos chiles rellenos ocupan el\nlugar de \"entrada\" o \"plato fuerte\" según la porción y el contexto del\nmenú; una agua fresca cumple una función de \"bebida de acompañamiento\"\ncomparable a ciertos consomés ligeros servidos entre tiempos. Practicar\nesta traducción —de la tradición local a la clasificación por género— es\nun ejercicio formativo valioso porque obliga al alumno a pensar en\nfunción y estructura, no solo en el nombre familiar del platillo.</p>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 1.1</strong></p>\n<ul>\n<li><p>El género agrupa preparaciones por técnica o función, no por\nnombre comercial, ingrediente principal ni origen geográfico.</p></li>\n<li><p>La clasificación clásica por géneros proviene de la\nsistematización de la cocina francesa de finales del siglo XIX\n(Escoffier y el orden moderno del menú).</p></li>\n<li><p>Reconocer el género de un platillo antes de cocinarlo permite\nanticipar su técnica de cocción y su función en el menú.</p></li>\n<li><p>Una elaboración sencilla no depende de otra preparación previa;\nuna elaboración compuesta sí — el ejemplo clásico son las cinco salsas\nmadre y sus derivadas.</p></li>\n<li><p>Las elaboraciones sencillas se preparan con anticipación (mise en\nplace); las compuestas se ensamblan al momento del servicio.</p></li>\n</ul></div>\n\n"},
  "1.2": {"titulo": "Elaboración culinaria básica", "html": "<h3>La\norganización del trabajo en la cocina profesional</h3>\n<p>La forma en que hoy se organiza el trabajo dentro de una cocina\nprofesional —con estaciones definidas, una secuencia clara de tareas y\nuna jerarquía de responsabilidades— tiene también su origen en la\nsistematización de finales del siglo XIX y principios del XX. La llamada\nbrigada de cocina (brigade de cuisine) dividió el trabajo en secciones\nespecializadas: la partie de salsas, la de pescados, la de asados, la de\nrepostería, cada una bajo la responsabilidad de un chef de partie. Esta\ndivisión por estaciones permitió que restaurantes de gran volumen\npudieran servir decenas de platillos simultáneamente sin perder\nconsistencia.</p>\n<p>Aunque la mayoría de las cocinas de formación y de establecimientos\npequeños no cuentan con una brigada completa, el principio subyacente\n—dividir el trabajo en etapas claras y repetibles— sigue siendo la base\nde cualquier elaboración culinaria, sin importar la escala del\nestablecimiento.</p>\n<h3>La secuencia de toda\nelaboración</h3>\n<p>La elaboración culinaria básica es el proceso ordenado que transforma\nmateria prima en un alimento comestible. Aunque cada platillo tiene sus\nparticularidades, prácticamente cualquier preparación —desde la más\nsencilla hasta la más elaborada— sigue una secuencia lógica compuesta\npor cuatro etapas:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 15%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 56%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Etapa</strong></td>\n<td style=\"text-align: left;\"><strong>Nombre</strong></td>\n<td style=\"text-align: left;\"><strong>Qué ocurre</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">1</td>\n<td style=\"text-align: left;\">Selección y mise en place</td>\n<td style=\"text-align: left;\">Elegir la materia prima adecuada; lavar,\npesar, cortar y disponer cada ingrediente antes de encender el\nfuego.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">2</td>\n<td style=\"text-align: left;\">Técnica de cocción</td>\n<td style=\"text-align: left;\">Aplicar el método correspondiente según el\nresultado que se busca. Las técnicas específicas se estudian a fondo en\nel Bloque 3; aquí basta con reconocer que este paso existe y es\ncentral.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">3</td>\n<td style=\"text-align: left;\">Rectificación de sabor</td>\n<td style=\"text-align: left;\">Probar y ajustar sal, acidez, dulzor y\ntextura antes de dar por terminada la preparación.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">4</td>\n<td style=\"text-align: left;\">Presentación</td>\n<td style=\"text-align: left;\">Montar el platillo aplicando criterios de\nestética, temperatura de servicio y porción.</td>\n</tr>\n</tbody>\n</table>\n<h3>Mise en place: \"todo en su\nlugar\"</h3>\n<p>El concepto de mise en place —expresión francesa que literalmente\nsignifica \"puesto en su lugar\"— es quizás el hábito más determinante en\nla formación de un cocinero profesional. Significa tener cada\ningrediente pesado, cortado, medido y dispuesto antes de encender el\nfuego, de modo que durante la cocción activa el cocinero no tenga que\ninterrumpir el proceso para buscar, pelar o medir algo que debió\nprepararse antes.</p>\n<p>El mise en place no es exclusivo de los ingredientes: incluye también\nla preparación del área de trabajo (estación limpia y ordenada), el\nequipo necesario a la mano (utensilios, sartenes, charolas) y, en un\nsentido más amplio, la planeación mental de la secuencia de trabajo\nantes de comenzar. En cocinas de alto volumen —un restaurante en\nservicio, una cocina de banquetes—, un mise en place deficiente no solo\ngenera platillos inconsistentes: genera retrasos que afectan a todo el\nequipo y, en última instancia, la experiencia del comensal.</p>\n<div class=\"recuerda\"><em>El mise en\nplace no termina cuando se enciende el fuego: si durante la cocción\nactiva tienes que detenerte a buscar o preparar algo, tu mise en place\nestuvo incompleto.</em></div>\n<h3>Ejemplo\naplicado: mise en place para un salteado sencillo</h3>\n<p>Para ilustrar la secuencia completa, consideremos un salteado\nsencillo de vegetales con proteína —un platillo común en cualquier\ncocina de formación—:</p>\n<ol type=\"1\">\n<li><p>Leer la receta completa antes de empezar, identificando todos los\ningredientes y técnicas involucradas.</p></li>\n<li><p>Lavar y desinfectar los vegetales; cortar cada uno en el tamaño y\nforma indicados (por ejemplo, juliana o brunoise), agrupándolos por\ntiempo de cocción.</p></li>\n<li><p>Pesar y porcionar la proteína, retirándola del refrigerador con\nel tiempo suficiente para que no esté completamente fría al momento de\ncocinarla.</p></li>\n<li><p>Medir los líquidos y condimentos (aceite, salsa de soya,\nespecias) en recipientes pequeños, listos para agregarse en el momento\nindicado.</p></li>\n<li><p>Disponer todos los elementos en el orden en que se van a usar, de\nizquierda a derecha, junto a la estación de cocción.</p></li>\n<li><p>Verificar que el equipo (sartén, espátula, plato de servicio)\nesté limpio y a la mano antes de encender el fuego.</p></li>\n</ol>\n<p>Solo después de completar estos seis pasos se enciende el fuego y\ncomienza la cocción activa. Este orden —aparentemente obvio cuando se\nexplica paso a paso— es precisamente lo que falla cuando un cocinero en\nformación intenta improvisar sin mise en place: termina cortando\ningredientes con el aceite ya humeando en la sartén, lo que casi siempre\nresulta en cocciones desiguales o platillos quemados.</p>\n<h3>Por qué la secuencia importa</h3>\n<p>Comprender esta secuencia como una estructura repetible —y no como\nuna serie de pasos exclusivos de una receta particular— es lo que\npermite a un cocinero adaptarse con rapidez ante un platillo que nunca\nha preparado. En lugar de memorizar instrucciones, aplica una lógica de\ntrabajo ya interiorizada: selección y mise en place, cocción, ajuste,\npresentación. Esta misma lógica es la que sustenta, más adelante en el\ncurso, el desarrollo de fichas técnicas y recetarios estandarizados.</p>\n<h3>Errores comunes en la\nelaboración básica</h3>\n<p>Entre los errores más frecuentes en cocineros en formación destacan:\ncomenzar a cocinar sin haber leído la receta completa; cortar\ningredientes de tamaños desiguales, lo que provoca cocciones\ninconsistentes; olvidar la etapa de rectificación de sabor, sirviendo un\nplatillo sin haberlo probado; y descuidar la presentación por\nconsiderarla un paso \"secundario\", cuando en realidad forma parte\nintegral de la experiencia del comensal.</p>\n<h3>Por\nqué el mise en place funciona: carga cognitiva y flujo de trabajo</h3>\n<p>Existe una razón práctica, casi de eficiencia mental, detrás de la\ninsistencia en el mise en place: durante la cocción activa, un cocinero\ndebe tomar decisiones constantes y rápidas —cuánto tiempo más, qué tanto\ncalor, cuándo mover, cuándo retirar—. Si a esa carga de decisiones se\nsuma la tarea de buscar, pelar o medir algo que debió prepararse antes,\nla probabilidad de error aumenta considerablemente. El mise en place, en\neste sentido, no es solo una cuestión de orden: es una forma de reducir\nla carga mental durante el momento de mayor exigencia de la elaboración,\nliberando la atención del cocinero para enfocarse exclusivamente en el\npunto de cocción y el ajuste de sabor.</p>\n<h3>Mise en\nplace en distintos contextos de producción</h3>\n<p>La forma concreta que toma el mise en place varía según el tipo de\nestablecimiento, aunque el principio subyacente es siempre el mismo:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 27%\"/>\n<col style=\"width: 70%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Contexto</strong></td>\n<td style=\"text-align: left;\"><strong>Cómo se aplica el mise en\nplace</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Restaurante a la carta</td>\n<td style=\"text-align: left;\">Mise en place parcial: los elementos base\n(fondos, salsas madre, cortes) se preparan con horas de anticipación; el\nensamblaje final ocurre al momento de cada orden.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Banquetes y eventos</td>\n<td style=\"text-align: left;\">Mise en place casi total: dado que el menú\ny el número de comensales se conocen con anticipación, la mayor parte de\nla elaboración se completa antes del evento, dejando solo el montaje\nfinal.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Producción industrial / catering</td>\n<td style=\"text-align: left;\">Mise en place estandarizado por lote,\nsiguiendo fichas técnicas estrictas, con controles de calidad en cada\netapa del proceso.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Cocina de formación (escuela)</td>\n<td style=\"text-align: left;\">Mise en place supervisado: el docente\nverifica que cada alumno complete la secuencia antes de autorizar el\nencendido del equipo de cocción.</td>\n</tr>\n</tbody>\n</table>\n<h3>Higiene\npersonal y del área de trabajo: la base invisible de toda\nelaboración</h3>\n<p>Ninguna elaboración culinaria, por sencilla o compuesta que sea,\ntiene sentido si compromete la salud de quien la va a comer. La higiene\nno es un tema aparte de la técnica: es la condición previa que hace\nsegura cualquier técnica (Martínez de Flores Escobar y González-Garza,\n2011). Antes de tocar un solo ingrediente, el cocinero profesional debe\ncumplir un mínimo no negociable de hábitos personales:</p>\n<ul>\n<li>Lavado de manos con agua y jabón, hasta el antebrazo, al iniciar el\nturno, después de tocar alimentos crudos distintos, después de ir al\nbaño y cada vez que se cambia de tarea.</li>\n<li>Uñas cortas y sin esmalte, cabello recogido y cubierto, uniforme\nlimpio y exclusivo para el área de trabajo.</li>\n<li>No usar joyería en manos o muñecas, y evitar tocarse el cabello, la\ncara o el celular mientras se manipulan alimentos.</li>\n<li>No probar los alimentos con los dedos ni reutilizar la misma cuchara\nde degustación sin lavarla.</li>\n</ul>\n<p>A esto se suma la higiene del área de trabajo: superficies\ndesinfectadas antes y después de cada uso, tablas de picar separadas por\ntipo de alimento (para evitar contaminación cruzada entre crudos y\nlistos para consumir), y trapos de limpieza distintos para superficies y\npara manos. Este hábito —separar por color o por función— es el mismo\nprincipio que sostiene el bloque de limpieza final de 15 minutos que\ncierra cada práctica de cocina de este curso: la higiene no es un paso\nopcional al final, es una disciplina que se sostiene durante toda la\nelaboración.</p>\n<div class=\"recuerda\"><em>Un\ncocinero técnicamente brillante pero con hábitos de higiene deficientes\nno es un cocinero profesional: es un riesgo sanitario. La higiene se\nevalúa en este curso con el mismo peso que la técnica, dentro de la\nrúbrica de prácticas (ver Anexo A).</em></div>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 1.2</strong></p>\n<ul>\n<li><p>La organización moderna del trabajo en cocina (brigada,\nestaciones) proviene de la sistematización de finales del siglo</p>\n<ol start=\"19\" type=\"I\">\n<li></li>\n</ol></li>\n<li><p>Toda elaboración sigue una secuencia: mise en place → técnica de\ncocción → rectificación de sabor → presentación.</p></li>\n<li><p>El mise en place incluye ingredientes, equipo y área de trabajo —\nno solo los ingredientes.</p></li>\n<li><p>Interiorizar la secuencia (no memorizar recetas aisladas) es lo\nque permite adaptarse a platillos nuevos.</p></li>\n</ul></div>\n\n"},
  "1.3": {"titulo": "Equipos e instrumentos de medida", "html": "<h3>De la cocina\nempírica a la cocina estandarizada</h3>\n<p>Durante siglos, la cocina se practicó de forma empírica: \"un puñado\nde sal\", \"una pizca de canela\", \"hasta que espese\". Este tipo de\ninstrucción funciona razonablemente bien cuando quien cocina tiene años\nde experiencia y cocina para sí mismo o para su familia, pero se vuelve\ninsostenible en un contexto profesional donde decenas de cocineros\ndistintos deben producir el mismo platillo, con el mismo resultado, día\ntras día. La estandarización de la medición —adoptar instrumentos y\nunidades comunes— es lo que hizo posible la cocina de producción a gran\nescala, desde restaurantes con varias sucursales hasta la industria\nalimentaria.</p>\n<p>La precisión en la medición es, por tanto, mucho más que un\ntecnicismo: es la condición que permite que un platillo salga igual cada\nvez que se prepara, sin importar quién esté al frente, y depende de\ninstrumentos de medida confiables cuyo uso correcto debe dominarse desde\nel inicio de la formación.</p>\n<h3>Principales instrumentos\ny su función</h3>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 27%\"/>\n<col style=\"width: 39%\"/>\n<col style=\"width: 31%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Instrumento</strong></td>\n<td style=\"text-align: left;\"><strong>Qué mide</strong></td>\n<td style=\"text-align: left;\"><strong>Uso típico</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Báscula de cocina</td>\n<td style=\"text-align: left;\">Masa (gramos, kilogramos)</td>\n<td style=\"text-align: left;\">Pesar ingredientes sólidos con precisión;\nbase de panadería y pastelería.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Báscula de precisión</td>\n<td style=\"text-align: left;\">Masa en cantidades muy pequeñas (gramos y\nmiligramos)</td>\n<td style=\"text-align: left;\">Especias, levaduras, aditivos,\ngelificantes.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Jarra graduada</td>\n<td style=\"text-align: left;\">Volumen (mililitros, litros)</td>\n<td style=\"text-align: left;\">Líquidos: caldos, aceites, leche,\nagua.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Tazas y cucharas medidoras</td>\n<td style=\"text-align: left;\">Volumen estandarizado</td>\n<td style=\"text-align: left;\">Recetas de origen anglosajón; ajustes\nrápidos en cocina.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Termómetro de sonda</td>\n<td style=\"text-align: left;\">Temperatura interna</td>\n<td style=\"text-align: left;\">Verificar cocción segura en carnes; puntos\ncríticos en repostería (caramelo, chocolate).</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Termómetro láser / infrarrojo</td>\n<td style=\"text-align: left;\">Temperatura de superficie</td>\n<td style=\"text-align: left;\">Verificar temperatura de planchas,\nfreidoras y cámaras sin contacto.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Tamiz / colador fino</td>\n<td style=\"text-align: left;\">Textura y granulometría (no es un\ninstrumento de medida numérica, pero estandariza consistencia)</td>\n<td style=\"text-align: left;\">Cernir harinas, colar salsas y fondos para\nuniformidad.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Refractómetro</td>\n<td style=\"text-align: left;\">Concentración de azúcares (grados\nBrix)</td>\n<td style=\"text-align: left;\">Mermeladas, almíbares, control de calidad\nen repostería avanzada.</td>\n</tr>\n</tbody>\n</table>\n<h3>Calibración y mantenimiento</h3>\n<p>Un instrumento de medida solo es tan confiable como su calibración.\nLas básculas digitales, por ejemplo, deben verificarse periódicamente\ncon un peso patrón conocido, y \"ponerse en cero\" (tarar) cada vez que se\ncoloca un recipiente vacío antes de pesar su contenido. Un termómetro de\nsonda, por su parte, puede verificarse sumergiéndolo en agua con hielo\n(debe marcar 0°C) y en agua hirviendo a nivel del mar (debe marcar\n100°C); si se aleja de estas referencias, requiere calibración o\nreemplazo.</p>\n<p>Ignorar el mantenimiento de los instrumentos es una fuente silenciosa\nde errores: un cocinero puede seguir una receta al pie de la letra y aun\nasí obtener resultados inconsistentes si su báscula o su termómetro\nestán descalibrados.</p>\n<div class=\"recuerda\"><em>Un\ninstrumento descalibrado es peor que no medir en absoluto, porque genera\nuna falsa sensación de precisión. Verifica tus instrumentos\nperiódicamente.</em></div>\n<h3>Peso contra volumen: un\nerror común</h3>\n<p>Uno de los errores más frecuentes en cocineros en formación es medir\npor volumen ingredientes que deberían medirse por peso —el caso clásico\nes la harina—. Una taza de harina puede pesar distinto según qué tan\ncompacta esté, si se cernió antes o si se cucharea directamente del\ncostal, con variaciones de hasta un 20% en peso para el mismo volumen\naparente. Esta inconsistencia es especialmente crítica en panadería y\npastelería, donde las proporciones entre harina, líquido y agentes\nleudantes determinan directamente la textura final del producto.</p>\n<p>El mismo principio aplica a otros ingredientes de densidad variable:\nla miel, la mantequilla derretida y compactada, o el azúcar mascabado\napretado en su envase pueden variar significativamente en peso según\ncómo se midan por volumen. Por esta razón, la cocina profesional\nprioriza el peso sobre el volumen siempre que sea posible, reservando el\nvolumen para líquidos de densidad estable (agua, leche, aceite) y para\najustes finales donde la precisión extrema no es determinante.</p>\n<h3>Ejemplo\naplicado: verificar la calibración de una báscula digital</h3>\n<ol type=\"1\">\n<li><p>Colocar la báscula sobre una superficie plana y estable, y\nencenderla.</p></li>\n<li><p>Sin ningún objeto sobre la plataforma, verificar que marque\n0.0.</p></li>\n<li><p>Colocar un objeto de peso conocido y verificado (por ejemplo, un\npeso patrón de cocina o, en su defecto, un producto envasado con peso\ndeclarado y sellado) y comparar la lectura contra el peso real.</p></li>\n<li><p>Si la diferencia supera el margen de error aceptable del\nfabricante (normalmente ±1-2 gramos en básculas domésticas de cocina),\nla báscula requiere calibración según las instrucciones del manual o\ndebe reemplazarse.</p></li>\n</ol>\n<h3>AP y EP: dos\nformas de medir el mismo ingrediente</h3>\n<p>La Guía de Técnicas Culinarias, publicada por la Asociación de Chefs\ndel Ecuador en colaboración con WorldChefs y Nestlé Professional,\nintroduce una distinción que resulta indispensable para medir con\nexactitud en cocina profesional: la diferencia entre AP (\"as purchased\",\nel peso del producto tal como se compra, entero) y EP (\"edible portion\",\nel peso de la porción comestible después de limpiar, pelar o deshuesar).\nUn kilogramo de zanahoria AP no rinde un kilogramo de zanahoria EP,\nporque en el proceso se pierde el peso de la cáscara y las puntas (Guía\nde Técnicas Culinarias, WorldChefs/Nestlé Professional, 2018).</p>\n<p>Esta distinción importa directamente para la medición: cuando una\nficha técnica indica una cantidad, debe quedar claro si esa cantidad es\nAP o EP, porque de lo contrario un cocinero puede comprar y medir mal el\ningrediente necesario para una receta.</p>\n<div class=\"recuerda\"><em>AP = como se compra (entero); EP =\nporción comestible después de limpiar. Una ficha técnica bien hecha\nsiempre aclara cuál de las dos está midiendo.</em></div>\n<h3>Cortes\nde verduras estandarizados: medir también es cortar parejo</h3>\n<p>Medir no es solo pesar o calcular volumen: el tamaño y la forma de un\ncorte también son una medida, porque determinan el tiempo de cocción y\nla presentación final de un platillo. La cocina clásica estandarizó una\nfamilia de cortes de verduras que todo cocinero profesional debe\nreconocer a simple vista y ser capaz de ejecutar de forma pareja\n(Martínez de Flores Escobar y González-Garza, 2011):</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 71%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Corte</strong></td>\n<td style=\"text-align: center;\"><strong>Dimensión aproximada y\nuso</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Brunoise</td>\n<td style=\"text-align: center;\">Cubos de 2-3 mm; guarniciones finas,\nrellenos, mirepoix muy fino.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Small dice / macedonia fina</td>\n<td style=\"text-align: center;\">Cubos de 6 mm; salsas, sopas, mirepoix\nestándar.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Dice / cubos medianos</td>\n<td style=\"text-align: center;\">Cubos de 1.2 cm; guisos, salteados.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Julianne / juliana</td>\n<td style=\"text-align: center;\">Tiras finas de 3 x 3 x 40 mm; ensaladas,\nguarniciones crujientes, salteados rápidos.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Batonnet / bastón</td>\n<td style=\"text-align: center;\">Tiras de 6 x 6 x 6 cm; base para el\ncorte dado (dice), verduras al vapor.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Chiffonade</td>\n<td style=\"text-align: center;\">Tiras finas de hojas enrolladas y\ncortadas; hierbas y hojas verdes para terminar un platillo.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Paisana</td>\n<td style=\"text-align: center;\">Rombos o cuadros delgados de 1 cm; sopas\ny guisos rústicos.</td>\n</tr>\n</tbody>\n</table>\n<p>La consistencia del corte importa por una razón muy práctica: dos\npiezas del mismo alimento con tamaños distintos se cocinan a velocidades\ndistintas, así que un corte disparejo produce, casi siempre, un\nresultado disparejo —una pieza cruda junto a otra sobrecocida en el\nmismo plato.</p>\n<div class=\"recuerda\"><em>El\nobjetivo del corte estandarizado no es la elegancia visual por sí sola:\nes que todas las piezas terminen de cocinarse al mismo tiempo.</em></div>\n<h3>La\nreceta estándar: el formato profesional de documentación</h3>\n<p>La misma fuente describe el formato de \"receta estándar\" usado en\ncocina profesional para documentar de forma completa una preparación,\nque va más allá de listar ingredientes y pasos: incluye el nombre de la\nreceta, el peso por porción, el número de porciones que rinde, la\ncategoría del platillo, la cantidad y unidad de medida de cada\ningrediente, el procedimiento, y —en cocina institucional— el análisis\nnutricional por porción (calorías, grasas, proteínas, carbohidratos,\nsodio, entre otros) (Guía de Técnicas Culinarias, WorldChefs/Nestlé\nProfessional, 2018).</p>\n<p>Este formato también marca qué ingredientes son \"alimentos\npotencialmente peligrosos\" (identificados en la fuente con las siglas\nPHF/APP) que requieren control de tiempo y temperatura (CTT), y señala\nlos puntos de control crítico de cocción —por ejemplo, la temperatura\ninterna de 74°C para aves, coherente con la tabla revisada en el subtema\n1.4.</p>\n<h3>La\nestandarización de instrumentos en la historia de la industria\nalimentaria</h3>\n<p>La estandarización de instrumentos de medida en la cocina no ocurrió\nde forma aislada: acompañó a la industrialización de la producción de\nalimentos durante el siglo XX. A medida que las cocinas comerciales\ncrecieron en escala —hoteles, cadenas de restaurantes, servicios de\nbanquetes—, se volvió indispensable contar con instrumentos calibrados\nde forma consistente entre distintas sucursales y turnos de trabajo.\nEste mismo periodo vio también la estandarización de unidades\ncomerciales de venta de alimentos (por ejemplo, presentaciones de\nharina, azúcar o aceite en pesos fijos), lo que a su vez facilitó que\nlas cocinas profesionales pudieran planear sus compras y sus recetas con\nbase en unidades predecibles.</p>\n<h3>Unidades\npropias del oficio en cocina profesional</h3>\n<p>Además de gramos, mililitros y las unidades imperiales revisadas en\nel subtema 1.5, la cocina profesional utiliza convenciones propias que\nconviene reconocer desde ahora:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 27%\"/>\n<col style=\"width: 70%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Término</strong></td>\n<td style=\"text-align: left;\"><strong>Significado</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ración / porción</td>\n<td style=\"text-align: left;\">Cantidad estandarizada de un platillo\nservida a un comensal; se documenta en gramos u onzas en la ficha\ntécnica.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Rendimiento</td>\n<td style=\"text-align: left;\">Número total de porciones que produce una\nreceta con las cantidades indicadas.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Merma</td>\n<td style=\"text-align: left;\">Porcentaje de un ingrediente que se pierde\ndurante su preparación (pelado, deshuesado, recorte); se calcula para\najustar la compra real necesaria.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Punto (de cocción, de sazón)</td>\n<td style=\"text-align: left;\">Estado deseado de una preparación,\nverificable por temperatura, textura o sabor, según el caso — se retoma\ncon detalle en el subtema 1.4 y en el Bloque 3.</td>\n</tr>\n</tbody>\n</table>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 1.3</strong></p>\n<ul>\n<li><p>La estandarización de la medición es lo que permitió el paso de\nla cocina empírica a la cocina de producción a gran escala.</p></li>\n<li><p>Cada instrumento tiene un propósito específico: no son\nintercambiables entre sí.</p></li>\n<li><p>El termómetro de sonda es crítico tanto para seguridad\nalimentaria como para procesos de repostería.</p></li>\n<li><p>Medir por peso, no por volumen, es el estándar profesional para\ningredientes secos y de densidad variable como la harina, la miel o el\nazúcar mascabado.</p></li>\n<li><p>Un instrumento descalibrado genera errores sistemáticos difíciles\nde detectar; debe verificarse periódicamente.</p></li>\n</ul></div>\n\n"},
  "1.4": {"titulo": "Tablas de temperaturas y manuales de equipos", "html": "<h3>La ciencia\ndetrás de las tablas de temperatura</h3>\n<p>Las tablas de temperatura no son memorización arbitraria: cada rango\nnumérico responde a fenómenos físicos y microbiológicos concretos. Por\nun lado, el calor desnaturaliza las proteínas —las despliega de su forma\noriginal y las reorganiza—, lo que determina la textura final de una\ncarne, un huevo o un pescado. Por otro lado, la temperatura regula\ndirectamente la velocidad de reproducción de los microorganismos\npresentes en los alimentos, lo que convierte la temperatura en la\nprincipal herramienta de control de seguridad alimentaria disponible en\nuna cocina.</p>\n<p>Conocer estas tablas de memoria permite a un cocinero tomar\ndecisiones rápidas durante el servicio sin necesidad de consultar una\nreferencia cada vez, y es una de las competencias que con mayor\nfrecuencia se evalúan en certificaciones de manejo higiénico de\nalimentos a nivel internacional.</p>\n<h3>Zona de peligro y\nseguridad alimentaria</h3>\n<p>Entre 6°C y 65°C aproximadamente se ubica lo que se conoce como \"zona\nde peligro\": el rango de temperatura en el que las bacterias se\nmultiplican con mayor facilidad, llegando en condiciones óptimas a\nduplicar su población cada 20 minutos. Los alimentos no deben permanecer\nen ese rango por tiempo prolongado —la referencia general en manejo\nhigiénico es no más de dos horas acumuladas—, ya sea porque están mal\nrefrigerados, porque tardaron demasiado en alcanzar su temperatura de\ncocción segura, o porque se enfriaron con demasiada lentitud después de\ncocinados.</p>\n<p>El Manual Auxiliar de Cocina y Restauración de la Cámara de Comercio\nde España enmarca este control de temperatura dentro de un concepto más\namplio: la seguridad alimentaria abarca todas las condiciones y medidas\nnecesarias a lo largo de toda la cadena, desde la producción hasta que\nel alimento llega al consumidor final, no solo el momento de la cocción\n(Manual Auxiliar de Cocina y Restauración, Cámara de Comercio de\nEspaña). Esta visión de cadena completa es la misma lógica que sustenta\nel aprovisionamiento y la trazabilidad estudiados en el Bloque 2 de este\ncompendio.</p>\n<div class=\"recuerda\"><em>La regla de las dos horas: ningún\nalimento perecedero debe permanecer en la zona de peligro (6°C–65°C) por\nmás de dos horas acumuladas, sumando todo el tiempo que pasó fuera de\nrefrigeración o de cocción activa.</em></div>\n<h3>Temperaturas internas\nseguras de cocción</h3>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\"/>\n<col style=\"width: 48%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Alimento</strong></td>\n<td style=\"text-align: left;\"><strong>Temperatura interna mínima\nsegura</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Aves (pollo, pavo) enteras o molidas</td>\n<td style=\"text-align: left;\">74°C</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Carne molida (res, cerdo, cordero)</td>\n<td style=\"text-align: left;\">71°C</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Cortes enteros de res, cerdo, cordero\n(término medio)</td>\n<td style=\"text-align: left;\">63°C con 3 min de reposo</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Pescados y mariscos</td>\n<td style=\"text-align: left;\">63°C</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Huevo y preparaciones con huevo</td>\n<td style=\"text-align: left;\">71°C</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Sobras y recalentado</td>\n<td style=\"text-align: left;\">74°C</td>\n</tr>\n</tbody>\n</table>\n<p><em>Nota: estas cifras son de referencia general para formación\nbásica; en la práctica profesional deben verificarse contra la normativa\nsanitaria vigente de la localidad y del establecimiento.</em></p>\n<h3>Temperaturas de conservación</h3>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\"/>\n<col style=\"width: 48%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Proceso</strong></td>\n<td style=\"text-align: left;\"><strong>Rango de temperatura</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Refrigeración de alimentos\nperecederos</td>\n<td style=\"text-align: left;\">0°C a 4°C</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Congelación</td>\n<td style=\"text-align: left;\">-18°C o menor</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Mantenimiento en caliente (buffet, línea\nde servicio)</td>\n<td style=\"text-align: left;\">65°C o mayor</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Enfriamiento rápido tras cocción (de 65°C\na 21°C)</td>\n<td style=\"text-align: left;\">Máximo 2 horas</td>\n</tr>\n</tbody>\n</table>\n<h3>Puntos\ncríticos de temperatura en repostería: el caramelo</h3>\n<p>Un caso particularmente ilustrativo de por qué la temperatura importa\nmás allá de la seguridad alimentaria es la cocción del azúcar, donde\ncada rango de temperatura produce una textura completamente distinta al\nenfriarse. Este es un ejemplo clásico de cómo la temperatura, y no el\ntiempo ni la apariencia, es el criterio confiable para determinar el\npunto de una preparación:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 31%\"/>\n<col style=\"width: 23%\"/>\n<col style=\"width: 42%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Punto</strong></td>\n<td style=\"text-align: left;\"><strong>Temperatura</strong></td>\n<td style=\"text-align: left;\"><strong>Resultado al enfriar</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Hilo</td>\n<td style=\"text-align: left;\">110–112°C</td>\n<td style=\"text-align: left;\">Forma un hilo fino entre los dedos; usado\nen almíbares ligeros.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Bola blanda</td>\n<td style=\"text-align: left;\">112–116°C</td>\n<td style=\"text-align: left;\">Se forma una bola maleable en agua fría;\nbase de fondant y algunos merengues.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Bola dura</td>\n<td style=\"text-align: left;\">121–130°C</td>\n<td style=\"text-align: left;\">Bola firme pero flexible; usado en\ncaramelos masticables.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Quebradizo (caramelo)</td>\n<td style=\"text-align: left;\">150–160°C</td>\n<td style=\"text-align: left;\">Se endurece por completo al enfriar; usado\nen piezas decorativas y caramelo cristal.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Caramelo oscuro</td>\n<td style=\"text-align: left;\">165–180°C</td>\n<td style=\"text-align: left;\">Color ámbar oscuro, sabor amargo\npronunciado; usado en salsas de caramelo y flanes.</td>\n</tr>\n</tbody>\n</table>\n<h3>Manuales de equipos:\nleer antes de operar</h3>\n<p>Cada equipo de cocina —hornos, marmitas, freidoras, hornos combinados\nde vapor— documenta en su manual las capacidades y límites del aparato:\nrangos de temperatura alcanzables, tiempos de precalentado, capacidad\nmáxima de carga y programas de cocción disponibles. Leer el manual antes\nde usar un equipo nuevo no es un formalismo: evita accidentes, previene\ndaños al equipo y garantiza resultados consistentes.</p>\n<p>Un error frecuente en cocinas de formación es operar un equipo por\nensayo y error, replicando lo que se vio hacer a otra persona sin\nconocer los límites reales del aparato. Esto es particularmente riesgoso\nen equipos de alta potencia (freidoras, hornos combinados) donde un mal\nuso puede representar un riesgo de seguridad, además de invalidar la\ngarantía del fabricante en caso de daño por uso indebido.</p>\n<h3>Mantenimiento preventivo\ndel equipo</h3>\n<p>Además de leer el manual antes del primer uso, un equipo de cocina\nrequiere mantenimiento preventivo periódico: limpieza profunda según las\nindicaciones del fabricante, revisión de conexiones eléctricas o de gas,\ny calibración de sus controles de temperatura. Un horno cuyo control\ninterno no coincide con la temperatura real de su cámara —una situación\nmás común de lo que parece— puede arruinar sistemáticamente una\npreparación sin que el cocinero entienda por qué, si no verifica la\ntemperatura real con un termómetro independiente.</p>\n<h3>Tres\nreacciones químicas que todo cocinero debe reconocer</h3>\n<p>La temperatura no solo determina si un alimento es seguro para comer:\ntambién dispara reacciones químicas específicas responsables de gran\nparte del sabor, color y textura que asociamos con una buena cocina.\nReconocer estas reacciones —aunque su química detallada se estudie más a\nfondo en asignaturas posteriores de la carrera— ayuda a entender por qué\nciertos rangos de temperatura producen resultados tan distintos.</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 24%\"/>\n<col style=\"width: 20%\"/>\n<col style=\"width: 51%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Reacción</strong></td>\n<td style=\"text-align: left;\"><strong>Temperatura aprox.</strong></td>\n<td style=\"text-align: left;\"><strong>Qué produce</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Reacción de Maillard</td>\n<td style=\"text-align: left;\">140–165°C</td>\n<td style=\"text-align: left;\">Reacción entre aminoácidos y azúcares\nreductores; responsable del color dorado y el sabor tostado de carnes\nselladas, pan horneado y café tostado. No ocurre en presencia de exceso\nde agua en la superficie del alimento.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Caramelización</td>\n<td style=\"text-align: left;\">Desde ≈110°C</td>\n<td style=\"text-align: left;\">Descomposición térmica directa de los\nazúcares (sin intervención de proteínas); es la reacción detrás de la\ntabla de puntos del caramelo revisada en este mismo subtema.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Gelatinización del almidón</td>\n<td style=\"text-align: left;\">60–70°C</td>\n<td style=\"text-align: left;\">Los gránulos de almidón absorben agua y se\nhinchan de forma irreversible; es lo que espesa una salsa ligada con\nharina o fécula, y lo que da textura a un arroz o una pasta bien\ncocidos.</td>\n</tr>\n</tbody>\n</table>\n<p>Comprender estas tres reacciones explica, por ejemplo, por qué una\ncarne mal secada antes de sellarse no dora correctamente (el exceso de\nhumedad en la superficie enfría la sartén e impide que se alcance la\ntemperatura de Maillard), o por qué una salsa espesada con harina cruda\nsabe \"a crudo\" si no se cocina el tiempo suficiente para completar la\ngelatinización del almidón.</p>\n<div class=\"recuerda\"><em>La reacción de Maillard requiere una\nsuperficie relativamente seca y temperatura alta; por eso una carne\nhúmeda no dora bien hasta que se evapora el exceso de agua de su\nsuperficie.</em></div>\n\n"},
  "1.5": {"titulo": "Unidades y pesos", "html": "<h3>Breve historia\nde la estandarización de unidades</h3>\n<p>El sistema métrico decimal, adoptado oficialmente en Francia a\nfinales del siglo XVIII y extendido después a la mayor parte del mundo\n—incluido México—, buscaba resolver un problema práctico: la enorme\nvariedad de unidades de medida locales, que dificultaba el comercio, la\nciencia y, por supuesto, la cocina. Antes de su adopción, cada región e\nincluso cada gremio podía usar sus propias referencias de peso y\nvolumen, lo que hacía prácticamente imposible replicar una receta\nescrita en otro lugar.</p>\n<p>La gastronomía internacional, sin embargo, no adoptó el sistema\nmétrico de manera uniforme: países de tradición anglosajona —Estados\nUnidos, en particular— conservan el sistema imperial (onzas, libras,\ntazas) tanto en su vida cotidiana como en su bibliografía culinaria.\nComo resultado, un cocinero formado en un entorno de habla hispana debe\npoder moverse con soltura entre ambos sistemas, ya que gran parte de la\nliteratura técnica, el equipo importado y las certificaciones\ninternacionales utilizan referencias imperiales.</p>\n<h3>Tabla de conversión básica</h3>\n<p>Las siguientes equivalencias siguen las conversiones documentadas en\nla Guía de Técnicas Culinarias (WorldChefs/Nestlé Professional,\n2018):</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 32%\"/>\n<col style=\"width: 32%\"/>\n<col style=\"width: 32%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Medida</strong></td>\n<td style=\"text-align: left;\"><strong>Equivalencia métrica</strong></td>\n<td style=\"text-align: left;\"><strong>Uso común</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">1 onza (oz)</td>\n<td style=\"text-align: left;\">28 g</td>\n<td style=\"text-align: left;\">Ingredientes secos, porciones\npequeñas</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1 libra (lb)</td>\n<td style=\"text-align: left;\">454 g (= 16 oz)</td>\n<td style=\"text-align: left;\">Carnes, harinas, azúcar</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">1 kilogramo (kg)</td>\n<td style=\"text-align: left;\">2.2 lb</td>\n<td style=\"text-align: left;\">Conversión inversa métrico → imperial</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1 onza líquida (fl oz)</td>\n<td style=\"text-align: left;\">30 ml</td>\n<td style=\"text-align: left;\">Líquidos en recetarios anglosajones</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">1 litro (l)</td>\n<td style=\"text-align: left;\">33.8 fl oz</td>\n<td style=\"text-align: left;\">Conversión inversa métrico → imperial</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1 galón (gal)</td>\n<td style=\"text-align: left;\">3.8 l</td>\n<td style=\"text-align: left;\">Compras de líquidos a granel</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">1 cuarto de galón (qt)</td>\n<td style=\"text-align: left;\">0.95 l</td>\n<td style=\"text-align: left;\">Recetarios de origen estadounidense</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">°Fahrenheit → °Celsius</td>\n<td style=\"text-align: left;\">(°F − 32) ÷ 1.8</td>\n<td style=\"text-align: left;\">Recetarios y hornos de origen\nestadounidense</td>\n</tr>\n</tbody>\n</table>\n<p>Nota: las conversiones US/métricas son aproximadas por convención de\nla industria, no exactas al decimal (Guía de Técnicas Culinarias,\nWorldChefs/Nestlé Professional, 2018).</p>\n<h3>Unidades\ndel oficio: cuando la precisión cede el paso a la experiencia</h3>\n<p>Existen además unidades propias del oficio que no son de peso ni\nvolumen estricto: la \"pizca\", el \"punto\", la \"cucharada al gusto\". Estas\ndependen de la experiencia del cocinero más que de una medida exacta, y\nson perfectamente válidas en ajustes finales de sabor. Sin embargo, no\nson recomendables en procesos que requieren precisión absoluta\n—panadería, pastelería, coctelería de precisión— donde una variación\nmínima altera de forma notable el resultado final.</p>\n<div class=\"recuerda\"><em>Las medidas 'al gusto' son una\nherramienta legítima de sazón final, no una excusa para no medir en\nprocesos donde la precisión determina el resultado (panadería,\npastelería, salsas emulsionadas).</em></div>\n<h3>Fichas técnicas: la\nestandarización aplicada</h3>\n<p>La herramienta que traduce todo lo anterior en consistencia real\ndentro de una cocina de producción es la ficha técnica (también llamada\nreceta estándar). Una ficha técnica documenta, para cada platillo, los\ningredientes con sus cantidades exactas en peso o volumen estandarizado,\nel procedimiento paso a paso, el rendimiento (número de porciones), el\ncosto por porción y, frecuentemente, una fotografía de referencia del\nmontaje final.</p>\n<p>Una ficha técnica bien construida permite que cualquier cocinero\ncapacitado en la cocina —no solo quien creó originalmente la receta—\npueda reproducir el platillo con el mismo resultado. Es, en cierto\nsentido, la culminación práctica de todo lo estudiado en este bloque: el\ngénero correcto, la secuencia de elaboración, los instrumentos de medida\nprecisos, las temperaturas correctas y las unidades estandarizadas, todo\ndocumentado en un solo formato reutilizable.</p>\n<h3>Elementos mínimos de una\nficha técnica</h3>\n<ul>\n<li><p>Nombre del platillo y género al que pertenece</p></li>\n<li><p>Lista de ingredientes con cantidad exacta (peso o volumen\nestandarizado)</p></li>\n<li><p>Procedimiento numerado, paso a paso</p></li>\n<li><p>Rendimiento (número de porciones) y tamaño de porción</p></li>\n<li><p>Temperatura y tiempo de cocción, cuando aplique</p></li>\n<li><p>Costo estimado por porción (se profundiza en asignaturas\nposteriores de costos y negocios gastronómicos)</p></li>\n<li><p>Notas de presentación o montaje</p></li>\n</ul>\n<h3>Factor de\nconversión: ajustar el rendimiento de una receta</h3>\n<p>Una de las aplicaciones más prácticas de trabajar con unidades\nestandarizadas es poder ajustar una receta a un número distinto de\nporciones sin perder las proporciones originales. La Guía de Técnicas\nCulinarias (WorldChefs/Nestlé Professional, 2018) documenta la fórmula\ndel factor de conversión (FC), que se calcula así:</p>\n<p>FC = (número de porciones deseadas × peso de la porción deseada) ÷\n(número de porciones de la receta estándar × peso de la porción\nestándar)</p>\n<p>Por ejemplo: si una receta estándar rinde 50 porciones de 240 g cada\nuna, y se necesita ajustarla para 120 porciones de 145 g, el cálculo\nsería: FC = (120 × 145) ÷ (50 × 240) = 17,400 ÷ 12,000 = 1.45. Ese\nfactor (1.45) se multiplica después por cada ingrediente de la receta\noriginal para obtener las nuevas cantidades ajustadas (Guía de Técnicas\nCulinarias, WorldChefs/Nestlé Professional, 2018).</p>\n<div class=\"recuerda\"><em>El factor\nde conversión (FC) permite escalar cualquier receta hacia arriba o hacia\nabajo sin perder sus proporciones — es la herramienta que usa la cocina\nde producción para ajustar un platillo de 50 a 500 porciones sin volver\na calcular todo desde cero.</em></div>\n<h3>Ejemplo\naplicado: ficha técnica de una vinagreta básica</h3>\n<p>Para ilustrar cómo se documentan estos elementos en la práctica, la\nsiguiente tabla muestra una ficha técnica simplificada:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 58%\"/>\n<col style=\"width: 39%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>VINAGRETA CLÁSICA</strong></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Rendimiento</strong></td>\n<td>≈ 250 ml (10 porciones de 25 ml)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Ingrediente</strong></td>\n<td><strong>Cantidad</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Aceite de oliva</td>\n<td>180 ml</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Vinagre de vino tinto</td>\n<td>60 ml</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Mostaza Dijon</td>\n<td>10 g</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Sal</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Pimienta negra molida</td>\n<td>1 g</td>\n</tr>\n</tbody>\n</table>\n<p>Procedimiento: 1) Colocar la mostaza, el vinagre, la sal y la\npimienta en un tazón y mezclar con batidor globo. 2) Incorporar el\naceite en hilo delgado y constante mientras se bate, hasta lograr una\nemulsión homogénea. 3) Rectificar sazón. 4) Conservar en refrigeración\nhasta 5 días en recipiente cerrado, agitando antes de usar.</p>\n<p>Nótese que cada ingrediente está en peso o volumen estandarizado\n—nunca \"al gusto\"—, lo que permite que cualquier alumno que siga esta\nficha obtenga el mismo resultado, sin importar su nivel de experiencia\nprevio.</p>\n<h3>La estandarización\nde unidades y el costeo</h3>\n<p>Un beneficio adicional de trabajar con unidades y pesos\nestandarizados —que se estudiará con mayor profundidad en asignaturas de\ncostos y negocios gastronómicos más adelante en la carrera— es que hace\nposible calcular el costo exacto de cada porción. Si una ficha técnica\nindica que una preparación usa 180 ml de aceite de oliva, y se conoce el\ncosto por litro de ese aceite, es posible calcular el costo exacto de\nese ingrediente dentro del platillo. Sin unidades estandarizadas, este\ncálculo sería imposible, y el establecimiento no podría fijar un precio\nde venta con certeza sobre su margen de utilidad. La precisión en la\nmedición, entonces, no es solo una cuestión de consistencia en el sabor:\nes también la base de la viabilidad financiera de cualquier negocio\ngastronómico.</p>\n<h3>Estandarización\ny consistencia en cocina de producción</h3>\n<p>Estandarizar las unidades usadas en una cocina —mediante fichas\ntécnicas y un recetario interno— es lo que permite que una preparación\nsalga igual sin importar quién la prepare. Este principio es central en\ncocina de producción, cadenas de restaurantes y franquicias, donde la\nconsistencia del producto es, junto con el sabor, uno de los pilares de\nla marca. Un comensal que visita dos sucursales distintas de un mismo\nrestaurante espera —con razón— recibir el mismo platillo, con el mismo\nsabor y la misma presentación, y eso solo es posible cuando la\nestandarización de unidades, temperaturas y procedimientos está\ndocumentada y se sigue de manera consistente.</p>\n<h3>Un puente\nhacia el Bloque 2: fondos y salsas madre</h3>\n<p>Todo lo aprendido en este bloque —géneros, secuencia de elaboración,\ninstrumentos, temperaturas, unidades y fichas técnicas— converge en las\nllamadas elaboraciones base de la cocina clásica: los fondos y las\nsalsas madre. Un fondo es un líquido saborizado, obtenido al cocer a\nfuego lento huesos, vegetales y aromáticos en agua, que sirve como base\nlíquida para sopas, salsas y guisos. Las salsas madre son las cinco\npreparaciones fundamentales de las que derivan, por adición de otros\ningredientes, la inmensa mayoría de las salsas de la cocina occidental\n(Martínez de Flores Escobar y González-Garza, 2011):</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 71%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Salsa madre</strong></td>\n<td style=\"text-align: center;\"><strong>Base y una derivada\nconocida</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Béchamel</td>\n<td style=\"text-align: center;\">Leche + roux blanco → Mornay (con\nqueso)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Velouté</td>\n<td style=\"text-align: center;\">Fondo claro + roux rubio → Suprema (con\ncrema)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Española</td>\n<td style=\"text-align: center;\">Fondo oscuro + roux oscuro →\nDemi-glace</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Holandesa</td>\n<td style=\"text-align: center;\">Yema + mantequilla clarificada →\nBearnesa (con estragón)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Tomate</td>\n<td style=\"text-align: center;\">Jitomate cocido y reducido → Salsa\nboloñesa</td>\n</tr>\n</tbody>\n</table>\n<p>Estas cinco salsas y sus fondos correspondientes se estudiarán con\ntécnica y práctica en el Bloque 3 (Desarrollo de habilidades para la\ncocina); aquí basta con reconocer que son, literalmente, unidades y\nproporciones estandarizadas —un roux es siempre una proporción fija de\ngrasa y harina— aplicadas a la elaboración más clásica de la cocina\nprofesional. Es la prueba más clara de que la estandarización no es un\ntema abstracto: es la razón por la que una salsa madre sabe igual en\ncualquier cocina del mundo que la prepare con el método correcto.</p>\n<div class=\"puntosclave\"><p><strong>Puntos clave del subtema 1.5</strong></p>\n<ul>\n<li><p>El sistema métrico decimal es el estándar en cocina profesional;\nel sistema imperial se usa en bibliografía y equipos de origen\nanglosajón.</p></li>\n<li><p>Las unidades de \"al gusto\" son válidas para ajustes finales, no\npara procesos que exigen precisión (panadería, pastelería).</p></li>\n<li><p>La ficha técnica es la herramienta que traduce la estandarización\nen consistencia real: ingredientes, procedimiento, rendimiento y costo\ndocumentados.</p></li>\n<li><p>La estandarización de unidades mediante fichas técnicas es lo que\ngarantiza consistencia en cocina de producción y cadenas de\nrestaurantes.</p></li>\n</ul></div>\n\n"},
  "2.1": {"titulo": "Aprovisionamiento de materias primas", "html": "<h3>Del mercado\nlocal a la cadena de suministro global</h3>\n<p>Durante la mayor parte de la historia de la cocina, el\naprovisionamiento fue un asunto estrictamente local: un cocinero\ncompraba lo que el mercado de su ciudad ofrecía ese día, y el menú se\nadaptaba a esa disponibilidad. La cocina de temporada no era una\nfilosofía de moda, sino la única opción posible.</p>\n<p>La refrigeración industrial, el transporte aéreo de alimentos\nperecederos y la globalización del comercio alimentario cambiaron\nradicalmente ese panorama a lo largo del siglo XX: hoy es posible\nconseguir casi cualquier ingrediente en casi cualquier época del año, en\ncasi cualquier parte del mundo. Este cambio trajo enormes ventajas\n—previsibilidad, variedad, escalabilidad— pero también generó una\ndesconexión entre el cocinero y el origen real de sus insumos, y con\nella, riesgos de calidad y trazabilidad que la cocina profesional debe\ngestionar activamente (Monroy de Sada, 2012).</p>\n<h3>El ciclo de compras\nen cocina profesional</h3>\n<p>El aprovisionamiento no es un evento aislado (\"ir de compras\"), sino\nun ciclo con etapas definidas que se repite constantemente en cualquier\ncocina de producción:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 15%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 56%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Etapa</strong></td>\n<td style=\"text-align: left;\"><strong>Nombre</strong></td>\n<td style=\"text-align: left;\"><strong>Qué ocurre</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">1</td>\n<td style=\"text-align: left;\">Especificación</td>\n<td style=\"text-align: left;\">Se define con precisión qué se necesita:\nvariedad, calibre, grado de frescura, cantidad, presentación.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">2</td>\n<td style=\"text-align: left;\">Cotización y selección</td>\n<td style=\"text-align: left;\">Se comparan proveedores por precio,\ncalidad, consistencia y capacidad de entrega.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">3</td>\n<td style=\"text-align: left;\">Orden de compra</td>\n<td style=\"text-align: left;\">Se formaliza el pedido, idealmente por\nescrito, con cantidades y fecha de entrega precisas.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">4</td>\n<td style=\"text-align: left;\">Recepción</td>\n<td style=\"text-align: left;\">Se verifica que lo entregado corresponda a\nlo pedido, en calidad, cantidad y condición.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">5</td>\n<td style=\"text-align: left;\">Almacenamiento</td>\n<td style=\"text-align: left;\">Se guarda de inmediato en las condiciones\ncorrectas, aplicando rotación de inventario.</td>\n</tr>\n</tbody>\n</table>\n<h3>Criterios de selección de\nproveedores</h3>\n<p>Elegir un proveedor no debería basarse únicamente en el precio más\nbajo. Un proveedor confiable se evalúa en al menos cuatro dimensiones:\nla calidad consistente de su producto (que no varíe de una entrega a\notra), su capacidad de cumplir tiempos de entrega, sus condiciones\nsanitarias verificables, y su disposición a proporcionar documentación\nde trazabilidad —de dónde viene el producto y por qué manos ha pasado—.\nUn precio bajo que sacrifica cualquiera de estos elementos termina\ncostando más caro, ya sea en producto desperdiciado, en riesgo sanitario\no en inconsistencia del menú.</p>\n<div class=\"recuerda\"><em>El\nproveedor más barato no siempre es el más económico: un producto\ninconsistente genera mermas, retrabajos y platillos rechazados que\ncuestan más que la diferencia de precio.</em></div>\n<h3>Recepción\nde mercancía: el punto de control más importante</h3>\n<p>La recepción es el último momento en que la cocina tiene control real\nsobre la calidad del insumo antes de que entre a producción. Un\nprotocolo de recepción riguroso revisa, como mínimo:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 27%\"/>\n<col style=\"width: 70%\"/>\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Categoría</strong></td>\n<td style=\"text-align: left;\"><strong>Qué se verifica al\nrecibir</strong></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Carnes y aves</td>\n<td style=\"text-align: left;\">Temperatura ≤4°C (o congelado según\nespecificación), color característico, ausencia de olores extraños,\nempaque íntegro, fecha de empaque/caducidad.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Pescados y mariscos</td>\n<td style=\"text-align: left;\">Ojos brillantes y abombados (pescado\nentero), carne firme al tacto, olor a mar (nunca amoniacal), hielo en\ncantidad suficiente si aplica.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Lácteos</td>\n<td style=\"text-align: left;\">Temperatura de refrigeración, empaque sin\nhinchazón, fecha de caducidad vigente, ausencia de separación\nanormal.</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Frutas y verduras</td>\n<td style=\"text-align: left;\">Firmeza según variedad, ausencia de golpes\no pudrición, color y madurez adecuados al uso previsto, sin plagas\nvisibles.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Abarrotes / secos</td>\n<td style=\"text-align: left;\">Empaque sellado sin roturas, ausencia de\nhumedad o plagas, fecha de caducidad, cantidad exacta contra\nremisión.</td>\n</tr>\n</tbody>\n</table>\n<h3>FIFO y FEFO: rotación de\ninventario</h3>\n<p>Una vez que la mercancía pasa la recepción, debe almacenarse\naplicando un principio de rotación que evite que el producto más antiguo\nse quede olvidado al fondo de la cámara mientras se usa primero el más\nreciente. Dos siglas resumen este principio: FIFO (\"first in, first out\"\n— primero en entrar, primero en salir) organiza el almacenamiento por\norden de llegada; FEFO (\"first expired, first out\" — primero en caducar,\nprimero en salir) es una variante más precisa que prioriza la fecha de\ncaducidad real del producto, que no siempre coincide exactamente con el\norden de llegada.</p>\n<div class=\"recuerda\"><em>FEFO es\nmás preciso que FIFO cuando dos lotes del mismo producto tienen fechas\nde caducidad distintas — lo que importa es qué caduca primero, no qué\nllegó primero.</em></div>\n<h3>Ejemplo\naplicado: recepción de un pedido con hallazgos</h3>\n<p>Un cocinero recibe un pedido de 10 kg de filete de pescado blanco. Al\nrevisar: la temperatura del hielo marca 3°C (dentro de rango), pero dos\nde las diez bolsas presentan un olor ligeramente amoniacal y la carne se\nsiente blanda al presionar con el dedo —señal de descomposición\nincipiente—. El protocolo correcto no es aceptar todo el pedido ni\nrechazarlo completo: se documenta el hallazgo con fotografía, se separan\nfísicamente las dos bolsas comprometidas, se rechazan solo esas\n(anotándolo en la remisión con firma del repartidor), y se acepta el\nresto verificando que cumpla los criterios de la tabla anterior.</p>\n<h3>Trazabilidad:\nseguir el rastro de un ingrediente</h3>\n<p>La trazabilidad es la capacidad de reconstruir, paso a paso, el\nrecorrido completo de un ingrediente desde su origen hasta el plato: en\nqué granja o predio se produjo, en qué fecha, por qué planta procesadora\npasó, en qué lote se empacó, y por qué distribuidores circuló antes de\nllegar a la cocina. Esta información se documenta mediante números de\nlote, fechas de producción y certificados sanitarios que acompañan al\nproducto en cada etapa de su cadena de suministro.</p>\n<p>La trazabilidad no es un formalismo burocrático: es la herramienta\nque permite, ante una alerta sanitaria (por ejemplo, un brote de\nsalmonela vinculado a un lote específico de huevo), identificar con\nprecisión qué producto retirar del servicio sin necesidad de desechar\ntodo el inventario de ese ingrediente. Una cocina que no conserva la\ninformación de lote y fecha de sus insumos queda, ante ese escenario,\nsin más opción que desechar todo lo que tenga en existencia — con el\ncosto y el riesgo que eso implica.</p>\n<div class=\"recuerda\"><em>Conservar\nel número de lote y la fecha de cada entrega no es solo control\nadministrativo: es lo que permite reaccionar con precisión —y no a\nciegas— ante una alerta sanitaria.</em></div>\n<h3>Planeación del\nmenú alrededor de la temporada</h3>\n<p>El aprovisionamiento eficiente no empieza en la orden de compra:\nempieza en el diseño del menú. Un menú planeado con conocimiento de las\ntemporadas locales permite comprar mejor materia prima, a mejor precio,\ny con menor riesgo de desabasto que un menú que exige ingredientes fuera\nde su temporada natural durante todo el año.</p>\n<p>En la región de Campeche, por ejemplo, existen ventanas de temporada\nbien identificadas para varios productos del Golfo: el camarón alcanza\nsu mejor momento de frescura y abundancia en ciertos meses del año, y lo\nmismo ocurre con el pulpo, cuya captura sigue patrones estacionales\npropios. Un menú que aprovecha esas ventanas —camarón fresco de\ntemporada en vez de camarón congelado importado fuera de temporada— no\nsolo mejora la calidad del platillo: normalmente también reduce el\ncosto, porque la abundancia estacional de un producto local tiende a\nbajar su precio frente a la escasez de temporada baja.</p>\n<p>El mismo razonamiento aplica a frutas y verduras, cuya calidad,\nprecio y disponibilidad varían de forma marcada según la época del año y\nla región. Un cocinero que conoce el calendario de temporadas de su zona\npuede planear un menú flexible —con secciones que cambian según lo que\nesté en su mejor punto— en vez de un menú fijo que obliga a comprar\nfuera de temporada de forma constante.</p>\n<h3>La filosofía de\ncompra: elegir, no solo recibir</h3>\n<p>Existe una diferencia real entre \"comprar\" en el sentido p
