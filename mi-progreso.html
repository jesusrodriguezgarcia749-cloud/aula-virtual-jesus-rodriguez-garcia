<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Progreso — Aula Virtual JRG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #f2ece1; color: #17140f; min-height: 100vh; }
  header { background: #17140f; color: #f2ece1; padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  header a { color: #f2ece1; text-decoration: none; font-size: 1.4rem; margin-right: 8px; }
  header h1 { font-size: 1.1rem; }
  header .subtexto { font-size: 0.78rem; color: #cfc6b6; margin-top: 2px; }
  main { padding: 20px; max-width: 700px; margin: 0 auto; }

  label { display: block; font-size: 0.85rem; color: #6b6252; margin-bottom: 4px; margin-top: 16px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #cfc6b6; font-family: inherit; font-size: 1rem; background: #fff;
  }
  button {
    background: #d99a3d; color: #17140f; border: none;
    padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 0.95rem; cursor: pointer;
  }
  .btn-principal { width: 100%; margin-top: 16px; }
  .btn-secundario { background: none; border: 1px solid #6b6252; color: #6b6252; width: 100%; margin-top: 10px; }
  .btn-salir {
    margin-left: auto; margin-right: 56px; background: none; border: 1px solid #d99a3d; color: #d99a3d;
    padding: 8px 14px; font-size: 0.8rem; white-space: nowrap;
  }

  .texto-ayuda { color: #6b6252; font-size: 0.9rem; line-height: 1.5; margin: 6px 0 14px; }
  .mensaje-error { color: #b04a3a; font-size: 0.88rem; margin-top: 8px; display: none; }
  .cargando { text-align: center; color: #6b6252; padding: 60px 0; }

  .saludo { font-size: 1.1rem; margin-bottom: 18px; }

  section.tarjeta {
    background: #fff; border: 1px solid #e2d9c6; border-radius: 12px;
    padding: 18px; margin-bottom: 18px;
  }
  section.tarjeta h2 { font-size: 1.05rem; margin-bottom: 12px; }
  section.tarjeta h2 small { display: block; font-weight: normal; font-size: 0.78rem; color: #6b6252; margin-top: 2px; }

  h3.nombre-bloque {
    font-size: 0.85rem; color: #b5772a; text-transform: uppercase; letter-spacing: 0.5px;
    margin: 16px 0 8px;
  }
  h3.nombre-bloque:first-of-type { margin-top: 0; }

  .fila-simple {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0; border-bottom: 1px solid #f2ece1; font-size: 0.92rem;
  }
  .fila-simple:last-child { border-bottom: none; }
  .fila-simple .valor { color: #4a4030; white-space: nowrap; }

  .item-entrega {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 9px 0; border-bottom: 1px solid #f2ece1; font-size: 0.9rem;
  }
  .item-entrega:last-child { border-bottom: none; }
  .item-entrega .icono-estado { flex-shrink: 0; width: 20px; text-align: center; }
  .item-entrega .detalle-item { flex: 1; }
  .item-entrega .fecha-item { color: #a89f8d; font-size: 0.78rem; }
  .item-entrega .estado-item { white-space: nowrap; font-size: 0.85rem; font-weight: bold; }
  .estado-pendiente { color: #a89f8d; }
  .estado-entregado { color: #6a9955; }

  .subtotal-bloque {
    display: flex; justify-content: space-between; background: #f2ece1;
    border-radius: 8px; padding: 10px 12px; margin: 10px 0 4px; font-size: 0.88rem; font-weight: bold;
  }

  details.desglose-detalle { margin-top: 6px; }
  details.desglose-detalle summary {
    cursor: pointer; color: #b5772a; font-size: 0.85rem; padding: 6px 0; list-style: none;
  }
  details.desglose-detalle summary::-webkit-details-marker { display: none; }
  details.desglose-detalle summary::before { content: '▸ '; }
  details.desglose-detalle[open] summary::before { content: '▾ '; }
  details.desglose-detalle .contenido-desglose { padding: 6px 0 0 12px; }

  .caja-acumulado {
    background: #17140f; color: #f2ece1; border-radius: 10px; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center; margin: 12px 0 10px;
  }
  .caja-acumulado .num { color: #d99a3d; font-weight: bold; font-size: 1.05rem; }
  .nota-equivalencia {
    background: #ece2cd; border-radius: 8px; padding: 10px 12px; font-size: 0.82rem;
    color: #4a4030; line-height: 1.5; margin-bottom: 4px;
  }
  .nota-equivalencia .pct { font-weight: bold; color: #b5772a; }

  .fila-calif-bloque {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid #f2ece1;
  }
  .fila-calif-bloque:last-of-type { border-bottom: none; }
  .fila-calif-bloque .valor { font-weight: bold; }
  .fila-rubro-mini {
    display: flex; justify-content: space-between; font-size: 0.85rem;
    padding: 5px 0; color: #4a4030;
  }

  .aviso-item { padding: 10px 0; border-bottom: 1px solid #f2ece1; font-size: 0.9rem; }
  .aviso-item:last-child { border-bottom: none; }
  .aviso-item .fecha-aviso { color: #a89f8d; font-size: 0.78rem; display: block; margin-top: 2px; }
  .vacio-seccion { color: #a89f8d; font-size: 0.88rem; text-align: center; padding: 6px 0; }

  .leyenda-asistencia { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.85rem; color: #4a4030; margin: 8px 0 12px; }
  .leyenda-asistencia .punto-leyenda { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .grid-dias-asistencia { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip-dia-asistencia {
    color: #fff; border-radius: 8px; padding: 8px 10px; text-align: center;
    font-size: 0.8rem; min-width: 58px;
  }
  .chip-dia-asistencia .fecha-chip { font-weight: bold; }
  .chip-dia-asistencia .valor-chip { font-size: 0.75rem; opacity: 0.9; }

  footer.pie-progreso { text-align: center; color: #a89f8d; font-size: 0.78rem; padding: 10px 0 40px; }
</style>
</head>
<body>

<div id="pantallaLogin">
  <header><h1>Mi Progreso</h1></header>
  <main>
    <h2 style="margin-bottom:6px;">Consulta tu avance</h2>
    <p class="texto-ayuda">Ingresa tu nombre completo y tu PIN para ver tu calificación por bloque.</p>
    <label>Nombre completo</label>
    <input id="inputNombreAlumno" type="text" placeholder="Nombre y apellido">
    <label>PIN</label>
    <input id="inputPinAlumno" type="text" inputmode="numeric" placeholder="4 dígitos" maxlength="4">
    <button class="btn-principal" id="btnEntrarProgreso">Ver mi progreso</button>
    <div id="mensajeErrorLogin" class="mensaje-error"></div>
  </main>
</div>

<div id="pantallaProgreso" style="display:none;">
  <header>
    <a href="index.html">←</a>
    <div>
      <h1>Bases Culinarias</h1>
      <div class="subtexto">Aula Virtual · Panel personal del alumno</div>
    </div>
    <button class="btn-salir" id="btnCerrarSesionProgreso">Salir</button>
  </header>
  <main>
    <div id="contenidoProgreso"><div class="cargando">Cargando…</div></div>
  </main>
</div>

<script>
const CLAVE_SESION = 'jrg_progreso_sesion';
let db = null, fx = {};

const NOMBRES_BLOQUE = {
  '1': 'Conceptos y definiciones de cocina',
  '2': 'Conocimiento y manipulación de materias primas',
  '3': 'Desarrollo de habilidades para la cocina',
};

const TEMAS_SEMANA = {
  '1': ['Géneros y Estructura Clásica', 'Secuencia Operativa', 'Rendimiento y Merma', 'Termodinámica y Sanidad', 'Escalabilidad — Micro-Ensayo 1'],
  '2': ['Aprovisionamiento', 'Propiedades Funcionales', 'Grasas y Aceites', 'Variedades Físicas y Scoville', 'Cualidades Gastronómicas — Micro-Ensayo 2'],
  '3': ['Técnicas de Cocción', 'Destrezas con Proteínas', 'Cortes Clásicos', 'Semillas y Cereales', 'Hierbas y Especias — Micro-Ensayo 3'],
};

const RUBROS = [
  { clave: 'participacion', label: 'Participación', max: 20 },
  { clave: 'ensayos', label: 'Ensayos', max: 30 },
  { clave: 'practicas', label: 'Prácticas', max: 10 },
  { clave: 'asistencia', label: 'Asistencia', max: 10 },
  { clave: 'examen', label: 'Examen', max: 30 },
];

const ESTADOS_ASISTENCIA_LABEL = {
  presente: 'Presente', retardo: 'Retardo', justificado: 'Justificado', falta: 'Falta',
};
const ESTADOS_ASISTENCIA_COLOR = {
  presente: '#6a9955', justificado: '#4a7ab0', retardo: '#d99a3d', falta: '#b04a3a',
};

(async () => {
  try {
    const fbConfig = await import('./firebase-config.js');
    const firestoreMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    db = fbConfig.db;
    fx = firestoreMod;

    const sesionGuardada = localStorage.getItem(CLAVE_SESION);
    if (sesionGuardada) {
      mostrarPantallaProgreso(JSON.parse(sesionGuardada));
    }
  } catch (err) {
    document.getElementById('contenidoProgreso').innerHTML =
      '<p class="texto-ayuda">No se pudo conectar: ' + err.message + '</p>';
  }
})();

document.getElementById('btnEntrarProgreso').onclick = async () => {
  const nombre = document.getElementById('inputNombreAlumno').value.trim();
  const pin = document.getElementById('inputPinAlumno').value.trim();
  const mensajeError = document.getElementById('mensajeErrorLogin');
  mensajeError.style.display = 'none';

  if (!nombre || !pin) {
    mensajeError.textContent = 'Escribe tu nombre y tu PIN.';
    mensajeError.style.display = 'block';
    return;
  }
  if (!db) {
    mensajeError.textContent = 'Aún no hay conexión, espera un momento e intenta de nuevo.';
    mensajeError.style.display = 'block';
    return;
  }

  try {
    const q = fx.query(
      fx.collectionGroup(db, 'alumnos'),
      fx.where('nombre', '==', nombre),
      fx.where('pin', '==', pin)
    );
    const snap = await fx.getDocs(q);
    if (snap.empty) {
      mensajeError.textContent = 'No encontramos ese nombre y PIN. Verifica con tu profesor.';
      mensajeError.style.display = 'block';
      return;
    }
    const docAlumno = snap.docs[0];
    const segmentos = docAlumno.ref.path.split('/');
    const materia = segmentos[1];
    const grupo = segmentos[3];
    const datosSesion = { alumnoId: docAlumno.id, nombre: docAlumno.data().nombre, materia, grupo };
    localStorage.setItem(CLAVE_SESION, JSON.stringify(datosSesion));
    mostrarPantallaProgreso(datosSesion);
  } catch (err) {
    mensajeError.textContent = 'Ocurrió un error al buscar tus datos: ' + err.message;
    mensajeError.style.display = 'block';
  }
};

document.getElementById('btnCerrarSesionProgreso').onclick = () => {
  localStorage.removeItem(CLAVE_SESION);
  document.getElementById('pantallaProgreso').style.display = 'none';
  document.getElementById('pantallaLogin').style.display = 'block';
};

function numeroSemanaGlobal(bloque, indiceLocal) { return (parseInt(bloque) - 1) * 5 + indiceLocal + 1; }
function colorParaCalificacion(calif) {
  if (calif >= 8) return '#6a9955';
  if (calif >= 6) return '#d99a3d';
  return '#b04a3a';
}

async function mostrarPantallaProgreso(sesion) {
  document.getElementById('pantallaLogin').style.display = 'none';
  document.getElementById('pantallaProgreso').style.display = 'block';

  const cont = document.getElementById('contenidoProgreso');
  cont.innerHTML = '<div class="cargando">Cargando…</div>';

  try {
    const ref = (...partes) => fx.doc(db, 'materias', sesion.materia, 'grupos', sesion.grupo, 'alumnos', sesion.alumnoId, ...partes);
    const col = (nombre) => fx.collection(db, 'materias', sesion.materia, 'grupos', sesion.grupo, 'alumnos', sesion.alumnoId, nombre);

    // --- Cargar TODO lo del alumno de una vez ---
    const [snapPart, snapPract, snapEns, snapAsist, snapExam, snapAvisos] = await Promise.all([
      fx.getDocs(col('participacion')),
      fx.getDocs(col('practicas')),
      fx.getDocs(col('ensayos')),
      fx.getDocs(col('asistencia')),
      fx.getDocs(col('examenes')),
      fx.getDocs(fx.query(fx.collection(db, 'materias', sesion.materia, 'grupos', sesion.grupo, 'avisos'), fx.orderBy('fecha', 'desc'))),
    ]);
    const ajustes = {};
    for (const b of ['1', '2', '3']) {
      const snapAjuste = await fx.getDoc(ref('ajustesManuales', 'bloque' + b));
      ajustes[b] = snapAjuste.exists() ? snapAjuste.data() : {};
    }

    // --- Organizar por bloque ---
    const bloques = {};
    ['1', '2', '3'].forEach((b) => {
      bloques[b] = { participacionTotal: 0, practicas: [], ensayos: [], asistenciaDias: [], asistenciaTotal: 0, examen: null };
    });

    snapPart.forEach((d) => {
      const b = d.id.split('.')[0];
      if (bloques[b]) bloques[b].participacionTotal += (d.data().puntos || 0);
    });
    snapPract.forEach((d) => {
      const dat = d.data();
      if (bloques[dat.bloque]) bloques[dat.bloque].practicas.push(dat);
    });
    snapEns.forEach((d) => {
      const dat = d.data();
      const b = String(dat.bloque || Math.ceil(dat.semana / 5));
      if (bloques[b]) bloques[b].ensayos.push({ semana: dat.semana, entregada: dat.entregada, puntos: dat.puntos || 0 });
    });
    snapAsist.forEach((d) => {
      const dat = d.data();
      if (bloques[dat.bloque]) {
        bloques[dat.bloque].asistenciaDias.push(dat);
        bloques[dat.bloque].asistenciaTotal += (dat.valor || 0);
      }
    });
    snapExam.forEach((d) => {
      const b = d.id.replace('bloque', '');
      if (bloques[b]) bloques[b].examen = d.data();
    });
    bloques['1'].practicas.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
    bloques['2'].practicas.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
    bloques['3'].practicas.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

    // --- Calcular subtotales automáticos + aplicar ajustes manuales (idéntico a admin.html) ---
    const aplicar = (auto, manual) => (manual !== undefined && manual !== null) ? manual : auto;
    const resumenBloques = ['1', '2', '3'].map((b) => {
      const info = bloques[b];
      const practicasSuma = Math.min(info.practicas.reduce((a, p) => a + (p.puntos || 0), 0), 10);
      const ensayosSuma = Math.min(info.ensayos.reduce((a, e) => a + (e.puntos || 0), 0), 30);
      const asistenciaSuma = Math.min(info.asistenciaTotal, 10);
      const examenPts = info.examen ? (info.examen.calificacion || 0) * 3 : 0;
      const auto = {
        participacion: Math.min(info.participacionTotal, 20),
        ensayos: ensayosSuma,
        practicas: practicasSuma,
        asistencia: asistenciaSuma,
        examen: examenPts,
      };
      const aj = ajustes[b];
      const valores = {
        participacion: aplicar(auto.participacion, aj.participacion),
        ensayos: aplicar(auto.ensayos, aj.ensayos),
        practicas: aplicar(auto.practicas, aj.practicas),
        asistencia: aplicar(auto.asistencia, aj.asistencia),
        examen: aplicar(auto.examen, aj.examen),
      };
      const total = Object.values(valores).reduce((a, v) => a + v, 0);
      return { bloque: b, valores, total, calificacion: total / 10 };
    });

    const ensayosAcumulado = resumenBloques.reduce((a, b) => a + b.valores.ensayos, 0); // sobre 90
    const pctEvaluacionFinal = (ensayosAcumulado / 90) * 35;

    // --- Evaluación Final del curso (distinta de la parcial por bloque) ---
    // Según el programa oficial: Entrega de ensayos 35% + Investigaciones elaboradas 35% + Examen final 30%.
    const pctEntregaEnsayos = (ensayosAcumulado / 90) * 35;

    const examenesConDato = resumenBloques
      .map((b) => bloques[b.bloque].examen)
      .filter((e) => e && typeof e.calificacion === 'number');
    const promedioExamenes = examenesConDato.length > 0
      ? examenesConDato.reduce((a, e) => a + e.calificacion, 0) / examenesConDato.length
      : null;
    const pctExamenFinal = promedioExamenes !== null ? (promedioExamenes / 10) * 30 : null;

    // La investigación final (proyecto "Deconstrucción de la Región de Campeche", Semana 16)
    // aún no tiene un lugar de captura en el panel docente; se muestra pendiente hasta que exista.
    const snapProyectoFinal = await fx.getDoc(ref('proyectoFinal', 'entrega'));
    const proyectoFinal = snapProyectoFinal.exists() ? snapProyectoFinal.data() : null;
    const pctInvestigacionFinal = (proyectoFinal && typeof proyectoFinal.calificacion === 'number')
      ? (proyectoFinal.calificacion / 10) * 35
      : null;

    const partesListas = [pctEntregaEnsayos, pctInvestigacionFinal, pctExamenFinal].filter((v) => v !== null);
    const totalEvaluacionFinal = pctEntregaEnsayos + (pctInvestigacionFinal || 0) + (pctExamenFinal || 0);
    const evaluacionFinalCompleta = pctInvestigacionFinal !== null && pctExamenFinal !== null;

    // ===================== ARMAR HTML =====================

    // --- Participación ---
    let htmlParticipacion = `<section class="tarjeta"><h2>Participación (Actividades) <small>20 pts por bloque</small></h2>`;
    resumenBloques.forEach((b) => {
      htmlParticipacion += `<div class="fila-simple"><span>Bloque ${b.bloque}</span><span class="valor">${b.valores.participacion.toFixed(1)} / 20 pts</span></div>`;
    });
    htmlParticipacion += `<a href="actividades.html" style="text-decoration:none;"><button class="btn-secundario" style="margin-top:14px;">Ir a Actividades</button></a></section>`;

    // --- Prácticas ---
    let htmlPracticas = `<section class="tarjeta"><h2>Prácticas de cocina <small>10 pts por bloque</small></h2>`;
    resumenBloques.forEach((b) => {
      const info = bloques[b.bloque];
      htmlPracticas += `<h3 class="nombre-bloque">Bloque ${b.bloque}</h3>`;
      if (info.practicas.length === 0) {
        htmlPracticas += `<div class="vacio-seccion">Sin prácticas evaluadas todavía.</div>`;
      } else {
        info.practicas.forEach((p) => {
          htmlPracticas += `
            <div class="item-entrega">
              <div class="detalle-item">
                <div class="fecha-item">${p.fecha || ''}</div>
                <div>${(p.calificacion || 0).toFixed(1)}/10</div>
              </div>
              <span class="estado-item estado-entregado">+${(p.puntos || 0).toFixed(1)} pts</span>
            </div>`;
        });
      }
      htmlPracticas += `<div class="subtotal-bloque"><span>Subtotal Bloque ${b.bloque}</span><span>${b.valores.practicas.toFixed(1)} / 10 pts</span></div>`;
    });
    htmlPracticas += `</section>`;

    // --- Ensayos ---
    let htmlEnsayos = `<section class="tarjeta"><h2>Ensayos <small>30 pts por bloque</small></h2>`;
    resumenBloques.forEach((b) => {
      htmlEnsayos += `<h3 class="nombre-bloque">Bloque ${b.bloque}</h3>`;
      const info = bloques[b.bloque];
      TEMAS_SEMANA[b.bloque].forEach((tema, i) => {
        const semGlobal = numeroSemanaGlobal(b.bloque, i);
        const registro = info.ensayos.find((e) => e.semana === semGlobal);
        const entregada = registro && registro.entregada;
        htmlEnsayos += `
          <div class="item-entrega">
            <span class="icono-estado">${entregada ? '✔️' : '⏳'}</span>
            <div class="detalle-item">Sem. ${semGlobal} — ${tema}</div>
            <span class="estado-item ${entregada ? 'estado-entregado' : 'estado-pendiente'}">
              ${entregada ? '+' + (registro.puntos || 0).toFixed(1) + ' pts' : 'Pendiente'}
            </span>
          </div>`;
      });
      htmlEnsayos += `<div class="subtotal-bloque"><span>Subtotal Bloque ${b.bloque}</span><span>${b.valores.ensayos.toFixed(1)} / 30 pts</span></div>`;
    });
    htmlEnsayos += `
      <div class="caja-acumulado">
        <span>Tu porcentaje hacia la Evaluación Final</span>
        <span class="num">${pctEvaluacionFinal.toFixed(1)}% / 35%</span>
      </div>
    </section>`;

    // --- Evaluación Final del curso ---
    let htmlEvalFinal = `<section class="tarjeta"><h2>Evaluación Final del Curso <small>Entrega de ensayos 35% · Investigación elaborada 35% · Examen final 30%</small></h2>`;
    htmlEvalFinal += `
      <div class="fila-simple">
        <span>Entrega de ensayos (tus 15 bitácoras)</span>
        <span class="valor">${pctEntregaEnsayos.toFixed(1)} / 35%</span>
      </div>
      <div class="fila-simple">
        <span>Investigación elaborada (proyecto final, Semana 16)</span>
        <span class="valor">${pctInvestigacionFinal !== null ? pctInvestigacionFinal.toFixed(1) + ' / 35%' : 'Pendiente'}</span>
      </div>
      <div class="fila-simple">
        <span>Examen final (promedio de tus 3 exámenes de bloque)</span>
        <span class="valor">${pctExamenFinal !== null ? pctExamenFinal.toFixed(1) + ' / 30%' : 'Pendiente'}</span>
      </div>`;
    htmlEvalFinal += `
      <div class="caja-acumulado">
        <span>${evaluacionFinalCompleta ? 'Evaluación Final' : 'Acumulado hasta ahora'}</span>
        <span class="num">${totalEvaluacionFinal.toFixed(1)} / 100%</span>
      </div>`;
    if (!evaluacionFinalCompleta) {
      htmlEvalFinal += `<div class="nota-equivalencia">Este número todavía no es tu calificación final: faltan partes por capturar (marcadas como "Pendiente" arriba). Se actualizará conforme tu docente las registre.</div>`;
    }
    htmlEvalFinal += `</section>`;

    // --- Asistencia ---
    let htmlAsistencia = `<section class="tarjeta"><h2>Asistencia <small>10 pts por bloque</small></h2>`;
    resumenBloques.forEach((b) => {
      const info = bloques[b.bloque];
      htmlAsistencia += `<h3 class="nombre-bloque">Bloque ${b.bloque}</h3>`;
      if (info.asistenciaDias.length === 0) {
        htmlAsistencia += `<div class="fila-simple"><span>Sin registros</span><span class="valor">0.00 / 10 pts</span></div>`;
      } else {
        const asistenciasContadas = info.asistenciaDias.filter((d) => d.estado !== 'falta').length;
        htmlAsistencia += `<div class="fila-simple"><span>${asistenciasContadas} asistencia(s)</span><span class="valor">${b.valores.asistencia.toFixed(2)} / 10 pts</span></div>`;
        const dias = info.asistenciaDias.slice().sort((x, y) => new Date(x.fecha) - new Date(y.fecha));
        htmlAsistencia += `<details class="desglose-detalle"><summary>Ver días registrados (${dias.length})</summary><div class="contenido-desglose">`;
        htmlAsistencia += `
          <div class="leyenda-asistencia">
            <span><span class="punto-leyenda" style="background:${ESTADOS_ASISTENCIA_COLOR.presente};"></span>Presente</span>
            <span><span class="punto-leyenda" style="background:${ESTADOS_ASISTENCIA_COLOR.justificado};"></span>Justificado</span>
            <span><span class="punto-leyenda" style="background:${ESTADOS_ASISTENCIA_COLOR.retardo};"></span>Retardo</span>
            <span><span class="punto-leyenda" style="background:${ESTADOS_ASISTENCIA_COLOR.falta};"></span>Falta</span>
          </div>
          <div class="grid-dias-asistencia">`;
        dias.forEach((d) => {
          const fechaCorta = (d.fecha || '').split('-').slice(1).reverse().join('/'); // YYYY-MM-DD -> DD/MM
          const color = ESTADOS_ASISTENCIA_COLOR[d.estado] || '#a89f8d';
          htmlAsistencia += `
            <div class="chip-dia-asistencia" style="background:${color};">
              <div class="fecha-chip">${fechaCorta}</div>
              <div class="valor-chip">${(d.valor || 0).toFixed(2)}</div>
            </div>`;
        });
        htmlAsistencia += `</div></div></details>`;
      }
    });
    htmlAsistencia += `</section>`;

    // --- Examen en línea ---
    let htmlExamen = `<section class="tarjeta"><h2>Examen en Línea <small>30 pts por bloque</small></h2>`;
    resumenBloques.forEach((b) => {
      const info = bloques[b.bloque];
      const ex = info.examen;
      htmlExamen += `<h3 class="nombre-bloque">Bloque ${b.bloque}</h3>`;
      if (ex && typeof ex.calificacion === 'number') {
        const color = colorParaCalificacion(ex.calificacion);
        htmlExamen += `
          <div style="text-align:center; padding:10px 0 4px;">
            <div style="font-size:2.4rem; font-weight:bold; color:${color};">${ex.calificacion.toFixed(1)}</div>
            <div class="texto-ayuda" style="margin:2px 0 0;">${ex.aciertos} de ${ex.total} correctas</div>
          </div>
          <div class="subtotal-bloque"><span>Puntos para tu bloque</span><span>${b.valores.examen.toFixed(1)} / 30 pts</span></div>`;
      } else {
        htmlExamen += `
          <div style="text-align:center; padding:14px 0;">
            <div class="texto-ayuda" style="margin:0 0 10px;">Aún no presentas el examen de este bloque.</div>
          </div>`;
      }
    });
    htmlExamen += `<a href="examen.html" style="text-decoration:none;"><button class="btn-secundario">Ir a Examen en Línea</button></a></section>`;

    // --- Calificación por bloque ---
    let htmlCalifBloque = `<section class="tarjeta"><h2>Calificación por bloque</h2>`;
    resumenBloques.forEach((b) => {
      const color = colorParaCalificacion(b.calificacion);
      htmlCalifBloque += `
        <div class="fila-calif-bloque">
          <span>Bloque ${b.bloque}</span>
          <span class="valor" style="color:${color};">${b.total.toFixed(1)} / 100 (${b.calificacion.toFixed(1)})</span>
        </div>`;
    });
    resumenBloques.forEach((b) => {
      htmlCalifBloque += `<details class="desglose-detalle"><summary>Ver desglose del Bloque ${b.bloque}</summary><div class="contenido-desglose">`;
      RUBROS.forEach((r) => {
        htmlCalifBloque += `<div class="fila-rubro-mini"><span>${r.label}</span><span>${b.valores[r.clave].toFixed(1)} / ${r.max}</span></div>`;
      });
      htmlCalifBloque += `</div></details>`;
    });
    htmlCalifBloque += `<p class="texto-ayuda" style="margin-top:10px;">Cada bloque vale 100 puntos: Participación 20 · Ensayos 30 · Prácticas 10 · Asistencia 10 · Examen 30.</p></section>`;

    // --- Avisos ---
    let htmlAvisos = `<section class="tarjeta"><h2>Avisos de tu docente</h2>`;
    if (snapAvisos.empty) {
      htmlAvisos += `<div class="vacio-seccion">No hay avisos por ahora.</div>`;
    } else {
      snapAvisos.forEach((d) => {
        const av = d.data();
        htmlAvisos += `<div class="aviso-item">${av.texto}<span class="fecha-aviso">${new Date(av.fecha).toLocaleDateString('es-MX')}</span></div>`;
      });
    }
    htmlAvisos += `</section>`;

    cont.innerHTML = `
      <div class="saludo">Hola, <strong>${sesion.nombre}</strong></div>
      ${htmlParticipacion}
      ${htmlPracticas}
      ${htmlEnsayos}
      ${htmlAsistencia}
      ${htmlExamen}
      ${htmlCalifBloque}
      ${htmlEvalFinal}
      ${htmlAvisos}
      <footer class="pie-progreso">Aula Virtual · Bases Culinarias · Panel personal del alumno</footer>
    `;
  } catch (err) {
    cont.innerHTML = '<p class="texto-ayuda">No se pudo cargar tu progreso: ' + err.message + '</p>';
  }
}
</script>
<script src="menu.js?v=3"></script>
<script src="musica.js?v=2"></script>
</body>
</html>
