<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actividades — Aula Virtual JRG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #17140f; color: #f2ece1; min-height: 100vh; }
  header { background: #f2ece1; color: #17140f; padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  header a { color: #17140f; text-decoration: none; font-size: 1.4rem; margin-right: 8px; }
  header h1 { font-size: 1.2rem; }
  main { padding: 40px 24px; max-width: 480px; margin: 0 auto; }
  .tag { color: #d99a3d; letter-spacing: 2px; font-size: 0.8rem; text-transform: uppercase; }
  h2 { font-size: 1.8rem; margin: 10px 0 24px; }
  label { display: block; font-size: 0.85rem; color: #a89f8d; margin-bottom: 4px; margin-top: 16px; }
  select, input {
    width: 100%; padding: 14px 16px; border-radius: 10px;
    border: 1px solid #3a3020; font-family: inherit; font-size: 1rem;
    background: #201b13; color: #f2ece1;
  }
  button {
    margin-top: 24px; width: 100%; background: #d99a3d; color: #17140f; border: none;
    padding: 14px 20px; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer;
  }
  #estado { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; background: #2a2013; color: #cfc6b6; }
  #panelAlumno { display: none; }
  #panelAlumno .saludo { font-size: 1.4rem; margin-bottom: 4px; }
  #panelAlumno .grupo { color: #a89f8d; font-size: 0.9rem; margin-bottom: 24px; }
  #cambiar { background: none; border: 1px solid #6b6252; color: #cfc6b6; margin-top: 24px; }

  .pestañas { display: flex; gap: 8px; margin-bottom: 20px; }
  .pestaña {
    flex: 1; text-align: center; padding: 10px 4px; border-radius: 20px;
    background: #201b13; border: 1px solid #3a3020; color: #a89f8d;
    font-size: 0.85rem; font-weight: bold; cursor: pointer;
  }
  .pestaña.activa { background: #d99a3d; color: #17140f; border-color: #d99a3d; }
  .bloqueContenido { display: none; }
  .bloqueContenido.activo { display: block; }
  .subtema {
    display: block; width: 100%; text-align: left; background: #201b13; border: 1px solid #3a3020;
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
    color: #f2ece1; font-size: 0.95rem; font-family: inherit; cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <a href="index.html">←</a>
  <h1>Actividades</h1>
</header>
<main>
  <div id="panelLogin">
    <div class="tag">Aula Virtual</div>
    <h2>Ingresa tus datos</h2>
    <label>Materia</label>
    <select id="materia">
      <option value="bases-culinarias">Bases Culinarias</option>
      <option value="expresion-oral-escrita">Expresión Oral y Escrita</option>
    </select>
    <label>Tu nombre completo</label>
    <input id="nombre" type="text" placeholder="Como te registró tu docente">
    <label>PIN</label>
    <input id="pin" type="text" inputmode="numeric" maxlength="4" placeholder="4 dígitos">
    <button id="btnEntrar">Entrar</button>
    <div id="estado"></div>
  </div>

  <div id="panelAlumno">
    <div class="saludo">Hola, <span id="nombreAlumno"></span></div>
    <div class="grupo">Bases Culinarias</div>
    <div class="pestañas" id="pestañas"></div>
    <div id="contenidoBloques"></div>
    <button id="cambiar">Cambiar de alumno</button>
  </div>
</main>

<script type="module">
import { app, db } from './firebase-config.js';
import { collectionGroup, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const auth = getAuth(app);
signInAnonymously(auth);

const estado = document.getElementById('estado');
const panelLogin = document.getElementById('panelLogin');
const panelAlumno = document.getElementById('panelAlumno');

const SUBTEMAS = {
  'bases-culinarias': [
    { bloque: 'Bloque 1', items: [
      ['1.1', 'Géneros y elaboraciones culinarias sencillas'],
      ['1.2', 'Elaboración culinaria básica'],
      ['1.3', 'Equipos e instrumentos de medida'],
      ['1.4', 'Tablas de temperaturas y manuales de equipos'],
      ['1.5', 'Unidades y pesos'],
    ]},
    { bloque: 'Bloque 2', items: [
      ['2.1', 'Aprovisionamiento de materias primas'],
      ['2.2', 'Materias primas de uso común'],
      ['2.3', 'Variedades y características físicas'],
      ['2.4', 'Cualidades gastronómicas'],
    ]},
    { bloque: 'Bloque 3', items: [
      ['3.1', 'Conocimientos generales para la elaboración de platillos'],
      ['3.2.1', 'Carnes, aves, pescados y mariscos'],
      ['3.2.2', 'Vegetales y frutos'],
      ['3.2.3', 'Semillas y cereales'],
      ['3.2.4', 'Hierbas y especias'],
    ]},
  ]
};

function normaliza(txt) { return txt.trim().toLowerCase(); }

async function intentarLogin() {
  const materia = document.getElementById('materia').value;
  const nombre = document.getElementById('nombre').value.trim();
  const pin = document.getElementById('pin').value.trim();
  if (!nombre || !pin) { estado.textContent = 'Escribe tu nombre y tu PIN.'; return; }
  estado.textContent = 'Verificando…';
  try {
    const q = query(collectionGroup(db, 'alumnos'), where('pin', '==', pin));
    const snap = await getDocs(q);
    let encontrado = null, grupoEncontrado = null;
    snap.forEach((docu) => {
      const d = docu.data();
      const rutaMateria = docu.ref.parent.parent.parent.parent.id;
      if (rutaMateria === materia && normaliza(d.nombre) === normaliza(nombre)) {
        encontrado = d;
        grupoEncontrado = docu.ref.parent.parent.id;
      }
    });
    if (encontrado) {
      localStorage.setItem('jrg_alumno', JSON.stringify({ materia, grupo: grupoEncontrado, nombre: encontrado.nombre, pin }));
      mostrarPanelAlumno(materia, encontrado.nombre);
    } else {
      estado.textContent = 'Nombre o PIN incorrecto. Verifica con tu docente.';
    }
  } catch (err) {
    estado.textContent = 'Error al verificar: ' + err.message;
  }
}

function mostrarPanelAlumno(materia, nombre) {
  document.getElementById('nombreAlumno').textContent = nombre;
  panelLogin.style.display = 'none';
  panelAlumno.style.display = 'block';
  renderPestañas(materia);
}

function renderPestañas(materia) {
  const bloques = SUBTEMAS[materia] || [];
  const pestañasCont = document.getElementById('pestañas');
  const contenidoCont = document.getElementById('contenidoBloques');
  pestañasCont.innerHTML = '';
  contenidoCont.innerHTML = '';

  bloques.forEach((b, idx) => {
    const tab = document.createElement('div');
    tab.className = 'pestaña' + (idx === 0 ? ' activa' : '');
    tab.textContent = b.bloque.replace('Bloque ', 'B');
    tab.onclick = () => cambiarPestaña(idx);
    pestañasCont.appendChild(tab);

    const cont = document.createElement('div');
    cont.className = 'bloqueContenido' + (idx === 0 ? ' activo' : '');
    cont.id = `bloque${idx}`;
    b.items.forEach(([num, titulo]) => {
      const btn = document.createElement('button');
      btn.className = 'subtema';
      btn.textContent = `${num}  ${titulo}`;
      btn.onclick = () => { window.location.href = `actividad.html?materia=${materia}&subtema=${num}`; };
      cont.appendChild(btn);
    });
    contenidoCont.appendChild(cont);
  });
}

function cambiarPestaña(idx) {
  document.querySelectorAll('.pestaña').forEach((p, i) => p.classList.toggle('activa', i === idx));
  document.querySelectorAll('.bloqueContenido').forEach((c, i) => c.classList.toggle('activo', i === idx));
}

document.getElementById('btnEntrar').onclick = intentarLogin;
document.getElementById('cambiar').onclick = () => {
  localStorage.removeItem('jrg_alumno');
  panelAlumno.style.display = 'none';
  panelLogin.style.display = 'block';
};

const guardado = localStorage.getItem('jrg_alumno');
if (guardado) {
  const datos = JSON.parse(guardado);
  mostrarPanelAlumno(datos.materia, datos.nombre);
}
</script>
 <script src="menu.js"></script>
<script src="musica.js"></script>
</body>
</html>
