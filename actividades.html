<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actividad — Aula Virtual JRG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #17140f; color: #f2ece1; min-height: 100vh; overflow-x: hidden; position: relative; }
  header { background: #f2ece1; color: #17140f; padding: 20px 24px; display: flex; align-items: center; gap: 12px; position: relative; z-index: 2; }
  header a { color: #17140f; text-decoration: none; font-size: 1.4rem; margin-right: 8px; }
  header h1 { font-size: 1.1rem; }
  main { padding: 40px 24px; max-width: 620px; margin: 0 auto; position: relative; z-index: 2; }
  .tag { color: #d99a3d; letter-spacing: 2px; font-size: 0.8rem; text-transform: uppercase; }
  h2 { font-size: 1.4rem; margin: 10px 0 24px; line-height: 1.35; }
  .opcion {
    display: block; width: 100%; text-align: left; background: #201b13ee;
    border: 2px solid #3a3020; border-radius: 12px; padding: 16px;
    margin-bottom: 12px; color: #f2ece1; font-size: 1rem; font-family: inherit; cursor: pointer;
  }
  .opcion.correcta { border-color: #6a9955; background: #24301fee; }
  .opcion.incorrecta { border-color: #b04a3a; background: #2e1e1aee; }
  .vf-fila { display: flex; gap: 12px; }
  .vf-fila .opcion { flex: 1; text-align: center; font-weight: bold; }
  input[type="text"] {
    width: 100%; padding: 14px 16px; border-radius: 10px;
    border: 2px solid #3a3020; font-family: inherit; font-size: 1rem;
    background: #201b13ee; color: #f2ece1; margin-bottom: 12px;
  }
  input[type="text"].correcta { border-color: #6a9955; }
  input[type="text"].incorrecta { border-color: #b04a3a; }
  #btnResponderTexto {
    width: 100%; background: #d99a3d; color: #17140f; border: none;
    padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 12px;
  }
  .retro {
    margin-top: 4px; padding: 16px; border-radius: 10px;
    background: #201b13ee; color: #cfc6b6; font-size: 0.95rem; line-height: 1.5;
  }
  .retro.ok { border-left: 4px solid #6a9955; }
  .retro.mal { border-left: 4px solid #b04a3a; }
  .retro .frase { display: block; color: #d99a3d; font-weight: bold; margin-bottom: 6px; font-size: 1rem; }
  #siguiente {
    display: none; margin-top: 20px; width: 100%; background: #d99a3d; color: #17140f;
    border: none; padding: 14px 20px; border-radius: 30px; font-weight: bold; font-size: 1rem; cursor: pointer;
  }
  .progreso { color: #a89f8d; font-size: 0.85rem; margin-bottom: 4px; }
  .racha { color: #d99a3d; font-size: 0.85rem; margin-bottom: 16px; font-weight: bold; }
  #final { display: none; text-align: center; position: relative; z-index: 2; }
  #final h2 { color: #d99a3d; }
  #reintentar {
    margin-top: 20px; width: 100%; background: none; border: 1px solid #6b6252;
    color: #cfc6b6; padding: 14px 20px; border-radius: 30px; font-size: 1rem; cursor: pointer;
  }

  #fondoAmbiental { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .flotante {
    position: absolute; font-size: 3.2rem; opacity: 0.16;
    animation: flotar 13s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.4));
  }
  @keyframes flotar {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(14px, -22px) rotate(10deg); }
    50%  { transform: translate(-10px, 14px) rotate(-8deg); }
    75%  { transform: translate(18px, 8px) rotate(6deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  .particula {
    position: fixed; top: 50%; left: 50%; font-size: 2.6rem;
    z-index: 999; pointer-events: none; will-change: transform, opacity;
    transition: transform 0.45s cubic-bezier(.2,.8,.3,1), opacity 1.3s ease-in;
  }

  #ascenso {
    display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #d99a3d; color: #17140f; padding: 14px 24px; border-radius: 30px;
    font-weight: bold; font-size: 0.95rem; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    text-align: center; white-space: nowrap;
  }
  @keyframes aparecer { from { opacity: 0; top: 0; } to { opacity: 1; top: 20px; } }
  @keyframes desaparecer { from { opacity: 1; } to { opacity: 0; top: 0; } }
</style>
</head>
<body>
<div id="fondoAmbiental"></div>
<div id="ascenso"></div>

<header>
  <a href="actividades.html">←</a>
  <h1 id="tituloSubtema">Actividad</h1>
</header>

<main>
  <div id="juego">
    <div class="progreso" id="progreso"></div>
    <div class="racha" id="racha"></div>
    <div class="tag" id="tipoPregunta">Pregunta</div>
    <h2 id="preguntaTexto"></h2>
    <div id="opciones"></div>
    <div class="retro" id="retro" style="display:none;"></div>
    <button id="siguiente">Siguiente</button>
  </div>

  <div id="final">
    <h2 id="resultadoTitulo"></h2>
    <p id="resultadoTexto" style="color:#cfc6b6; margin-top:10px;"></p>
    <button id="reintentar">Volver a contestar</button>
  </div>
</main>

signInAnonymously(auth);

const BANCO = {

      { tipo: 'multiple', texto: '¿Qué criterio define a un "género culinario" en la cocina profesional?', opciones: ['El origen geográfico del platillo', 'La técnica, estructura o función que cumple dentro del menú', 'El precio de venta del platillo', 'El ingrediente principal usado'], correcta: 1, explicacion: 'El género se define por función y técnica, nunca por nacionalidad o ingrediente principal.' },
      { tipo: 'vf', texto: 'Clasificar una preparación por su ingrediente principal (ej. "todo lo de pollo") es la forma correcta de identificar su género culinario.', correcta: false, explicacion: 'Es un error común. El género se define por técnica y función, no por el ingrediente principal.' },
      { tipo: 'multiple', texto: '¿Qué distingue a una elaboración culinaria sencilla de una compuesta?', opciones: ['La sencilla no depende de otra preparación previa para existir', 'La sencilla siempre lleva más ingredientes', 'La compuesta es siempre más barata', 'No hay ninguna diferencia real'], correcta: 0, explicacion: 'La compuesta se construye a partir de elementos sencillos, como una salsa derivada de una salsa madre.' },

let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tono(frecuencia, duracion, tipoOnda = 'sine', volumen = 0.15) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = tipoOnda;
    osc.frequency.value = frecuencia;
    gain.gain.value = volumen;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duracion);
    osc.stop(ctx.currentTime + duracion);
  } catch (e) {}
}
function sonidoAcierto(nivelCombo) {
  const base = 523 + Math.min(nivelCombo, 6) * 40;
  tono(base, 0.12, 'triangle', 0.18);
  setTimeout(() => tono(base * 1.25, 0.15, 'triangle', 0.18), 90);
}
function sonidoError() { tono(180, 0.25, 'sawtooth', 0.12); }
function sonidoAscenso() {
  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tono(f, 0.18, 'triangle', 0.2), i * 100));
}
function vibrar(patron) { if (navigator.vibrate) navigator.vibrate(patron); }

function crearFondoAmbiental() {
  const cont = document.getElementById('fondoAmbiental');
  for (let i = 0; i < 9; i++) {
    const span = document.createElement('span');
    span.className = 'flotante';
    span.textContent = ICONOS[Math.floor(Math.random() * ICONOS.length)];
    span.style.left = Math.random() * 88 + 'vw';
    span.style.top = Math.random() * 88 + 'vh';
    span.style.animationDuration = (9 + Math.random() * 10) + 's';
    span.style.animationDelay = (Math.random() * 5) + 's';
    cont.appendChild(span);
  }
}

function lanzarExplosion() {
  const cantidad = 16;
  for (let i = 0; i < cantidad; i++) {
    const span = document.createElement('span');
    span.className = 'particula';
    span.textContent = ICONOS[Math.floor(Math.random() * ICONOS.length)];
    document.body.appendChild(span);

    const angulo = Math.random() * Math.PI * 2;
    const distancia = 110 + Math.random() * 200;
    const dx = Math.cos(angulo) * distancia;
    const dy = Math.sin(angulo) * distancia;

    requestAnimationFrame(() => {
      span.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.random()*360}deg) scale(1.5)`;
    });

    setTimeout(() => {
      span.style.transition = 'transform 1.1s cubic-bezier(.4,0,1,1), opacity 1.1s ease-in';
      span.style.transform += ` translateY(${window.innerHeight}px)`;
      span.style.opacity = '0';
    }, 420);

    setTimeout(() => span.remove(), 1700);
  }
}

function actualizarRacha() {
  document.getElementById('racha').textContent = racha > 0 ? `🔥 Racha: ${racha}` : '';
}

function revisarAscenso() {
  const nuevoPuesto = Math.min(Math.floor(racha / 2), PUESTOS.length - 1);
  if (nuevoPuesto > puestoActual) {
    puestoActual = nuevoPuesto;
    sonidoAscenso();
    vibrar([80, 40, 80, 40, 150]);
    const banner = document.getElementById('ascenso');
    banner.textContent = `🎉 ¡Ascenso! Ahora eres: ${PUESTOS[puestoActual]}`;
    banner.style.display = 'block';
    banner.style.animation = 'none';
    void banner.offsetWidth;
    banner.style.animation = 'aparecer 0.4s ease-out, desaparecer 0.4s ease-in 2.6s forwards';
    setTimeout(() => { banner.style.display = 'none'; }, 3200);
  }
}

    fila.appendChild(btnV); fila.appendChild(btnF);
    cont.appendChild(fila);
  } else if (p.tipo === 'completar') {
    tipoTag.textContent = 'Completa el espacio';
    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'inputCompletar';
    input.placeholder = 'Escribe tu respuesta';
    const btn = document.createElement('button');
    btn.id = 'btnResponderTexto';
    btn.textContent = 'Responder';
    btn.onclick = () => responderCompletar();
    cont.appendChild(input);
    cont.appendChild(btn);
  }
}

function procesarResultado(esCorrecta, explicacion) {
  const retro = document.getElementById('retro');
  retro.style.display = 'block';
  if (esCorrecta) {
    aciertos++;
    racha++;
    sonidoAcierto(racha);
    vibrar(40);
    lanzarExplosion();
    revisarAscenso();
    const frase = FRASES_BIEN[Math.floor(Math.random() * FRASES_BIEN.length)];
    retro.className = 'retro ok';
    retro.innerHTML = `<span class="frase">${frase}</span><strong>Correcto.</strong> ${explicacion}`;
  } else {
    racha = 0;
    sonidoError();
    vibrar([60, 40, 60]);
    const frase = FRASES_MAL[Math.floor(Math.random() * FRASES_MAL.length)];
    retro.className = 'retro mal';
    retro.innerHTML = `<span class="frase">${frase}</span><strong>Incorrecto.</strong> ${explicacion}`;
  }
  actualizarRacha();
  document.getElementById('siguiente').style.display = 'block';
}

function responderOpcion(i) {
  if (respondida) return;
  respondida = true;
  const p = data.preguntas[indice];
  const botones = document.querySelectorAll('#opciones .opcion');
  botones.forEach((b, idx) => {
    b.disabled = true;
    if (idx === p.correcta) b.classList.add('correcta');
    else if (idx === i) b.classList.add('incorrecta');
  });
  procesarResultado(i === p.correcta, p.explicacion);
}

function responderVF(valor) {
  if (respondida) return;
  respondida = true;
  const p = data.preguntas[indice];
  const botones = document.querySelectorAll('#opciones .opcion');
  botones.forEach((b) => {
    b.disabled = true;
    const esVerdadero = b.textContent === 'Verdadero';
    if (esVerdadero === p.correcta) b.classList.add('correcta');
    else if (esVerdadero === valor) b.classList.add('incorrecta');
  });
  procesarResultado(valor === p.correcta, p.explicacion);
}

function responderCompletar() {
  if (respondida) return;
  respondida = true;
  const p = data.preguntas[indice];
  const input = document.getElementById('inputCompletar');
  const btn = document.getElementById('btnResponderTexto');
  input.disabled = true;
  btn.disabled = true;
  const respuestaOk = input.value.trim().toLowerCase() === p.respuesta.trim().toLowerCase();
  input.classList.add(respuestaOk ? 'correcta' : 'incorrecta');
  procesarResultado(respuestaOk, `${p.explicacion} (Respuesta correcta: ${p.respuesta})`);
}

document.getElementById('siguiente').onclick = () => {
  indice++;
  if (indice < data.preguntas.length) {
    mostrarPregunta();
  } else {
    mostrarFinal();
  }
};

const PUNTOS_POR_BLOQUE = { 'bases-culinarias': { '1': 20/5, '2': 20/4, '3': 20/5 } };

async function registrarParticipacionSiAplica() {
  const guardado = localStorage.getItem('jrg_alumno');
  if (!guardado) return { registrado: false, motivo: 'sin_sesion' };
  const alumno = JSON.parse(guardado);
  if (!alumno.id) return { registrado: false, motivo: 'sin_id' };
  const bloque = subtema.split('.')[0];
  try {
    const fbConfig = await import('./firebase-config.js');
    const firestoreMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const refConfig = firestoreMod.doc(fbConfig.db, 'materias', materia, 'grupos', alumno.grupo, 'config', 'bloquesAbiertos');
    const snapConfig = await firestoreMod.getDoc(refConfig);
    const config = snapConfig.exists() ? snapConfig.data() : {};
    if (config['bloque' + bloque] !== true) return { registrado: false, motivo: 'bloque_cerrado' };
    const puntos = (PUNTOS_POR_BLOQUE[materia] && PUNTOS_POR_BLOQUE[materia][bloque]) || 4;
    const refParticipacion = firestoreMod.doc(fbConfig.db, 'materias', materia, 'grupos', alumno.grupo, 'alumnos', alumno.id, 'participacion', subtema);
    await firestoreMod.setDoc(refParticipacion, { puntos, completado: true, fecha: new Date().toISOString() });
    return { registrado: true, puntos };
  } catch (err) {
    console.warn('No se pudo registrar participación:', err);
    return { registrado: false, motivo: 'error_red' };
  }
}

function mostrarFinal() {
  document.getElementById('juego').style.display = 'none';
  const final = document.getElementById('final');
  final.style.display = 'block';
  const total = data.preguntas.length;
  if (aciertos === total) {
    document.getElementById('resultadoTitulo').textContent = '¡Subtema completado!';
    document.getElementById('resultadoTexto').textContent = `Respondiste ${aciertos} de ${total} correctamente. Puesto alcanzado: ${PUESTOS[puestoActual]}.`;
    registrarParticipacionSiAplica().then((resultado) => {
      let detalle = document.getElementById('detalleParticipacion');
      if (!detalle) {
        detalle = document.createElement('p');
        detalle.id = 'detalleParticipacion';
        detalle.style.cssText = 'color:#a89f8d; font-size:0.85rem; margin-top:10px;';
        document.getElementById('final').appendChild(detalle);
      }
      if (resultado.registrado) {
        detalle.textContent = `Se registraron ${resultado.puntos.toFixed(1)} pts de participación.`;
      } else if (resultado.motivo === 'bloque_cerrado') {
        detalle.textContent = 'Este bloque aún no está abierto para responder — inténtalo cuando tu docente lo active.';
      } else if (resultado.motivo === 'sin_sesion' || resultado.motivo === 'sin_id') {
        detalle.textContent = 'Inicia sesión desde Actividades para que tu progreso se guarde.';
      }
    });
  } else {
    document.getElementById('resultadoTitulo').textContent = 'Te faltó alguna';
    document.getElementById('resultadoTexto').textContent = `Respondiste ${aciertos} de ${total} correctamente. Vuelve a contestar TODAS para que cuente.`;
  }
}

document.getElementById('reintentar').onclick = () => {
  indice = 0; aciertos = 0; racha = 0; puestoActual = 0;
  document.getElementById('final').style.display = 'none';
  document.getElementById('juego').style.display = 'block';
  mostrarPregunta();
};

const data = BANCO[subtema];
document.getElementById('tituloSubtema').textContent = data ? `${subtema} ${data.titulo}` : 'Subtema';

crearFondoAmbiental();

if (data) {
  mostrarPregunta();
} else {
  document.getElementById('preguntaTexto').textContent = 'Este subtema todavía no tiene preguntas cargadas.';
}
