<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actividades — Aula Virtual JRG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #f2ece1; color: #17140f; min-height: 100vh; }
  header { background: #17140f; color: #f2ece1; padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  header a { color: #f2ece1; text-decoration: none; font-size: 1.4rem; margin-right: 8px; }
  header h1 { font-size: 1.1rem; }
  header .subtexto { font-size: 0.78rem; color: #cfc6b6; margin-top: 2px; }
  main { padding: 24px; max-width: 700px; margin: 0 auto; }

  label { display: block; font-size: 0.85rem; color: #6b6252; margin-bottom: 4px; margin-top: 16px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #cfc6b6; font-family: inherit; font-size: 1rem; background: #fff;
  }
  button {
    background: #d99a3d; color: #17140f; border: none;
    padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 0.95rem; cursor: pointer;
  }
  .btn-principal { width: 100%; margin-top: 16px; }
  .btn-salir {
    margin-left: auto; margin-right: 56px; background: none; border: 1px solid #d99a3d; color: #d99a3d;
    padding: 8px 14px; font-size: 0.8rem; white-space: nowrap;
  }

  .texto-ayuda { color: #6b6252; font-size: 0.9rem; line-height: 1.5; margin: 6px 0 14px; }
  .mensaje-error { color: #b04a3a; font-size: 0.88rem; margin-top: 8px; display: none; }
  .cargando { text-align: center; color: #6b6252; padding: 60px 0; }

  .saludo { font-size: 1.1rem; margin-bottom: 18px; }

  h3.nombre-bloque {
    font-size: 0.85rem; color: #b5772a; text-transform: uppercase; letter-spacing: 0.5px;
    margin: 20px 0 10px;
  }
  h3.nombre-bloque:first-of-type { margin-top: 0; }

  .tarjeta-subtema {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid #e2d9c6; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; text-decoration: none; color: #17140f;
  }
  .tarjeta-subtema .icono-estado { font-size: 1.3rem; flex-shrink: 0; width: 28px; text-align: center; }
  .tarjeta-subtema .info-subtema { flex: 1; }
  .tarjeta-subtema .clave-subtema { font-size: 0.78rem; color: #b5772a; font-weight: bold; }
  .tarjeta-subtema .titulo-subtema { font-size: 0.95rem; margin-top: 2px; }
  .tarjeta-subtema .flecha { color: #a89f8d; font-size: 1.1rem; }

  .nota-bloque-cerrado {
    background: #ece2cd; border-radius: 8px; padding: 8px 12px; font-size: 0.78rem;
    color: #7a4a1f; margin: -4px 0 12px;
  }
</style>
</head>
<body>

<div id="pantallaLogin">
  <header><h1>Actividades</h1></header>
  <main>
    <h2 style="margin-bottom:6px;">Bases Culinarias</h2>
    <p class="texto-ayuda">Ingresa tu nombre completo y tu PIN para empezar a responder tus actividades.</p>
    <label>Nombre completo</label>
    <input id="inputNombreAlumno" type="text" placeholder="Nombre y apellido">
    <label>PIN</label>
    <input id="inputPinAlumno" type="text" inputmode="numeric" placeholder="4 dígitos" maxlength="4">
    <button class="btn-principal" id="btnEntrarActividades">Entrar</button>
    <div id="mensajeErrorLogin" class="mensaje-error"></div>
  </main>
</div>

<div id="pantallaActividades" style="display:none;">
  <header>
    <a href="index.html">←</a>
    <div>
      <h1>Bases Culinarias</h1>
      <div class="subtexto">Aula Virtual · Actividades (Participación)</div>
    </div>
    <button class="btn-salir" id="btnCerrarSesionActividades">Salir</button>
  </header>
  <main>
    <div class="saludo" id="saludoAlumno"></div>
    <div id="contenidoActividades"><div class="cargando">Cargando…</div></div>
  </main>
</div>

<script>
const CLAVE_SESION_ANTIGUA = 'jrg_alumno';
let db = null, fx = {};

const BLOQUES = {
  '1': {
    nombre: 'Bloque 1 — Conceptos y definiciones de cocina',
    subtemas: [
      { clave: '1.1', titulo: 'Géneros y elaboraciones culinarias sencillas' },
      { clave: '1.2', titulo: 'Elaboración culinaria básica' },
      { clave: '1.3', titulo: 'Equipos e instrumentos de medida' },
      { clave: '1.4', titulo: 'Tablas de temperaturas y manuales de equipos' },
      { clave: '1.5', titulo: 'Unidades y pesos establecidos para alimentos y bebidas' },
    ],
  },
  '2': {
    nombre: 'Bloque 2 — Conocimiento y manipulación de materias primas',
    subtemas: [
      { clave: '2.1', titulo: 'Aprovisionamiento de materias primas' },
      { clave: '2.2', titulo: 'Materias primas de uso común' },
      { clave: '2.3', titulo: 'Variedades y características físicas' },
      { clave: '2.4', titulo: 'Cualidades gastronómicas' },
    ],
  },
  '3': {
    nombre: 'Bloque 3 — Desarrollo de habilidades para la cocina',
    subtemas: [
      { clave: '3.1', titulo: 'Conocimientos generales para la elaboración de platillos' },
      { clave: '3.2.1', titulo: 'Carnes, aves, pescados y mariscos' },
      { clave: '3.2.2', titulo: 'Vegetales y frutos' },
      { clave: '3.2.3', titulo: 'Semillas y cereales' },
      { clave: '3.2.4', titulo: 'Hierbas y especias' },
    ],
  },
};

(async () => {
  try {
    const fbConfig = await import('./firebase-config.js');
    const firestoreMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    db = fbConfig.db;
    fx = firestoreMod;

    const guardado = localStorage.getItem(CLAVE_SESION_ANTIGUA);
    if (guardado) {
      const alumno = JSON.parse(guardado);
      if (alumno.id && alumno.grupo) mostrarPantallaActividades(alumno);
    }
  } catch (err) {
    document.getElementById('contenidoActividades').innerHTML =
      '<p class="texto-ayuda">No se pudo conectar: ' + err.message + '</p>';
  }
})();

document.getElementById('btnEntrarActividades').onclick = async () => {
  const nombre = document.getElementById('inputNombreAlumno').value.trim();
  const pin = document.getElementById('inputPinAlumno').value.trim();
  const mensajeError = document.getElementById('mensajeErrorLogin');
  mensajeError.style.display = 'none';

  if (!nombre || !pin) {
    mensajeError.textContent = 'Escribe tu nombre y tu PIN.';
    mensajeError.style.display = 'block';
    return;
  }
  if (!db) {
    mensajeError.textContent = 'Aún no hay conexión, espera un momento e intenta de nuevo.';
    mensajeError.style.display = 'block';
    return;
  }

  try {
    const q = fx.query(
      fx.collectionGroup(db, 'alumnos'),
      fx.where('nombre', '==', nombre),
      fx.where('pin', '==', pin)
    );
    const snap = await fx.getDocs(q);
    if (snap.empty) {
      mensajeError.textContent = 'No encontramos ese nombre y PIN. Verifica con tu profesor.';
      mensajeError.style.display = 'block';
      return;
    }
    const docAlumno = snap.docs[0];
    const segmentos = docAlumno.ref.path.split('/');
    const materia = segmentos[1];
    const grupo = segmentos[3];
    const alumno = { id: docAlumno.id, nombre: docAlumno.data().nombre, grupo, materia };
    localStorage.setItem(CLAVE_SESION_ANTIGUA, JSON.stringify(alumno));
    mostrarPantallaActividades(alumno);
  } catch (err) {
    mensajeError.textContent = 'Ocurrió un error al buscar tus datos: ' + err.message;
    mensajeError.style.display = 'block';
  }
};

document.getElementById('btnCerrarSesionActividades').onclick = () => {
  localStorage.removeItem(CLAVE_SESION_ANTIGUA);
  document.getElementById('pantallaActividades').style.display = 'none';
  document.getElementById('pantallaLogin').style.display = 'block';
};

async function mostrarPantallaActividades(alumno) {
  document.getElementById('pantallaLogin').style.display = 'none';
  document.getElementById('pantallaActividades').style.display = 'block';
  document.getElementById('saludoAlumno').innerHTML = `Hola, <strong>${alumno.nombre}</strong>`;

  const materia = alumno.materia || 'bases-culinarias';
  const cont = document.getElementById('contenidoActividades');
  cont.innerHTML = '<div class="cargando">Cargando…</div>';

  try {
    const [snapPart, snapConfig] = await Promise.all([
      fx.getDocs(fx.collection(db, 'materias', materia, 'grupos', alumno.grupo, 'alumnos', alumno.id, 'participacion')),
      fx.getDoc(fx.doc(db, 'materias', materia, 'grupos', alumno.grupo, 'config', 'bloquesAbiertos')),
    ]);
    const completados = new Set(snapPart.docs.map((d) => d.id));
    const config = snapConfig.exists() ? snapConfig.data() : {};

    let html = '';
    ['1', '2', '3'].forEach((b) => {
      const abierto = config['bloque' + b] === true;
      html += `<h3 class="nombre-bloque">${BLOQUES[b].nombre}</h3>`;
      if (!abierto) {
        html += `<div class="nota-bloque-cerrado">Puedes leer y practicar, pero tus respuestas no sumarán puntos hasta que tu docente abra este bloque.</div>`;
      }
      BLOQUES[b].subtemas.forEach((s) => {
        const hecho = completados.has(s.clave);
        html += `
          <a class="tarjeta-subtema" href="actividad.html?materia=${materia}&subtema=${s.clave}">
            <span class="icono-estado">${hecho ? '✅' : '📖'}</span>
            <div class="info-subtema">
              <div class="clave-subtema">${s.clave}</div>
              <div class="titulo-subtema">${s.titulo}</div>
            </div>
            <span class="flecha">→</span>
          </a>`;
      });
    });
    cont.innerHTML = html;
  } catch (err) {
    cont.innerHTML = '<p class="texto-ayuda">No se pudo cargar tus actividades: ' + err.message + '</p>';
  }
}
</script>
<script src="menu.js?v=4"></script>
<script src="musica.js?v=2"></script>
</body>
</html>
